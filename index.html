<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тренировки</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тренировки">
<meta name="theme-color" content="#14171C">
<link rel="apple-touch-icon" href="icon-v2.png">
<style>
:root{
  --flash:#E0102E; --flashbg:rgba(224,16,46,.12);
  --iron:#14171C; --surface:#1E232B; --surface2:#262C36; --line:#333B47;
  --chalk:#F2F0EB; --mute:#8B95A5;
  --red:#C8102E; --blue:#1266B0; --green:#2A8A4A; --yellow:#F2C300;
  --day:var(--blue);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--iron);color:var(--chalk);font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font-family:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}

/* шапка */
header{position:sticky;top:0;z-index:20;background:var(--iron);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.days{display:flex;gap:6px;padding:12px 14px 8px;max-width:640px;margin:0 auto}
.day{flex:1;border:none;border-radius:10px;padding:10px 4px 8px;cursor:pointer;background:var(--surface);color:var(--mute);
  font-family:"Helvetica Neue",Arial,sans-serif;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
  line-height:1.15;border-bottom:3px solid transparent;transition:.15s;min-width:0}
.day.on{background:var(--surface2);color:var(--chalk)}
.day.on[data-d="0"]{border-bottom-color:var(--blue)}
.day.on[data-d="1"]{border-bottom-color:var(--red)}
.day.on[data-d="2"]{border-bottom-color:var(--green)}
.day.wide{flex:0 0 40px;font-size:16px;padding:10px 2px;text-transform:none}
.ago{font-size:9.5px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--mute);margin-top:4px}
.ago.late{color:#FF6B6B;font-weight:700}
.tempmark{color:var(--yellow);font-size:9.5px;margin-top:3px;text-transform:none;letter-spacing:0}
.bar{display:flex;align-items:center;gap:8px;padding:0 14px 12px;max-width:640px;margin:0 auto}
.bar-label{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;flex-shrink:0}
.gyms{display:flex;gap:5px;flex:1;overflow-x:auto;scrollbar-width:none}
.gyms::-webkit-scrollbar{display:none}
.gym{flex:1 0 auto;border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:8px;
  padding:7px 10px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap}
.gym.on{background:var(--chalk);color:var(--iron);border-color:var(--chalk)}
.gym.add{flex:0 0 38px;min-width:38px;border-style:dashed;font-size:15px}

.title{font-family:"Helvetica Neue",Arial,sans-serif;font-size:19px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin:16px 0 2px}
.sub{font-size:12px;color:var(--mute);margin-bottom:6px}
.warn,.nag{border-radius:10px;padding:10px 13px;font-size:12.5px;margin:8px 0;cursor:pointer;line-height:1.4}
.warn{background:rgba(200,16,46,.13);border:1px solid rgba(200,16,46,.4);color:#FF8A8A}
.nag{background:rgba(242,195,0,.1);border:1px solid rgba(242,195,0,.35);color:var(--yellow)}

/* карточка */
.card{background:var(--surface);border-radius:14px;margin:12px 0;overflow:hidden;border-left:3px solid var(--day)}
.card-top{padding:14px 16px 12px}
.slot{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;font-weight:500;color:var(--mute);text-transform:uppercase;
  letter-spacing:.1em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.scheme{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11px;color:var(--chalk);
  cursor:pointer;flex-shrink:0;font-family:-apple-system,sans-serif;font-weight:600;letter-spacing:0}
.stag{display:inline-block;margin-left:7px;font-size:9.5px;letter-spacing:.02em;text-transform:none;color:#FF8A8A;
  border:1px solid rgba(200,16,46,.45);border-radius:5px;padding:0 5px;vertical-align:1px}
.pick{width:100%;margin-top:8px;background:var(--surface2);color:var(--chalk);border:1px solid var(--line);border-radius:9px;
  padding:11px 34px 11px 12px;font-size:15px;font-weight:500;appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%238B95A5' stroke-width='2' fill='none'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center}
.pick:disabled{opacity:.6;background-image:none}
.board{display:flex;align-items:baseline;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.board-num{font-family:"Helvetica Neue",Arial,sans-serif;font-size:44px;font-weight:700;transform:scaleX(.92);transform-origin:left;
  line-height:.85;font-variant-numeric:tabular-nums;cursor:pointer}
.board-unit{font-family:"Helvetica Neue",Arial,sans-serif;font-size:14px;color:var(--mute);font-weight:500}
.board-tag{margin-left:auto;font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;text-align:right;line-height:1.4}
.prog{margin-left:auto;align-self:center;background:rgba(42,138,74,.18);border:1px solid #2A8A4A;color:#5FD08A;
  border-radius:8px;padding:7px 10px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.note{margin-top:9px;font-size:12.5px;color:var(--yellow);cursor:pointer}
.edit{display:flex;gap:6px;margin-top:10px}
.eb{flex:1;background:transparent;border:1px dashed var(--line);color:var(--mute);border-radius:8px;padding:8px 4px;
  font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.eb:active{background:var(--surface2)}
.eb:disabled{opacity:.3}
.eb.mv{flex:0 0 40px;font-size:15px;line-height:1}
.eb.yt{flex:0 0 40px;color:#FF4B4B;border-color:rgba(255,75,75,.35);font-size:11px}
.sets{border-top:1px solid var(--line);background:rgba(0,0,0,.15)}
.set{display:flex;align-items:center;gap:8px;padding:9px 16px;border-bottom:1px solid rgba(51,59,71,.5)}
.set:last-child{border-bottom:none}
.set-n{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;color:var(--mute);width:18px;flex-shrink:0;font-weight:500}
.inp{background:var(--surface2);border:1px solid var(--line);border-radius:8px;color:var(--chalk);font-family:"Helvetica Neue",Arial,sans-serif;
  font-size:17px;font-weight:600;padding:8px 6px;text-align:center;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.inp:focus{outline:none;border-color:var(--day);background:#2C3441}
.inp::placeholder{color:#4E5765;font-weight:400}
.f{flex:1;min-width:0}
.sep{color:var(--mute);font-size:13px;flex-shrink:0}
.done{width:38px;height:38px;flex-shrink:0;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--mute);font-size:16px}
.done.on{background:var(--day);border-color:var(--day);color:#fff}
.hint{padding:9px 16px;font-size:11.5px;color:var(--mute);border-top:1px solid rgba(51,59,71,.5);line-height:1.45}
.hint b{color:var(--chalk);font-weight:600}
.addex{width:100%;margin:6px 0 12px;background:transparent;border:1px dashed var(--line);color:var(--mute);border-radius:12px;
  padding:14px;font-size:14px;font-weight:600;cursor:pointer}
.hidebtn{width:100%;margin:2px 0 12px;background:transparent;border:1px dashed var(--line);color:var(--mute);border-radius:10px;padding:10px;font-size:12px;cursor:pointer}
.danger{color:#FF6B6B!important;border-color:rgba(200,16,46,.45)!important}

/* низ */
.foot{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--iron);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.foot-in{display:flex;gap:8px;align-items:center;max-width:640px;margin:0 auto}
.stat{flex:1;min-width:0;font-size:11px;color:var(--mute);line-height:1.35}
.stat b{color:var(--chalk);font-family:"Helvetica Neue",Arial,sans-serif;font-size:15px;font-weight:600}
.btn{border:none;border-radius:11px;padding:13px 16px;cursor:pointer;font-size:15px;font-weight:700;background:var(--day);color:#fff}
.btn.ghost{background:var(--surface2);color:var(--chalk);font-weight:600;padding:13px 14px}
.btn.go{flex:0 0 42%;padding:15px 10px;font-size:16px;letter-spacing:.02em}
.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--chalk);color:var(--iron);padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;
  transition:.25s;pointer-events:none;z-index:70;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.rest{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);
  background:var(--surface2);border:1px solid var(--day);color:var(--chalk);border-radius:22px;padding:9px 18px;font-size:14px;
  z-index:30;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;cursor:pointer}
.rest b{font-family:"Helvetica Neue",Arial,sans-serif;font-size:18px;font-variant-numeric:tabular-nums;margin:0 4px}
.rest .x{color:var(--mute);margin-left:4px}
.rest.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}

/* модалка */
#modal{position:fixed;inset:0;z-index:60;background:var(--iron);display:none;overflow-y:auto;
  padding:0 14px 40px;padding-top:calc(20px + env(safe-area-inset-top))}
.mwrap{max-width:600px;margin:0 auto}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.mhead b{font-size:16px}
.mgroup{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:16px 0 7px}
.mitem{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);color:var(--chalk);border-radius:11px;
  padding:13px 15px;font-size:14px;margin-bottom:7px;cursor:pointer;display:flex;align-items:center;gap:9px}
.mitem:active{background:var(--surface2)}
.mitem small{color:var(--mute);font-size:11.5px;margin-left:auto;text-align:right}
.mnote{color:var(--mute);font-size:12.5px;line-height:1.6;margin:4px 0 14px}
.minput{width:100%;padding:13px 14px;border-radius:11px;font-size:16px;border:1px solid var(--line);background:rgba(0,0,0,.25);
  color:inherit;font-family:inherit;margin-bottom:10px}
.mrow{display:flex;gap:8px}
.mbtn{justify-content:center;font-weight:600}
.mbtn.ok{background:var(--day);border-color:var(--day)}
.ytmini{flex-shrink:0;color:#FF4B4B;font-size:12px;padding:4px 9px;border:1px solid rgba(255,75,75,.3);border-radius:7px;cursor:pointer}

/* история */
#hist{position:fixed;inset:0;z-index:50;background:var(--iron);overflow-y:auto;
  padding:14px 14px calc(24px + env(safe-area-inset-bottom));padding-top:calc(14px + env(safe-area-inset-top))}
.hwrap{max-width:600px;margin:0 auto}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.hhead b{font-size:16px;font-weight:600}
.hchips{display:flex;gap:5px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.hchips .gym{flex:0 0 auto}
.hempty{color:var(--mute);font-size:13px;line-height:1.6;padding:20px 4px}
.hcard{background:var(--surface);border-radius:13px;padding:13px 15px;margin-bottom:11px;border:1px solid var(--line)}
.hname{font-size:14.5px;font-weight:600;margin-bottom:8px}
.hname small{display:block;font-weight:400;color:var(--mute);font-size:12px;margin-top:2px}
.htop2{display:flex;align-items:center;gap:9px;margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.htop2 .up{color:#5FD08A;font-size:12.5px;font-weight:600}
.htop2 .dn{color:#FF6B6B;font-size:12.5px;font-weight:600}
.htop2 .fl{color:var(--mute);font-size:12.5px}
.htop2 .stag{margin-left:0}
.hcnt{color:var(--mute);font-size:11.5px;margin-right:auto}
.hrow{display:flex;gap:11px;padding:4px 0;font-size:12.5px;align-items:baseline}
.hdate{color:var(--mute);width:42px;flex-shrink:0;font-variant-numeric:tabular-nums}
.hsets{font-variant-numeric:tabular-nums;flex:1}
.hsets i{color:var(--mute);font-style:normal}
.hg{color:var(--mute);font-size:10.5px;flex-shrink:0}
.weeks{display:flex;gap:5px;align-items:flex-end}
.wk{flex:1;text-align:center;min-width:0}
.wkv{font-size:9.5px;color:var(--chalk);height:13px}
.wkb{height:64px;background:rgba(0,0,0,.25);border-radius:5px;display:flex;align-items:flex-end;overflow:hidden}
.wkb i{display:block;width:100%;background:var(--day);border-radius:5px 5px 0 0}
.wkl{font-size:9.5px;color:var(--mute);margin-top:4px}
.wkn{font-size:9px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.flash{position:fixed;inset:0;z-index:25;pointer-events:none;border:0 solid var(--flash);opacity:0}
.flash.on{border-width:10px;animation:blink .8s steps(2,start) infinite;opacity:1;background:var(--flashbg)}
@keyframes blink{to{opacity:0}}
.rest.end{background:var(--flash)!important;border-color:var(--flash)!important;color:#fff!important;font-size:16px;font-weight:800;
  padding:14px 22px;animation:blink2 .8s ease-in-out infinite}
@keyframes blink2{50%{transform:translateX(-50%) scale(1.06)}}
@media (prefers-reduced-motion:reduce){.flash.on,.rest.end{animation:none}}
</style>
</head>
<body>
<header>
  <div class="days" id="days"></div>
  <div class="bar"><span class="bar-label">Зал</span><div class="gyms" id="gyms"></div></div>
</header>
<div class="wrap">
  <div class="title" id="dayTitle"></div>
  <div class="sub" id="daySub"></div>

</div>
<div class="foot"><div class="foot-in">

  <button class="btn ghost" onclick="showHist()" title="История">📈</button>

</div></div>
<div class="flash" id="flash"></div>
<div class="rest" id="rest"></div>

function blankCustom(){
  return {vars:{}, ex:{}, order:{}, gyms:null, w:{}, hidden:{}, schemes:{}, temp:[],
          unit:{}, notes:{}, rest:120, lastExport:null};
}
function num(x){ const n=parseFloat(String(x==null?"":x).replace(",",".")); return isNaN(n)?0:n; }
function fmt(n){ return String(Math.round(n*100)/100).replace(".",","); }
function h(t){ return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }
function esc(t){ return String(t).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function localDate(dt){ dt=dt||new Date();
  return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0"); }
function daysBetween(a,b){ return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5); }
function ddmm(s){ return s.slice(8,10)+"."+s.slice(5,7); }
function mmss(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function saveCustom(){ try{ localStorage.setItem(P+"custom", JSON.stringify(custom)); }catch(e){} }

/* ── модель: приводим старые форматы (его и Анин) к одному виду ── */
function normVar(v, mine){
  if(!Array.isArray(v)) return {name:v.name, w:(v.w||[0]).slice(), mine:!!(v.mine||mine)};
  const w = Array.isArray(v[1]) ? v[1].slice() : [v[1]==null?0:v[1]];
  return {name:v[0], w:w, mine:!!(v[2]||mine)};
}
function normEx(x, mine){
  let o;
  if(!Array.isArray(x)){
    o={name:x.name, scheme:x.scheme||"3×12", n:x.n||parseInt(x.scheme)||3, motto:x.motto||"",
       mine:!!mine, vars:(x.vars||[]).map(v=>normVar(v,mine))};
  } else {
    const anya = typeof x[3]==="string";
    const vars = (anya ? x[4] : x[3]) || [];
    o={name:x[0], scheme:x[1], n:x[2], motto:anya?x[3]:"", mine:!!mine||!!(anya?x[5]:x[4]),
       vars:vars.map(v=>normVar(v,mine))};
  }
  if(!o.vars.length) o.vars=[{name:o.name, w:[0], mine:!!mine}];
  o.scheme=String(o.scheme||"").replace(/(\d)\s*[xх]\s*(\d)/i,"$1×$2");
  return o;
}
function exOut(ex){ return {name:ex.name, scheme:ex.scheme, n:ex.n, motto:ex.motto||"", vars:ex.vars.map(v=>[v.name, v.w.slice()])}; }

function buildDays(){
  DAYS = BASE.map(d=>({name:d.name, short:d.short||"", id:null, ex:d.ex.map(x=>normEx(x,false))}));
  (custom.temp||[]).forEach(t=>DAYS.push({name:t.name, short:t.name, id:t.id, temp:true,
    ex:(t.ex||[]).map(x=>normEx(x,true))}));
}
function dk(d){ return DAYS[d] && DAYS[d].id ? DAYS[d].id : String(d); }
function dIdx(key){ return DAYS.findIndex((x,i)=>dk(i)===String(key)); }
function exAt(d,e){ return DAYS[d] && DAYS[d].ex[e]; }
function key(d,e){ return dk(d)+"||"+exAt(d,e).name; }

function applyCustom(){
  buildDays();
  Object.keys(custom.ex||{}).forEach(k=>{
    const d=dIdx(k); if(d<0) return;
    (custom.ex[k]||[]).forEach(x=>{ const o=normEx(x,true);
      if(!DAYS[d].ex.some(q=>q.name===o.name)) DAYS[d].ex.unshift(o); });
  });
  Object.keys(custom.schemes||{}).forEach(k=>{
    const i=k.indexOf("|"); const d=dIdx(k.slice(0,i)); if(d<0) return;
    const ex=DAYS[d].ex.find(q=>q.name===k.slice(i+1));
    if(ex){ ex.scheme=custom.schemes[k].s; ex.n=custom.schemes[k].n||parseInt(ex.scheme)||3; }
  });
  Object.keys(custom.order||{}).forEach(k=>{
    const d=dIdx(k); if(d<0) return;
    const by={}; DAYS[d].ex.forEach(x=>by[x.name]=x);
    const out=[]; (custom.order[k]||[]).forEach(n=>{ if(by[n]){ out.push(by[n]); delete by[n]; } });
    DAYS[d].ex.forEach(x=>{ if(by[x.name]) out.push(x); });
    DAYS[d].ex=out;
  });
  Object.keys(custom.vars||{}).forEach(k=>{
    const p=k.split("||"); if(p.length<2) return;
    const d=dIdx(p[0]); if(d<0) return;
    const ex=DAYS[d].ex.find(x=>x.name===p[1]); if(!ex) return;
    (custom.vars[k]||[]).forEach(v=>{ const o=normVar(v,true);
      if(!ex.vars.some(q=>q.name===o.name)) ex.vars.push(o); });
  });
}

/* ── веса, единицы, тип ── */
function wKey(d,e,vi,g){ const ex=exAt(d,e), v=ex.vars[vi]; return dk(d)+"||"+ex.name+"||"+(v?v.name:"#"+vi)+"||"+g; }
function wGet(d,e,vi,g){
  const k=wKey(d,e,vi,g);
  if(custom.w && custom.w[k]!=null) return custom.w[k];
  const v=exAt(d,e).vars[vi]; if(!v) return 0;
  return v.w[g]!=null ? v.w[g] : (v.w[0]!=null ? v.w[0] : 0);
}
function wSet(d,e,vi,g,val){ custom.w=custom.w||{}; custom.w[wKey(d,e,vi,g)]=val; }
function cur(d,e){
  const ex=exAt(d,e), k=key(d,e);
  let st=state[k];
  if(!st) st=state[k]={v:0, vn:ex.vars[0].name, sets:[]};
  if(st.vn){ const i=ex.vars.findIndex(v=>v.name===st.vn); st.v=i>=0?i:0; }
  if(!(st.v>=0 && st.v<ex.vars.length)) st.v=0;
  st.vn=ex.vars[st.v].name;
  st.sets=st.sets||[];
  while(st.sets.length<ex.n) st.sets.push({w:"",r:"",t:"",done:false});
  if(st.sets.length>ex.n) st.sets.length=ex.n;
  return st;
}
function recWeight(d,e){ return wGet(d,e,cur(d,e).v,gym)||0; }
function uKey(d,e,vi){ const ex=exAt(d,e); return dk(d)+"||"+ex.name+"||"+((ex.vars[vi]||{}).name||""); }
function defUnit(vn){ return (T.handRe||/гантел/i).test(vn||"") ? "hand" : ""; }
function unitOf(d,e,vi){ const k=uKey(d,e,vi);
  if(custom.unit && custom.unit[k]!=null) return custom.unit[k];
  return defUnit((exAt(d,e).vars[vi]||{}).name); }
function unitLabel(u){ return u==="hand" ? "кг/рука" : u==="pair" ? "кг · пара" : "кг"; }
function mult(u){ return u==="hand" ? 2 : 1; }
function convW(w,from,to){ if(from===to) return w; if(from==="hand"&&to==="pair") return w*2; if(from==="pair"&&to==="hand") return w/2; return w; }
function isTimeName(n){ return /планк/i.test(n||""); }
function isTime(d,e,vi){ const ex=exAt(d,e); const v=ex.vars[vi];
  return isTimeName(v?v.name:ex.name) || (ex.vars.length===1 && isTimeName(ex.name)); }
function hiddenList(d){ return (custom.hidden||{})[dk(d)] || []; }
function isHidden(d,name){ return hiddenList(d).includes(name); }
function topReps(s){ const m=String(s||"").match(/[×xх*]\s*(\d+)/i); return m?+m[1]:0; }
function stepFor(w,u){ if(u==="hand") return w>=10?2:1; return w>=20?2.5:(w>0?1:0); }

/* ── история ── */
function maxW(sets){ let m=0; (sets||[]).forEach(s=>{ const w=num(s.w); if(w>m) m=w; }); return m; }
function maxT(sets){ let m=0; (sets||[]).forEach(s=>{ const t=num(s.t); if(t>m) m=t; }); return m; }
function itemTon(it){ if(it.time) return 0; let v=0; (it.sets||[]).forEach(s=>{ v+=num(s.w)*num(s.r); }); return v*mult(it.unit); }
function recTon(r){ return (r.items||[]).reduce((a,it)=>a+itemTon(it),0); }

function guessVar(d, ex, mx){
  if(ex.vars.length===1) return ex.vars[0].name;
  const tv=ex.vars.find(v=>isTimeName(v.name));
  if(tv && mx>0 && mx<=3) return tv.name;
  if(!mx) return "";
  const e=DAYS[d].ex.indexOf(ex);
  let best=null, bd=Infinity;
  ex.vars.forEach((v,vi)=>{
    for(let g=0; g<Math.max(GYMS.length,1); g++){
      const w=num(wGet(d,e,vi,g));
      if(w>0){ const dd=Math.abs(w-mx)/Math.max(w,mx); if(dd<bd){ bd=dd; best=v.name; } }
    }
  });
  return (best && bd<=0.12) ? best : "";
}
function migrateRec(o){
  const dkey=String(o.day), d=dIdx(dkey);
  o.day=dkey;
  o.items=(o.items||[]).map(it=>{
    const fx=(T.fix||{})[o.date+"|"+dkey+"|"+it.name]||{};
    const ex = d>=0 ? DAYS[d].ex.find(x=>x.name===it.name) : null;
    let sets=(it.sets||[]).map(s=>({w:s.w==null?"":String(s.w), r:s.r==null?"":String(s.r)}));
    if(fx.div) sets=sets.map(s=>({w:s.w?fmt(num(s.w)/fx.div):"", r:s.r}));
    let vn = it.v || fx.v || (ex ? guessVar(d, ex, maxW(sets)) : it.name);
    const time = isTimeName(vn) || ((!ex || ex.vars.length===1) && isTimeName(it.name));
    if(time) sets=sets.map(s=>{ const a=num(s.w), b=num(s.r); return {t:String(Math.round((a&&b?a*b:(a||b))*60))}; });
    let unit = it.unit!=null ? it.unit : (fx.unit!=null ? fx.unit : defUnit(vn));
    if(fx.div===2) unit="hand";
    const out={name:it.name, v:vn, unit:unit, sets:sets}; if(time) out.time=true;
    return out;
  });
  o.gym=o.gym||null; o.v=4;
  return o;
}
function loadHist(){
  HIST=[];
  const keys=[];
  for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.indexOf(P+"hist:")===0) keys.push(k); }
  keys.forEach(k=>{
    try{
      let o=JSON.parse(localStorage.getItem(k)); if(!o || !o.items) return;
      if(o.v!==4){ o=migrateRec(o); localStorage.setItem(k, JSON.stringify(o)); }
      o._k=k; HIST.push(o);
    }catch(e){}
  });
  HIST.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
}
function histItems(name, vn, dkey){
  const out=[];
  HIST.forEach(r=>{ if(dkey!=null && r.day!==dkey) return;
    (r.items||[]).forEach(it=>{ if(it.name===name && (vn==null || it.v===vn)) out.push({rec:r, it:it}); }); });
  return out;
}
function lastFor(d,e){
  const ex=exAt(d,e);
  return histItems(ex.name, null, dk(d))[0] || histItems(ex.name, null, null)[0] || null;
}
function progFor(d,e){
  const ex=exAt(d,e), st=cur(d,e);
  if(isTime(d,e,st.v)) return null;
  const L=histItems(ex.name, st.vn, dk(d))[0] || histItems(ex.name, st.vn, null)[0];
  if(!L) return null;
  const top=topReps(ex.scheme); if(!top) return null;
  const sets=L.it.sets.filter(s=>num(s.w)>0);
  if(sets.length<ex.n) return null;
  if(!sets.every(s=>num(s.r)>=top)) return null;
  const u=unitOf(d,e,st.v);
  const base=convW(Math.min(...sets.map(s=>num(s.w))), L.it.unit||"", u);
  const to=Math.round((base+stepFor(base,u))*10)/10;
  if(to<=num(recWeight(d,e))) return null;
  return {from:base, to:to};
}
function stagFor(name, vn, scheme){
  if(topReps(scheme)>=15) return 0;
  const L=histItems(name, vn, null).filter(x=>!x.it.time && maxW(x.it.sets)>0);
  if(L.length<3) return 0;
  const curMax=maxW(L[0].it.sets);
  let first=L[0];
  L.forEach(x=>{ if(maxW(x.it.sets)>=curMax) first=x; });
  const days=daysBetween(first.rec.date, L[0].rec.date);
  return days>=28 ? Math.floor(days/7) : 0;
}
function daysSince(dkey){
  const r=HIST.find(x=>x.day===dkey);
  return r ? daysBetween(r.date, localDate()) : null;
}

/* ── шапка ── */
function drawHeader(){
  $("#days").innerHTML = DAYS.map((x,i)=>{
    const n = x.temp ? null : daysSince(dk(i));
    const ago = n==null ? "" : `<div class="ago ${n>7?'late':''}">${n===0?'сегодня':n+' дн'}</div>`;
    return `<button class="day ${i===day?'on':''}" data-d="${i%3}" onclick="setDay(${i})">${x.short || x.name.replace(" + ","<br>+ ")}${x.temp?'<div class="tempmark">разовая</div>':ago}</button>`;
  }).join("")
    + `<button class="day wide" onclick="showBase()" title="База упражнений">📚</button>`
    + `<button class="day wide" onclick="addTempDay()" title="Разовая тренировка">＋</button>`;
  $("#gyms").innerHTML = GYMS.map((g,i)=>
    `<button class="gym ${i===gym?'on':''}" onclick="${i===gym?'editGym()':'setGym('+i+')'}">${h(g)}</button>`).join("")
    + `<button class="gym add" onclick="addGym()">＋</button>`;
  $("#dayTitle").textContent = DAYS[day] ? DAYS[day].name : "";
  const hid=hiddenList(day).length;
  $("#daySub").textContent = DAYS[day]
    ? `Зал: ${GYMS[gym]} · ${DAYS[day].ex.filter(x=>!isHidden(day,x.name)).length} упражнений${hid?` · скрыто ${hid}`:""} · v${T.appv}` : "";
}

/* ── карточка ── */
function setsHTML(e, st, w, time, u){
  const step=stepFor(num(w),u);
  return st.sets.map((s,i)=>{
    const isLast=i===st.sets.length-1;
    const plus=T.lastPlus && isLast && num(w) && step && !time;
    const ph = time ? "сек" : (plus ? fmt(num(w)+step) : (w||"кг"));
    const num1 = T.kind==="anya"
      ? `<span class="sn">Подход ${i+1}${plus?' <i>+</i>':''}</span>`
      : `<span class="set-n">${i+1}</span>`;
    const inputs = time
      ? `<div class="f"><input class="inp" type="text" inputmode="numeric" placeholder="сек" value="${h(s.t)}" oninput="upd(${e},${i},'t',this.value)"></div><span class="sep">сек</span>`
      : `<div class="f"><input class="inp" type="text" inputmode="decimal" placeholder="${h(ph)}" value="${h(s.w)}" oninput="upd(${e},${i},'w',this.value)"></div>
         <span class="sep">/</span>
         <div class="f"><input class="inp" type="text" inputmode="numeric" placeholder="повт" value="${h(s.r)}" oninput="upd(${e},${i},'r',this.value)"></div>`;
    const btn = T.kind==="anya"
      ? `<button class="chk ${s.done?'on':''}" onclick="tog(${e},${i})">${s.done?'<svg width="12" height="9" viewBox="0 0 13 10"><path d="M1 5l4 3.5L12 1" stroke="#241A21" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}</button>`
      : `<button class="done ${s.done?'on':''}" onclick="tog(${e},${i})">✓</button>`;
    return `<div class="set">${num1}${inputs}${btn}</div>`;
  }).join("");
}
function lastHTML(L, d, e){
  if(!L) return "";
  const it=L.it, r=L.rec;
  const body = it.time ? it.sets.map(s=>mmss(num(s.t))).join("  ")
    : it.sets.map(s=>s.w?(s.r?`${s.w}×${s.r}`:`${s.w}`):"—").join("  ");
  const vnote = it.v && it.v!==cur(d,e).vn ? ` · ${h(it.v)}` : "";
  const unit = !it.time && it.unit==="hand" ? " /рука" : !it.time && it.unit==="pair" ? " пара" : "";
  return `<div class="hint">Прошлый раз ${ddmm(r.date)}${r.gym?" · "+h(r.gym):""}${vnote}: <b>${body}</b>${unit}</div>`;
}
function cardHTML(ex, e, pos, total){
  const st=cur(day,e), w=recWeight(day,e), vi=st.v;
  const time=isTime(day,e,vi), u=unitOf(day,e,vi);
  const vname=st.vn || ex.name;
  const opts=ex.vars.map((v,i)=>{ const vw=wGet(day,e,i,gym);
    return `<option value="${i}" ${i===vi?'selected':''}>${h(v.name)}${vw&&!isTime(day,e,i)?' · '+vw+' '+unitLabel(unitOf(day,e,i)):''}</option>`; }).join("");
  const pr=progFor(day,e);
  const stag=time?0:stagFor(ex.name, vname, ex.scheme);
  const note=(custom.notes||{})[dk(day)+"||"+ex.name+"||"+GYMS[gym]];
  const L=lastFor(day,e);
  const noteH = note ? `<div class="note" onclick="editNote(${e})">📝 ${h(note)}</div>` : "";
  const stagH = stag ? `<span class="stag" title="вес не растёт">застой ${stag} нед</span>` : "";
  const progH = pr ? `<button class="prog" onclick="acceptProg(${e},${pr.to})">↑ пора ${fmt(pr.to)}</button>` : "";
  const edit = `<div class="edit">
      <button class="eb mv" onclick="move(${e},-1)" ${pos===0?'disabled':''}>↑</button>
      <button class="eb mv" onclick="move(${e},1)" ${pos===total-1?'disabled':''}>↓</button>
      <button class="eb yt" onclick="watch('${esc(vname)}')" title="Как делать">▶</button>
      <button class="eb" onclick="fillLast(${e})" ${L?'':'disabled'}>↺ как в прошлый</button>
      <button class="eb mv" onclick="cardMenu(${e})" title="Ещё">⋯</button>
    </div>`;
  const board = time
    ? `<div class="board"><span class="board-num kg">${L&&L.it.time?mmss(maxT(L.it.sets)):"—"}</span><span class="board-unit unit">лучшее время</span></div>`
    : T.kind==="anya"
      ? `<div class="board"><span class="kg" onclick="editW(${e})">${w||"—"}</span><span class="unit">${unitLabel(u)}</span>
          ${progH || (num(w)&&stepFor(num(w),u)?`<span class="plus">последний подход<br>${fmt(num(w)+stepFor(num(w),u))}</span>`:`<span class="plus">${h(GYMS[gym])}</span>`)}</div>`
      : `<div class="board"><span class="board-num" onclick="editW(${e})">${w||"—"}</span><span class="board-unit">${unitLabel(u)}</span>
          ${progH || `<span class="board-tag">рекомендую<br>${h(GYMS[gym])}</span>`}</div>`;
  const sel = `<select class="pick" ${ex.vars.length<2?'disabled':''} onchange="setVar(${e},this.value)">${opts}</select>`;
  if(T.kind==="anya"){
    const allDone=st.sets.every(x=>x.done);
    return `<div class="card"><div class="ctop">
        <span class="bloom">${allDone?DAISY_ON:DAISY_OFF}</span>
        <div class="enum">упражнение ${pos+1}<span class="scheme" onclick="editScheme(${e})">${h(ex.scheme)}</span>${stagH}</div>
        <div class="ename">${h(ex.name)}</div>
        ${ex.motto?`<div class="motto">«${h(ex.motto)}»</div>`:""}
        ${sel}${board}${noteH}${edit}</div>
      <div class="sets">${setsHTML(e,st,w,time,u)}</div>${lastHTML(L,day,e)}</div>`;
  }
  return `<div class="card"><div class="card-top">
      <div class="slot"><span>${pos+1}. ${h(ex.name)}${stagH}</span><span class="scheme" onclick="editScheme(${e})">${h(ex.scheme)}</span></div>
      ${sel}${board}${noteH}${edit}</div>
    <div class="sets">${setsHTML(e,st,w,time,u)}</div>${lastHTML(L,day,e)}</div>`;
}

/* ── список ── */
function bannersHTML(){
  let out="";
  const late=[];
  DAYS.forEach((x,i)=>{ if(x.temp) return; const n=daysSince(dk(i)); if(n!=null && n>7) late.push([x.name,n,i]); });
  late.sort((a,b)=>b[1]-a[1]);
  late.slice(0,3).forEach(([n,dd,i])=>{
    out+=`<div class="warn" onclick="setDay(${i})">⚠ ${i===day?'Этот день не тренировал':'«'+h(n)+'» — не было'} ${dd} дн.</div>`; });
  if(HIST.length){
    const le=custom.lastExport ? daysBetween(custom.lastExport.slice(0,10), localDate()) : null;
    if(le==null || le>7)
      out+=`<div class="nag" onclick="exportData()">💾 ${le==null?'Копию данных ещё не сохранял':'Копию не сохранял '+le+' дн.'} — нажми, выгружу</div>`;
  }
  return out;
}
function drawList(){
  if(!DAYS[day]) day=0;
  const vis=DAYS[day].ex.map((ex,e)=>({ex,e})).filter(o=>!isHidden(day,o.ex.name));
  const cards=vis.map(({ex,e},pos)=>cardHTML(ex,e,pos,vis.length)).join("");
  const hid=hiddenList(day).length;
  $("#list").innerHTML = bannersHTML() + cards
    + `<button class="addex" onclick="addEx()">＋ добавить упражнение</button>`
    + (hid?`<button class="hidebtn" onclick="showHidden()">Скрытые упражнения: ${hid} — вернуть</button>`:"")
    + (DAYS[day].temp?`<button class="hidebtn danger" onclick="delTempDay()">Удалить разовую тренировку</button>`:"");
  drawStat();
}
function dayTon(){
  let v=0;
  DAYS[day].ex.forEach((ex,e)=>{ if(isHidden(day,ex.name)) return;
    const st=cur(day,e); if(isTime(day,e,st.v)) return;
    const m=mult(unitOf(day,e,st.v));
    st.sets.forEach(s=>{ v+=num(s.w)*num(s.r)*m; }); });
  return v;
}
function drawStat(){
  let done=0, all=0;
  DAYS[day].ex.forEach((ex,e)=>{ if(isHidden(day,ex.name)) return;
    cur(day,e).sets.forEach(s=>{ all++; if(s.done) done++; }); });
  const v=dayTon();
  const html=`<b>${done}</b>/${all} подх.${v?`<br>тоннаж <b>${Math.round(v)}</b>`:""}`;
  $("#stat").innerHTML = T.kind==="anya"
    ? `<div class="ptxt">${html}</div><div class="pbar"><div class="pfill" style="width:${all?Math.round(done/all*100):0}%"></div></div>` : html;
}
function draw(){ drawHeader(); drawList(); }

/* ── действия ── */
function setDay(i){ day=i; closeModal(); hideHist(); draw(); save(true); window.scrollTo(0,0); }
function setGym(i){ gym=i; draw(); save(true); }
function setVar(e,v){ const st=cur(day,e); st.v=+v; st.vn=exAt(day,e).vars[+v].name; drawList(); save(true); }
function upd(e,i,f,val){ cur(day,e).sets[i][f]=val; drawStat(); save(true); }
function tog(e,i){
  unlockAudio();
  const st=cur(day,e), s=st.sets[i];
  s.done=!s.done;
  if(s.done){
    if(isTime(day,e,st.v)){
      if(!s.t){ const L=lastFor(day,e); if(L&&L.it.time) s.t=String(maxT(L.it.sets)); }
    } else if(!s.w){
      const w=num(recWeight(day,e)), u=unitOf(day,e,st.v);
      const isLast=i===st.sets.length-1;
      s.w = w ? (T.lastPlus && isLast ? fmt(w+stepFor(w,u)) : String(recWeight(day,e))) : "";
    }
    startRest(st.sets.every(x=>x.done));
  } else {
    stopRest();   // сняла/снял галочку — отдых отменяется
  }
  drawList(); save(true);
}
function acceptProg(e,to){
  const st=cur(day,e);
  wSet(day,e,st.v,gym,to); saveCustom(); drawList(); toast("Рабочий вес: "+fmt(to));
}
function fillLast(e, quiet){
  const L=lastFor(day,e); if(!L){ if(!quiet) toast("Записей ещё нет"); return false; }
  const ex=exAt(day,e), st=cur(day,e);
  const vi=ex.vars.findIndex(v=>v.name===L.it.v);
  if(vi>=0){ st.v=vi; st.vn=ex.vars[vi].name; }
  const src=L.it.sets;
  st.sets.forEach((s,i)=>{ const p=src[i]||src[src.length-1]||{};
    if(L.it.time){ s.t=p.t||""; } else { s.w=p.w||""; s.r=p.r||""; }
    s.done=false; });
  if(!quiet){ drawList(); save(true); toast("Заполнено как "+ddmm(L.rec.date)); }
  return true;
}
function fillAll(){
  let n=0;
  DAYS[day].ex.forEach((ex,e)=>{ if(!isHidden(day,ex.name) && fillLast(e,true)) n++; });
  closeModal(); drawList(); save(true); toast(n?`Заполнено упражнений: ${n}`:"Записей ещё нет");
}

/* ── меню карточки ── */
function cardMenu(e){
  const ex=exAt(day,e), st=cur(day,e), v=ex.vars[st.v];
  const time=isTime(day,e,st.v), u=unitOf(day,e,st.v);
  let html=`<div class="mnote">${h(ex.name)} · ${h(st.vn)}</div>`;
  html+=`<button class="mitem" onclick="addVar(${e})">＋ Добавить вариант</button>`;
  html+=`<button class="mitem" onclick="editNote(${e})">📝 Заметка для зала «${h(GYMS[gym])}»</button>`;
  if(!time) html+=`<button class="mitem" onclick="pickUnit(${e})">⚖ Как считать вес<small>${unitLabel(u)}</small></button>`;
  html+=`<button class="mitem" onclick="editScheme(${e})">Схема подходов<small>${h(ex.scheme)}</small></button>`;
  html+=`<div class="mgroup">Убрать</div>`;
  html+=`<button class="mitem" onclick="doHide('${esc(ex.name)}')">Убрать с экрана<small>вернуть можно внизу</small></button>`;
  if(ex.mine) html+=`<button class="mitem danger" onclick="doDelete('${esc(ex.name)}')">Удалить совсем<small>добавлено тобой</small></button>`;
  if(v && v.mine && ex.vars.length>1) html+=`<button class="mitem danger" onclick="doDelVar(${e})">Удалить вариант «${h(v.name)}»</button>`;
  openModal("Упражнение", html);
}
function pickUnit(e){
  const st=cur(day,e), u=unitOf(day,e,st.v);
  const opt=(val,t,s)=>`<button class="mitem" onclick="setUnit(${e},'${val}')">${u===val?'● ':''}${t}<small>${s}</small></button>`;
  openModal("Как считать вес", `<div class="mnote">${h(st.vn)}<br>Для гантелей: «на руку» — пишешь вес одной гантели (22), «пара» — сумму двух (44). Тоннаж считается правильно в обоих случаях.</div>`
    + opt("hand","На одну гантель","кг/рука") + opt("pair","За пару","кг · пара") + opt("","Обычный вес","тренажёр, штанга"));
}
function setUnit(e,nu){
  const st=cur(day,e), old=unitOf(day,e,st.v);
  if(old===nu){ closeModal(); return; }
  for(let g=0; g<GYMS.length; g++){
    const k=wKey(day,e,st.v,g);
    if(custom.w[k]!=null) custom.w[k]=Math.round(convW(num(custom.w[k]),old,nu)*10)/10;
    else { const w=num(wGet(day,e,st.v,g)); if(w) custom.w[k]=Math.round(convW(w,old,nu)*10)/10; }
  }
  custom.unit=custom.unit||{}; custom.unit[uKey(day,e,st.v)]=nu;
  saveCustom(); closeModal(); drawList(); toast("Теперь: "+unitLabel(nu));
}
function editNote(e){
  const ex=exAt(day,e), k=dk(day)+"||"+ex.name+"||"+GYMS[gym];
  custom.notes=custom.notes||{};
  openModal("Заметка · "+GYMS[gym], `<div class="mnote">${h(ex.name)}. Например: «сиденье на 4», «блок справа».</div>
    <input id="mi" class="minput" type="text" value="${h(custom.notes[k]||"")}" placeholder="Заметка">
    <div class="mrow"><button class="mitem mbtn" onclick="__clearNote()">Удалить</button>
    <button class="mitem mbtn ok" onclick="__saveNote()">Сохранить</button></div>`);
  window.__saveNote=function(){ const v=(document.getElementById("mi").value||"").trim();
    if(v) custom.notes[k]=v; else delete custom.notes[k]; saveCustom(); closeModal(); drawList(); };
  window.__clearNote=function(){ delete custom.notes[k]; saveCustom(); closeModal(); drawList(); };
  setTimeout(()=>{ const el=document.getElementById("mi"); if(el) el.focus(); },80);
}

/* ── скрытие / удаление ── */
function doHide(n){
  custom.hidden=custom.hidden||{};
  custom.hidden[dk(day)]=(custom.hidden[dk(day)]||[]).filter(x=>x!==n).concat([n]);
  saveCustom(); closeModal(); draw(); toast("Убрано с экрана");
}
function doDelete(n){
  const i=DAYS[day].ex.findIndex(x=>x.name===n); if(i<0) return;
  delete state[key(day,i)];
  DAYS[day].ex.splice(i,1);
  custom.ex[dk(day)]=(custom.ex[dk(day)]||[]).filter(x=>normEx(x,true).name!==n);
  if(!custom.ex[dk(day)].length) delete custom.ex[dk(day)];
  custom.order=custom.order||{}; custom.order[dk(day)]=DAYS[day].ex.map(x=>x.name);
  saveCustom(); closeModal(); save(true); draw(); toast("Удалено");
}
function doDelVar(e){
  const ex=exAt(day,e), st=cur(day,e), v=ex.vars[st.v];
  if(!v || !v.mine) return;
  ex.vars.splice(st.v,1);
  const k=key(day,e);
  custom.vars[k]=(custom.vars[k]||[]).filter(x=>normVar(x,true).name!==v.name);
  if(!custom.vars[k].length) delete custom.vars[k];

/* ── таймер отдыха ──
   Между подходами — custom.rest, между упражнениями — custom.restEx.
   Сигнал на заблокированном экране: проигрываем аудиодорожку нужной длины
   (тишина + звонок в конце). Медиа-звук iOS не глушит ни блокировка, ни беззвучный режим. */
let restEnd=0, restTm=null, actx=null, restLong=false, restAudioOn=false;
const restAudio=(typeof Audio!=="undefined")?new Audio():null;
const wavCache={};
function unlockAudio(){
  try{ if(!actx){ const C=window.AudioContext||window.webkitAudioContext; if(C) actx=new C(); }
       if(actx && actx.state==="suspended") actx.resume(); }catch(e){}
}
function beep(){
  try{ if(!actx) return;
    [0,0.32,0.64].forEach((t,i)=>{ const o=actx.createOscillator(), g=actx.createGain();
      o.frequency.value=i===2?1320:880; o.connect(g); g.connect(actx.destination);
      const s=actx.currentTime+t; g.gain.setValueAtTime(0.0001,s);
      g.gain.exponentialRampToValueAtTime(0.5,s+0.02); g.gain.exponentialRampToValueAtTime(0.0001,s+0.26);
      o.start(s); o.stop(s+0.28); });
  }catch(e){}
}
function restWav(sec){
  if(wavCache[sec]) return wavCache[sec];
  const sr=8000, n=Math.round((sec+2.2)*sr), b=new Uint8Array(44+n), v=new DataView(b.buffer);
  const str=(o,s)=>{ for(let i=0;i<s.length;i++) b[o+i]=s.charCodeAt(i); };
  str(0,"RIFF"); v.setUint32(4,36+n,true); str(8,"WAVE"); str(12,"fmt "); v.setUint32(16,16,true);
  v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,sr,true); v.setUint32(28,sr,true);
  v.setUint16(32,1,true); v.setUint16(34,8,true); str(36,"data"); v.setUint32(40,n,true);
  b.fill(128,44);
  const tone=(at,dur,f)=>{ const s0=Math.round(at*sr), len=Math.round(dur*sr);
    for(let i=0;i<len && s0+i<n;i++){ const env=Math.min(1,i/80,(len-i)/80);
      b[44+s0+i]=128+Math.round(115*env*Math.sin(2*Math.PI*f*i/sr)); } };
  [0,0.35,0.7].forEach(d=>tone(sec+d,0.22,880)); tone(sec+1.05,0.9,1320);
  return wavCache[sec]=URL.createObjectURL(new Blob([b],{type:"audio/wav"}));
}
function restAudioPlay(sec, label){
  restAudioOn=false;
  if(!restAudio || custom.restSig!=="lock") return;
  try{
    restAudio.src=restWav(sec); restAudio.currentTime=0;
    const p=restAudio.play(); if(p&&p.then) p.then(()=>{ restAudioOn=true; }).catch(()=>{ restAudioOn=false; });
    if("mediaSession" in navigator && window.MediaMetadata)
      navigator.mediaSession.metadata=new MediaMetadata({title:label+" "+mmss(sec), artist:"Тренировки"});
  }catch(e){ restAudioOn=false; }
}
let wakeLock=null;
async function keepAwake(on){
  try{
    if(on && !wakeLock && navigator.wakeLock){ wakeLock=await navigator.wakeLock.request("screen"); wakeLock.addEventListener&&wakeLock.addEventListener("release",()=>{ wakeLock=null; }); }
    if(!on && wakeLock){ const w=wakeLock; wakeLock=null; await w.release(); }
  }catch(e){ wakeLock=null; }
}
function flash(on){ const f=$("#flash"); if(f) f.className=on?"flash on":"flash"; }
function startRest(exDone){
  flash(false);
  restLong=!!exDone;
  const sec=+(restLong?custom.restEx:custom.rest)||0; if(!sec){ stopRest(); return; }
  restEnd=Date.now()+sec*1000;
  restAudioPlay(sec, restLong?"Отдых до упражнения":"Отдых");
  if(custom.restAwake!==false) keepAwake(true);
  tickRest();
}
function stopRest(){ restEnd=0; clearTimeout(restTm); try{ restAudio && restAudio.pause(); }catch(e){} restAudioOn=false;
  flash(false); keepAwake(false);
  const el=$("#rest"); if(el) el.className="rest"; }
function tickRest(){
  clearTimeout(restTm); const el=$("#rest"); if(!el) return;
  if(!restEnd){ el.className="rest"; return; }
  const left=Math.ceil((restEnd-Date.now())/1000);
  if(left<=0){
    restEnd=0;
    if(custom.restSig==="beep" && !restAudioOn) beep();
    el.innerHTML=(restLong?"⏰ Время! Следующее упражнение":"⏰ Время! Следующий подход")+`<span class="x">✕</span>`;
    el.className="rest show end"; flash(true);
    return;   // мигает, пока не тапнешь по плашке или не отметишь следующий подход
  }
  el.innerHTML=`⏱ ${restLong?'до упражнения':'отдых'} <b>${mmss(left)}</b> <span class="x">✕</span>`; el.className="rest show";
  restTm=setTimeout(tickRest,250);
}
try{ document.addEventListener("visibilitychange",()=>{ if(!document.hidden && restEnd) tickRest(); }); }catch(e){}
function pickRest(){
  const a=[0,60,90,120,150,180], b=[0,120,150,180,240,300], sig=custom.restSig||"flash";
  const sigRow=(v,ttl,sub)=>`<button class="mitem" onclick="__setSig('${v}')">${sig===v?'● ':''}${ttl}<small>${sub}</small></button>`;
  const row=(v,curv,fn)=>`<button class="mitem" onclick="${fn}(${v})">${(+curv||0)===v?'● ':''}${v?mmss(v):'Выключен'}</button>`;
  openModal("Таймер отдыха", `<div class="mnote">Отметил подход ✓ — пошёл отсчёт. Закрыл последний подход упражнения — включается длинный отдых.</div>
    <div class="mgroup">Между подходами</div>${a.map(v=>row(v,custom.rest,"__setRest")).join("")}
    <div class="mgroup">Между упражнениями</div>${b.map(v=>row(v,custom.restEx,"__setRestEx")).join("")}
    <div class="mgroup">Сигнал в конце</div>
    ${sigRow("flash","Красная мигающая плашка","без звука, музыка не трогается")}
    ${sigRow("beep","Мигание + писк","пищит, только когда приложение открыто")}
    ${sigRow("lock","Мигание + звонок на блокировке","ставит музыку на паузу")}
    <div class="mgroup">Экран</div>
    <button class="mitem" onclick="__setAwake()">${custom.restAwake!==false?'● ':''}Не гасить экран во время отдыха<small>${custom.restAwake!==false?'вкл':'выкл'}</small></button>
    <div class="mnote">Чтобы мигание было видно, экран во время отдыха не гаснет. После тапа по плашке снова гаснет как обычно.</div>`);
  window.__setRest=function(s){ custom.rest=s; saveCustom(); pickRest(); };
  window.__setRestEx=function(s){ custom.restEx=s; saveCustom(); pickRest(); };
  window.__setSig=function(v){ custom.restSig=v; saveCustom(); pickRest(); };
  window.__setAwake=function(){ custom.restAwake=(custom.restAwake===false); saveCustom(); pickRest(); };
}

/* ── модалки (системные prompt/confirm в установленном приложении глушатся) ── */
function openModal(title, html){
  $("#modal").innerHTML=`<div class="mwrap"><div class="mhead"><b>${title}</b>
    <button class="btn ghost" onclick="closeModal()">Закрыть</button></div>${html}</div>`;
  $("#modal").style.display="block"; $("#modal").scrollTop=0;
}
function closeModal(){ $("#modal").style.display="none"; }
function norm(t){ return String(t).toLowerCase().replace(/ё/g,"е").replace(/[^a-zа-я0-9 ]/g," ").replace(/\s+/g," ").trim(); }
function allKnown(){
  const out=[], seen={};
  allExercises().forEach(x=>{ if(!seen[x.name]){ seen[x.name]=1; out.push({name:x.name, note:"в программе", scheme:x.scheme}); }
    x.vars.forEach(v=>{ if(!seen[v.name]){ seen[v.name]=1; out.push({name:v.name, note:"вариант · "+x.name, scheme:x.scheme}); } }); });
  Object.keys(CATALOG).forEach(g=>CATALOG[g].forEach(x=>{ if(!seen[x[0]]){ seen[x[0]]=1; out.push({name:x[0], note:g+" · "+x[1], scheme:x[2]}); } }));
  return out;
}
function askExercise(title, cb){
  openModal(title, `<input id="mi" class="minput" type="text" placeholder="Начни писать название" oninput="__sug(this.value)" autocomplete="off">
    <div id="sug"></div>
    <div class="mrow"><button class="mitem mbtn" onclick="closeModal()">Отмена</button>
    <button class="mitem mbtn ok" onclick="__ok()">Готово</button></div>`);
  window.__sug=function(q){
    const box=document.getElementById("sug"); if(!box) return;
    const nq=norm(q); if(nq.length<2){ box.innerHTML=""; return; }
    const words=nq.split(" ").filter(Boolean);
    const hits=allKnown().filter(x=>{ const n=norm(x.name); return words.every(w=>n.indexOf(w)>=0); }).slice(0,8);
    box.innerHTML = hits.length
      ? `<div class="mgroup">Похожие</div>`+hits.map(x=>`<div class="mitem" onclick="__take('${esc(x.name)}','${esc(x.scheme)}')">${h(x.name)}<small>${h(x.note)}</small></div>`).join("")
      : `<div class="mnote">Ничего похожего — будет создано новое</div>`;
  };
  window.__take=function(n,sc){ closeModal(); cb(n, sc||null); };
  window.__ok=function(){ const v=(document.getElementById("mi").value||"").trim(); closeModal(); if(v) cb(v,null); };
  setTimeout(()=>{ const el=document.getElementById("mi"); if(el) el.focus(); },80);
}
function askText(title, ph, def, cb){

    <div class="mrow"><button class="mitem mbtn" onclick="closeModal()">Отмена</button>
    <button class="mitem mbtn ok" onclick="__ok()">Готово</button></div>`);

/* ── тост / сохранение ── */
let tm=null, sv=null;
function toast(m){ const el=$("#toast"); el.textContent=m; el.classList.add("show");
  clearTimeout(tm); tm=setTimeout(()=>el.classList.remove("show"),2200); }
function save(silent){
  clearTimeout(sv);
  sv=setTimeout(()=>{ try{ localStorage.setItem(P+"current", JSON.stringify({state,gym,day})); if(!silent) toast("Сохранено"); }catch(e){} }, silent?400:0);
}
function saveWorkout(){
  try{
    const stamp=localDate(), dkey=dk(day);
    const items=[];
    DAYS[day].ex.forEach((ex,e)=>{
      const st=cur(day,e), vi=st.v, time=isTime(day,e,vi);
      let sets;
      if(time) sets=st.sets.filter(s=>num(s.t)>0).map(s=>({t:String(s.t)}));
      else sets=st.sets.filter(s=>s.w||s.r).map(s=>({w:String(s.w||(s.r?recWeight(day,e)||"":"")), r:String(s.r||"")}));
      if(!sets.length) return;
      const it={name:ex.name, v:st.vn, unit:time?"":unitOf(day,e,vi), sets:sets}; if(time) it.time=true;
      items.push(it);
    });
    if(!items.length){ toast("Нечего записывать — заполни подходы"); return; }
    const k=P+"hist:"+stamp+":"+dkey;
    let prev=null; try{ prev=JSON.parse(localStorage.getItem(k)); }catch(e){}
    if(prev && prev.items){ if(prev.v!==4) prev=migrateRec(prev);
      prev.items.forEach(it=>{ if(!items.some(x=>x.name===it.name)) items.push(it); }); }
    const rec={v:4, date:stamp, day:dkey, name:DAYS[day].name, gym:GYMS[gym], items:items};
    localStorage.setItem(k, JSON.stringify(rec));
    DAYS[day].ex.forEach((ex,e)=>cur(day,e).sets.forEach(s=>{ s.w=""; s.r=""; s.t=""; s.done=false; }));
    stopRest(); loadHist(); save(true); draw(); window.scrollTo(0,0);
    toast("Записано · тоннаж "+Math.round(recTon(rec))+" кг");
  }catch(e){ toast("Ошибка записи"); }
}
function clearDay(){
  confirmM("Сбросить подходы?","Очистятся все введённые подходы этого дня. История не пострадает.",function(){
    DAYS[day].ex.forEach((ex,e)=>cur(day,e).sets.forEach(s=>{ s.w=""; s.r=""; s.t=""; s.done=false; }));
    stopRest(); drawList(); save(true); toast("Очищено");
  });
}

/* ── главное меню ── */
function mainMenu(){
  const le=custom.lastExport ? daysBetween(custom.lastExport.slice(0,10), localDate()) : null;
  openModal("Меню", `
    <button class="mitem" onclick="fillAll()">↺ Весь день как в прошлый раз</button>
    <button class="mitem" onclick="pickRest()">⏱ Таймер отдыха<small>${mmss(+custom.rest||0)} / ${mmss(+custom.restEx||0)}</small></button>
    <div class="mgroup">Данные</div>
    <button class="mitem" onclick="closeModal();exportData()">⤓ Выгрузить копию<small>${le==null?'ни разу':le===0?'сегодня':le+' дн. назад'}</small></button>
    <label class="mitem">⤒ Загрузить из файла<input type="file" accept="application/json,.json,text/plain" style="display:none" onchange="closeModal();importData(this)"></label>
    <button class="mitem" onclick="showTextImport()">✎ Вставить выгрузку текстом</button>
    <button class="mitem" onclick="restoreSeed()">Вернуть архив${T.seedLabel?" "+T.seedLabel:""}<small>только недостающие записи</small></button>
    <div class="mgroup">Тренировка</div>
    <button class="mitem danger" onclick="clearDay()">Сбросить подходы дня</button>
    <div class="mnote" style="margin-top:14px">Версия ${T.appv} · в памяти тренировок: ${HIST.length}${HIST[0]?", последняя "+ddmm(HIST[0].date):""}</div>`);
}

/* ── история ── */
let histGym="*";
function spark(v){
  if(v.length<2) return "";
  const w=104,hh=26,mn=Math.min(...v),mx=Math.max(...v),rg=(mx-mn)||1;
  const p=v.map((x,i)=>[(i/(v.length-1))*w, hh-2-((x-mn)/rg)*(hh-6)]);
  const d=p.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  const L=p[p.length-1];
  return `<svg width="${w}" height="${hh}" style="display:block"><path d="${d}" stroke="${T.accent}" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${L[0].toFixed(1)}" cy="${L[1].toFixed(1)}" r="2.6" fill="${T.accent}"/></svg>`;
}
function weekStart(s){ const d=new Date(s+"T12:00:00"); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return localDate(d); }
function weeksHTML(){
  const now=weekStart(localDate()), weeks=[];
  for(let i=7;i>=0;i--){ const d=new Date(now+"T12:00:00"); d.setDate(d.getDate()-i*7); weeks.push(localDate(d)); }
  const ton={}, cnt={};
  HIST.forEach(r=>{ if(histGym!=="*" && r.gym!==histGym) return; const w=weekStart(r.date); ton[w]=(ton[w]||0)+recTon(r); cnt[w]=(cnt[w]||0)+1; });
  const mx=Math.max(1,...weeks.map(w=>ton[w]||0));
  return `<div class="hcard"><div class="hname">Тоннаж по неделям <small>все дни</small></div><div class="weeks">`
    + weeks.map(w=>{ const v=ton[w]||0;
        return `<div class="wk"><div class="wkv">${v?Math.round(v/1000*10)/10+'т':''}</div><div class="wkb"><i style="height:${Math.round(v/mx*100)}%"></i></div><div class="wkl">${ddmm(w)}</div><div class="wkn">${cnt[w]?cnt[w]+' тр':'—'}</div></div>`; }).join("")
    + `</div></div>`;
}
function showHist(){
  const dkey=dk(day), box=$("#hist");
  const H=HIST.filter(r=>r.day===dkey && (histGym==="*" || r.gym===histGym));
  const gymsIn=[...new Set(HIST.map(r=>r.gym).filter(Boolean))];
  const chips=`<div class="hchips"><button class="gym ${histGym==="*"?'on':''}" onclick="__hg('*')">Все залы</button>`
    + gymsIn.map(g=>`<button class="gym ${histGym===g?'on':''}" onclick="__hg('${esc(g)}')">${h(g)}</button>`).join("")+`</div>`;
  window.__hg=function(g){ histGym=g; showHist(); };
  let body="";
  if(!H.length){
    body=`<div class="hempty">По этому дню${histGym!=="*"?" в этом зале":""} записей нет. Заполни подходы и нажми «Готово».</div>`;
  } else {
    body+=`<div class="hcard"><div class="hname">Тренировки</div>`
      + H.slice(0,10).map(r=>`<div class="hrow"><span class="hdate">${ddmm(r.date)}</span><span class="hsets">${r.gym?h(r.gym)+" · ":""}${r.items.length} упр. · <b>${Math.round(recTon(r))}</b> кг</span></div>`).join("")
      + `</div>`;
    const groups=[], seen={};
    H.forEach(r=>r.items.forEach(it=>{ const k=it.name+"||"+it.v; if(!seen[k]){ seen[k]=1; groups.push({name:it.name, v:it.v}); } }));
    body+=groups.map(gp=>{
      const rows=[]; H.forEach(r=>r.items.forEach(it=>{ if(it.name===gp.name && it.v===gp.v) rows.push({rec:r, it:it}); }));
      const time=rows[0].it.time, u=rows[0].it.unit||"";
      const ser=rows.map(x=>time?maxT(x.it.sets):convW(maxW(x.it.sets), x.it.unit||"", u)).reverse().filter(x=>x>0);
      let tr="";
      if(ser.length>1){ const d=Math.round((ser[ser.length-1]-ser[0])*10)/10;
        tr = d>0?`<span class="up">+${time?mmss(d):fmt(d)+' кг'}</span>`:d<0?`<span class="dn">−${time?mmss(-d):fmt(-d)+' кг'}</span>`:`<span class="fl">без изменений</span>`; }
      const exd=DAYS[day].ex.find(x=>x.name===gp.name);
      const st=time?0:stagFor(gp.name, gp.v, exd?exd.scheme:"");
      const list=rows.slice(0,8).map(x=>{
        const sets = time ? x.it.sets.map(s=>mmss(num(s.t))).join("  ")
          : x.it.sets.map(s=>{ const w=s.w?fmt(convW(num(s.w),x.it.unit||"",u)):"—"; return s.r?`${w}<i>×${s.r}</i>`:w; }).join("  ");
        return `<div class="hrow"><span class="hdate">${ddmm(x.rec.date)}</span><span class="hsets">${sets}</span>${x.rec.gym?`<span class="hg">${h(x.rec.gym)}</span>`:""}</div>`;
      }).join("");
      return `<div class="hcard"><div class="hname">${h(gp.name)}${gp.v&&gp.v!==gp.name?`<small>${h(gp.v)}</small>`:(!gp.v?`<small>вариант не записан</small>`:"")}</div>
        <div class="htop2">${tr}${st?`<span class="stag">застой ${st} нед</span>`:""}<span class="hcnt">${rows.length} трен.${time?'':' · '+unitLabel(u)}</span>${spark(ser)}</div>${list}</div>`;
    }).join("");
  }
  box.innerHTML=`<div class="hwrap"><div class="hhead"><b>История — ${h(DAYS[day].name)}</b>
    <button class="btn ghost" onclick="hideHist()">Закрыть</button></div>${chips}${weeksHTML()}${body}</div>`;
  box.style.display="block"; box.scrollTop=0;
}
function hideHist(){ const b=$("#hist"); if(b) b.style.display="none"; }

/* ── экспорт / импорт ── */
function markExported(){ custom.lastExport=new Date().toISOString(); saveCustom(); drawList(); }
function dumpObj(){
  const hist={};
  for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.indexOf(P+"hist:")===0) hist[k]=localStorage.getItem(k); }
  return {v:4, app:P, saved:new Date().toISOString(), state, custom, gyms:GYMS, hist};
}
function exportData(){
  const text=JSON.stringify(dumpObj());
  const name=T.file+"-"+localDate()+".json";
  const blob=new Blob([text],{type:"application/json"});
  try{
    const file=new File([blob], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){
      navigator.share({files:[file]}).then(markExported).catch(err=>{ if(!err || err.name!=="AbortError") showDump(text,name); });
      return;
    }
  }catch(e){}
  try{
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ try{ document.body.removeChild(a); }catch(e){} },500);
    markExported(); toast("Файл сохранён"); return;
  }catch(e){}
  showDump(text,name);
}
function showDump(text){
  openModal("Выгрузка", `<div class="mnote">Скопируй весь текст и сохрани в заметки. Восстановить — Меню → «Вставить выгрузку текстом».</div>
    <textarea id="dumparea" class="minput" style="height:210px;font-size:11px;font-family:ui-monospace,monospace"></textarea>
    <div class="mrow"><button class="mitem mbtn" onclick="closeModal()">Закрыть</button>
    <button class="mitem mbtn ok" onclick="__copyDump()">Скопировать</button></div>`);
  document.getElementById("dumparea").value=text;
  window.__copyDump=function(){ const t=document.getElementById("dumparea");
    try{ t.select(); t.setSelectionRange(0,9999999);
      if(navigator.clipboard) navigator.clipboard.writeText(t.value); else document.execCommand("copy");
      markExported(); toast("Скопировано"); }catch(e){ toast("Выдели текст и скопируй вручную"); } };
}
function showTextImport(){
  openModal("Вставить выгрузку", `<div class="mnote">Вставь сюда сохранённый текст выгрузки.</div>
    <textarea id="imparea" class="minput" style="height:210px;font-size:11px;font-family:ui-monospace,monospace" placeholder="{...}"></textarea>
    <div class="mrow"><button class="mitem mbtn" onclick="closeModal()">Отмена</button>
    <button class="mitem mbtn ok" onclick="__applyText()">Загрузить</button></div>`);
  window.__applyText=function(){ const t=document.getElementById("imparea").value; closeModal(); applyDump(t); };
}
function applyDump(txt){
  try{
    const o=JSON.parse(txt);
    if(o.state) state=o.state;
    if(o.custom) custom=Object.assign(blankCustom(), o.custom);
    if(Array.isArray(o.gyms)&&o.gyms.length) GYMS=o.gyms.slice(); else if(custom.gyms) GYMS=custom.gyms.slice();
    custom.gyms=GYMS.slice();
    if(o.hist) Object.keys(o.hist).forEach(k=>{
      const nk = k.indexOf(P+"hist:")===0 ? k : P+"hist:"+k.split("hist:")[1];
      localStorage.setItem(nk, o.hist[k]); });
    if(gym>=GYMS.length) gym=0;
    applyCustom(); migrateV2(o.last||{}); migrateV4();
    saveCustom(); loadHist(); save(true); draw(); toast("Данные загружены");
  }catch(e){ toast("Не удалось прочитать — проверь текст"); }
}
function importData(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>applyDump(rd.result); rd.readAsText(f);
}
function restoreSeed(){
  confirmM("Вернуть архив?","Добавятся только те записи архива, которых у тебя нет. Текущие данные не пострадают.",function(){
    let n=0;
    try{ Object.keys(SEED.hist||{}).forEach(k=>{ if(!localStorage.getItem(k)){ localStorage.setItem(k, SEED.hist[k]); n++; } }); }catch(e){}
    if(SEED.custom && Object.keys(custom.w||{}).length < Object.keys(SEED.custom.w||{}).length){
      custom=Object.assign(blankCustom(), JSON.parse(JSON.stringify(SEED.custom))); GYMS=(custom.gyms||GYMS).slice();
      applyCustom(); migrateV2(); migrateV4(); saveCustom();
    }
    loadHist(); draw(); toast(n?"Возвращено записей: "+n:"Всё уже на месте");
  });
}

/* ── миграции ── */
function migrateV2(oldLast){
  if(custom.v2) return;
  try{
    for(let d=0; d<DAYS.length; d++){
      const base=dk(d);
      for(let e=0; e<DAYS[d].ex.length; e++){
        const oldK=base+":"+e, newK=key(d,e);
        if(state[oldK]!==undefined && state[newK]===undefined) state[newK]=state[oldK];
        delete state[oldK];
        if(custom.vars && custom.vars[oldK]!==undefined && custom.vars[newK]===undefined){ custom.vars[newK]=custom.vars[oldK]; delete custom.vars[oldK]; }
        DAYS[d].ex[e].vars.forEach((v,vi)=>{ for(let g=0; g<GYMS.length; g++){
          const ok=base+":"+e+":"+vi+":"+g;
          if(custom.w && custom.w[ok]!==undefined){ const nk=wKey(d,e,vi,g); if(custom.w[nk]===undefined) custom.w[nk]=custom.w[ok]; } } });
      }
    }
    Object.keys(custom.w||{}).forEach(k=>{ if(k.indexOf("||")<0) delete custom.w[k]; });
  }catch(e){}
  custom.v2=true;
}
function migrateV4(){
  if(custom.v4) return;
  try{
    Object.keys(custom.schemes||{}).forEach(k=>{ const s=custom.schemes[k]; s.s=String(s.s).replace(/(\d)\s*[xх]\s*(\d)/i,"$1×$2"); });
    (T.wdel||[]).forEach(k=>{ delete custom.w[k]; });
    Object.keys(T.wfix||{}).forEach(k=>{ for(let g=0; g<GYMS.length; g++){ if(custom.w[k+"||"+g]==null) custom.w[k+"||"+g]=T.wfix[k]; } });
    const kill=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.indexOf(P+"last:")===0) kill.push(k); }
    kill.forEach(k=>localStorage.removeItem(k));
    custom.unit=custom.unit||{}; custom.notes=custom.notes||{};
    if(custom.rest==null) custom.rest=120;
  }catch(e){}
  custom.v4=true; saveCustom(); applyCustom();
}

window.onerror=function(m){ try{ console.warn("Перехвачено:", m); }catch(e){} return true; };

/* ── запуск ── */
(function boot(){
  try{
    let has=false;
    for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.indexOf(P+"hist:")===0){ has=true; break; } }
    const flag=P+"seeded:"+(T.seedId||"0");
    if(SEED.hist && (!has || !localStorage.getItem(flag)))
      Object.keys(SEED.hist).forEach(k=>{ if(!localStorage.getItem(k)) localStorage.setItem(k, SEED.hist[k]); });
    localStorage.setItem(flag,"1");
    if(!localStorage.getItem(P+"custom") && SEED.custom) localStorage.setItem(P+"custom", JSON.stringify(SEED.custom));
    if(!localStorage.getItem(P+"current") && SEED.state) localStorage.setItem(P+"current", JSON.stringify({state:SEED.state,gym:0,day:0}));
  }catch(e){}
  try{ const rc=localStorage.getItem(P+"custom"); if(rc) custom=Object.assign(blankCustom(), JSON.parse(rc)); }catch(e){}
  if(Array.isArray(custom.gyms) && custom.gyms.length) GYMS=custom.gyms.slice();
  if(custom.rest==null) custom.rest=120;
  if(custom.restEx==null) custom.restEx=180;
  if(!custom.restSig) custom.restSig="flash";
  applyCustom();
  try{ const r=localStorage.getItem(P+"current");
    if(r){ const o=JSON.parse(r); state=o.state||{};
      if(typeof o.gym==="number" && o.gym<GYMS.length) gym=o.gym;
      if(typeof o.day==="number" && o.day<DAYS.length) day=o.day; } }catch(e){}
  migrateV2(); migrateV4();
  loadHist();
  try{ draw(); }catch(err){ $("#list").innerHTML='<div style="padding:20px;color:#C8102E">Ошибка: '+h(err.message)+'</div>'; }
  $("#saveBtn").onclick=saveWorkout;
  $("#rest").onclick=stopRest;
})();

try{ if("serviceWorker" in navigator && location.protocol.indexOf("http")===0) navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}

</script>
