<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренировки</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тренировки">
<meta name="theme-color" content="#14171C">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --iron:#14171C; --surface:#1E232B; --surface2:#262C36; --line:#333B47;
  --chalk:#F2F0EB; --mute:#8B95A5;
  --red:#C8102E; --blue:#1266B0; --green:#2A8A4A; --yellow:#F2C300;
  --day:var(--blue);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--iron);color:var(--chalk);
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  padding-bottom:80px;
}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}

/* ── шапка ── */
header{
  position:sticky;top:0;z-index:20;background:var(--iron);
  padding-top:env(safe-area-inset-top);
  border-bottom:1px solid var(--line);
}
.days{display:flex;gap:6px;padding:12px 14px 8px}
.day{
  flex:1;border:none;border-radius:10px;padding:11px 6px;cursor:pointer;
  background:var(--surface);color:var(--mute);
  font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;font-weight:600;
  text-transform:uppercase;letter-spacing:.04em;line-height:1.15;
  border-bottom:3px solid transparent;transition:.15s;
}
.day.on{background:var(--surface2);color:var(--chalk)}
.day.on[data-d="0"]{border-bottom-color:var(--blue)}
.day.on[data-d="1"]{border-bottom-color:var(--red)}
.day.on[data-d="2"]{border-bottom-color:var(--green)}

.bar{display:flex;align-items:center;gap:8px;padding:0 14px 12px}
.bar-label{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;flex-shrink:0}
.gyms{display:flex;gap:5px;flex:1}
.gym{
  flex:1;border:1px solid var(--line);background:transparent;color:var(--mute);
  border-radius:8px;padding:7px 4px;font-size:12px;font-weight:600;cursor:pointer;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;transition:.15s;
}
.gym.on{background:var(--chalk);color:var(--iron);border-color:var(--chalk)}
.gym.add{flex:0 0 38px;border-style:dashed;font-size:15px}

/* ── карточка упражнения ── */
.card{
  background:var(--surface);border-radius:14px;margin:12px 0;overflow:hidden;
  border-left:3px solid var(--day);
}
.card-top{padding:14px 16px 12px}
.slot{
  font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;font-weight:500;
  color:var(--mute);text-transform:uppercase;letter-spacing:.1em;
  display:flex;justify-content:space-between;align-items:center;
}
.scheme{color:var(--day);font-weight:600}
.pick{
  width:100%;margin-top:8px;background:var(--surface2);color:var(--chalk);
  border:1px solid var(--line);border-radius:9px;padding:11px 12px;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px;font-weight:500;
  appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%238B95A5' stroke-width='2' fill='none'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:34px;
}
.pick:disabled{opacity:.55;background-image:none}

/* сигнатура: табло веса */
.board{
  display:flex;align-items:baseline;gap:10px;margin-top:12px;
  padding-top:12px;border-top:1px solid var(--line);
}
.board-num{
  font-family:"Helvetica Neue",Arial,sans-serif;font-size:44px;font-weight:700;transform:scaleX(.92);transform-origin:left;
  line-height:.85;font-variant-numeric:tabular-nums;letter-spacing:-.01em;
}
.board-unit{font-family:"Helvetica Neue",Arial,sans-serif;font-size:15px;color:var(--mute);font-weight:500}
.board-tag{
  margin-left:auto;font-size:10px;color:var(--mute);text-transform:uppercase;
  letter-spacing:.08em;text-align:right;line-height:1.4;
}

/* ── подходы ── */
.sets{border-top:1px solid var(--line);background:rgba(0,0,0,.15)}
.set{
  display:flex;align-items:center;gap:8px;padding:9px 16px;
  border-bottom:1px solid rgba(51,59,71,.5);
}
.set:last-child{border-bottom:none}
.set-n{
  font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;color:var(--mute);
  width:20px;flex-shrink:0;font-weight:500;
}
.inp{
  background:var(--surface2);border:1px solid var(--line);border-radius:8px;
  color:var(--chalk);font-family:"Helvetica Neue",Arial,sans-serif;font-size:17px;font-weight:600;
  padding:8px 6px;text-align:center;width:100%;min-width:0;
  font-variant-numeric:tabular-nums;
}
.inp:focus{outline:none;border-color:var(--day);background:#2C3441}
.inp::placeholder{color:#4E5765;font-weight:400}
.f{flex:1;min-width:0}
.sep{color:var(--mute);font-size:14px;flex-shrink:0}
.mini{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.done{
  width:34px;height:34px;flex-shrink:0;border-radius:8px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--mute);
  font-size:15px;line-height:1;
}
.done.on{background:var(--day);border-color:var(--day);color:#fff}

.edit{display:flex;gap:6px;margin-top:8px}
.ebtn{
  flex:1;background:transparent;border:1px dashed var(--line);color:var(--mute);
  border-radius:8px;padding:7px;font-size:12px;font-weight:500;cursor:pointer;
  font-family:-apple-system,sans-serif;
}
.ebtn:active{background:var(--surface2)}
.ebtn.mv{flex:0 0 42px;font-size:15px;line-height:1}
.ebtn.mv:disabled{opacity:.25}
.ebtn.del{flex:0 0 42px;color:#C8102E;border-color:rgba(200,16,46,.35)}
.board-num{cursor:pointer}
.addex{
  width:100%;margin:6px 0 20px;background:transparent;border:1px dashed var(--line);
  color:var(--mute);border-radius:12px;padding:14px;font-size:14px;font-weight:600;
  cursor:pointer;font-family:-apple-system,sans-serif;
}
.addex:active{background:var(--surface)}
.hint{padding:9px 16px;font-size:11px;color:var(--mute);border-top:1px solid rgba(51,59,71,.5)}
.hint b{color:var(--chalk);font-weight:600}

/* ── низ ── */
.foot{
  position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--iron);
  border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:8px;align-items:center;max-width:640px;margin:0 auto;
}
.stat{flex:1;font-size:11px;color:var(--mute);line-height:1.35}
.stat b{color:var(--chalk);font-family:"Helvetica Neue",Arial,sans-serif;font-size:16px;font-weight:600}
.btn{
  border:none;border-radius:10px;padding:12px 18px;cursor:pointer;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;font-weight:600;
  background:var(--day);color:#fff;
}
.btn.ghost{background:var(--surface2);color:var(--mute)}
.toast{
  position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--chalk);color:var(--iron);padding:11px 18px;border-radius:10px;
  font-size:13px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:40;
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.title{
  font-family:"Helvetica Neue",Arial,sans-serif;font-size:19px;font-weight:600;
  text-transform:uppercase;letter-spacing:.03em;margin:16px 0 2px;
}
.sub{font-size:12px;color:var(--mute);margin-bottom:4px}

#hist{position:fixed;inset:0;z-index:50;background:var(--iron);overflow-y:auto;
  padding:14px 14px calc(24px + env(safe-area-inset-bottom));padding-top:calc(14px + env(safe-area-inset-top))}
.hwrap{max-width:600px;margin:0 auto}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.hhead b{font-size:16px;font-weight:600}
.hempty{opacity:.6;font-size:13px;line-height:1.6;padding:26px 4px}
.hcard{background:CARD;border-radius:13px;padding:13px 15px;margin-bottom:11px;border:1px solid LINE}
.hname{font-size:14.5px;font-weight:600;margin-bottom:7px}
.htop2{display:flex;align-items:center;gap:9px;margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid LINE}
.htop2 .up{color:#4CAF6D;font-size:12.5px;font-weight:600}
.htop2 .dn{color:#C8102E;font-size:12.5px;font-weight:600}
.htop2 .fl{opacity:.55;font-size:12.5px}
.hcnt{opacity:.5;font-size:11.5px;margin-right:auto}
.hrow{display:flex;gap:11px;padding:4px 0;font-size:12.5px}
.hdate{opacity:.55;width:44px;flex-shrink:0;font-variant-numeric:tabular-nums}
.hsets{font-variant-numeric:tabular-nums}
.hsets i{opacity:.5;font-style:normal}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="days" id="days"></div>
  <div class="bar">
    <span class="bar-label">Зал</span>
    <div class="gyms" id="gyms"></div>
  </div>
</header>

<div class="wrap">
  <div class="title" id="dayTitle"></div>
  <div class="sub" id="daySub"></div>
  <div id="list"></div>
</div>

<div class="foot">
  <div class="stat" id="stat"></div>
  <button class="btn ghost" onclick="exportData()" title="Выгрузить">⤓</button>
  <label class="btn ghost" style="cursor:pointer" title="Загрузить">⤒<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label>
  <button class="btn ghost" onclick="showHist()">📈</button>
  <button class="btn ghost" id="clearBtn">Сброс</button>
  <button class="btn" id="saveBtn">Сохранить</button>
</div>
<div id="hist" style="display:none"></div>
<div class="toast" id="toast"></div>

<script>
let GYMS = ["Грисмолл","Весна","Нежинская"];

// [название, [Грисмолл, Весна, Нежинская]]
const DAYS = [
{ name:"Спина + бицепс", color:"var(--blue)", gym:2, ex:[
  ["Горизонтальная тяга","4×8",4,[["Тяга блока к поясу",[80,77,79]],["Тяга в тренажёре попеременно",[64,64,64]],["Тяга двух гантелей в наклоне",[26,26,26]]]],
  ["Вертикальная тяга","4×8",4,[["Верт. тяга широким хватом",[75,73,75]],["Верт. тяга узким хватом",[66,59,59]],["Верт. тяга в тренажёре",[57,57,57]],["Верт. попеременно с блином",[60,60,60]]]],
  ["Тяга гантели в наклоне","3×10",3,[["Тяга гантели в наклоне",[26,26,26]],["Тяга с блином в тренажёре боком",[35,40,50]]]],
  ["Гиперэкстензия","3×12",3,[["Гиперэкстензия в тренажёре",[80,80,80]],["Гиперэкстензия (свой вес + блин)",[20,20,20]]]],
  ["Бицепс в тренажёре","4×8",4,[["Бицепс в тренажёре (стек)",[45,36,36]],["Бицепс сидя на наклонной скамье",[9,9,10]]]],
  ["Бицепс изоляция","3×12",3,[["Сгибание на блоке (канат)",[0,0,0]],["Бицепс на скамье Скотта",[0,0,0]]]],
  ["Задняя дельта","3×12",3,[["Задняя дельта в тренажёре попеременно",[63,48,54]],["Задняя дельта на тросе",[0,0,0]],["Разведение гантелей в наклоне",[0,0,0]]]],
  ["Пресс в тренажёре","3×15",3,[["Пресс в тренажёре",[25,25,30]]]],
]},
{ name:"Ноги + плечи", color:"var(--red)", gym:0, ex:[
  ["Жим ногами","4×8",4,[["Жим ногами широким хватом",[230,230,230]],["Жим ногами узким хватом (квадры)",[210,210,210]],["Гакк-присед",[0,0,0]]]],
  ["Разгибание ног (квадры)","3×12",3,[["Разгибание ног в тренажёре (Хаммер)",[45,45,45]],["Разгибание ног одной ногой",[0,0,0]]]],
  ["ЗПБ — задняя поверхность бедра","3×12",3,[["Сгибание ног сидя",[45,45,45]],["Сгибание ног лёжа",[0,0,0]],["Румынская тяга с гантелями",[0,0,0]],["Ягодичный мост / отведение",[0,0,0]]]],
  ["Икры в тренажёре","3×12",3,[["Икры в тренажёре",[50,47.5,47.5]]]],
  ["Жим на плечи","4×8",4,[["Жим штанги в Смите",[45,45,45]],["Жим в тренажёре на плечи",[45,45,45]],["Жим штанги в раме",[41,41,41]],["Жим гантелей сидя",[18,18,18]]]],
  ["Средняя дельта","4×12",4,[["Махи в тренажёре (стек)",[36,36,36]],["Махи гантелями в стороны",[12,12,12]],["Махи на блоке одной рукой",[9,9,9]]]],
  ["Задняя дельта","3×12",3,[["Задняя дельта в тренажёре попеременно",[63,48,54]],["Задняя дельта на тросе",[0,0,0]]]],
  ["Передняя дельта / протяжка","3×12",3,[["Протяжка в блоке",[31.5,31.5,31.5]],["Протяжка (тяга к подбородку)",[24,24,24]],["Подъём гантелей перед собой",[22,22,22]]]],
  ["Планка","3×2 мин",3,[["Планка",[0,0,0]]]],
]},
{ name:"Грудь + трицепс", color:"var(--green)", gym:0, ex:[
  ["Жим гантелей на наклонной","4×8",4,[["Жим гантелей на наклонной",[42,42,40]]]],
  ["Жим горизонтально","3×10",3,[["Жим лёжа в тренажёре с блинами",[50,50,50]],["Жим гантелей горизонтально",[38,38,38]]]],
  ["Брусья с весом","3×10",3,[["Брусья с весом",[35,30,30]]]],
  ["Кроссовер / сведения","3×12",3,[["Кроссовер центр в блоке",[9,9,9]],["Кроссовер низ → вверх",[22,22,22]],["Сведение бабочка",[30,30,35]],["Сведение в тренажёре (центр)",[16,16,16]]]],
  ["Трицепс в тренажёре","4×8",4,[["Трицепс в тренажёре (стек)",[80,80,80]]]],
  ["Трицепс изоляция","3×12",3,[["Жим каната из-за головы",[13.5,16,16]],["Разгибание на блоке канатом",[14,18,15]],["Французский с гантелью над головой",[0,0,0]]]],
  ["Средняя (боковая) дельта","3×12",3,[["Махи в тренажёре (стек)",[36,36,36]],["Махи гантелями в стороны",[12,12,12]],["Махи на блоке одной рукой",[9,9,9]]]],
  ["Пресс в тренажёре","3×15",3,[["Пресс в тренажёре",[25,25,30]]]],
  ["Планка","3×2 мин",3,[["Планка",[0,0,0]]]],
]},
];

let custom = {vars:{}, ex:{}, order:{}, gyms:null, w:{}};   // w — веса по залам   // добавленное пользователем
let day = 0, gym = DAYS[0].gym;
let state = {};   // ключ d:e -> {v, sets:[{w,r,done}]}
let last  = {};   // прошлая сессия
const $ = s => document.querySelector(s);

function applyCustom(){
  Object.keys(custom.ex||{}).forEach(d=>{
    (custom.ex[d]||[]).forEach(x=>{
      const exists = DAYS[d].ex.some(q=>q[0]===x[0]);
      if(!exists) DAYS[d].ex.push([x[0],x[1],x[2],x[3].map(v=>[v[0],v[1].slice()]),true]);
    });
  });
  Object.keys(custom.order||{}).forEach(d=>{
    const want = custom.order[d]; if(!want) return;
    const byName = {}; DAYS[d].ex.forEach(x=>byName[x[0]] = x);
    const sorted = [];
    want.forEach(n=>{ if(byName[n]){ sorted.push(byName[n]); delete byName[n]; } });
    DAYS[d].ex.forEach(x=>{ if(byName[x[0]]) sorted.push(x); });
    if(sorted.length === DAYS[d].ex.length) DAYS[d].ex = sorted;
  });
  Object.keys(custom.vars||{}).forEach(k=>{
    const [d,e] = k.split(":").map(Number);
    if(!DAYS[d] || !DAYS[d].ex[e]) return;
    (custom.vars[k]||[]).forEach(v=>{
      if(!DAYS[d].ex[e][3].some(q=>q[0]===v[0])) DAYS[d].ex[e][3].push([v[0],v[1].slice()]);
    });
  });
}
function saveCustom(){
  try{ localStorage.setItem("gym:custom", JSON.stringify(custom)); }catch(e){}
}
function askNum(msg, def){
  const r = prompt(msg, def===undefined?"":String(def));
  if(r===null) return null;
  const n = parseFloat(String(r).replace(",","."));
  return isNaN(n) ? 0 : n;
}
function key(d,e){ return d+":"+e }
function cur(d,e){
  const k = key(d,e);
  if(!state[k]) state[k] = {v:0, sets:Array.from({length:DAYS[d].ex[e][2]},()=>({w:"",r:"",done:false}))};
  return state[k];
}
function wKey(d,e,vi,g){ return d+":"+e+":"+vi+":"+g }
function wGet(d,e,vi,g){
  const k = wKey(d,e,vi,g);
  if(custom.w && custom.w[k] !== undefined) return custom.w[k];
  const arr = DAYS[d].ex[e][3][vi][1];
  return (arr && arr[g] !== undefined) ? arr[g] : 0;
}
function wSet(d,e,vi,g,val){
  custom.w = custom.w || {};
  custom.w[wKey(d,e,vi,g)] = val;
}
function recWeight(d,e){
  return wGet(d, e, cur(d,e).v, gym) || 0;
}

function drawHeader(){
  $("#days").innerHTML = DAYS.map((x,i)=>
    `<button class="day ${i===day?'on':''}" data-d="${i}" onclick="setDay(${i})">${x.name.replace(" + ","<br>+ ")}</button>`).join("");
  $("#gyms").innerHTML = GYMS.map((g,i)=>
    `<button class="gym ${i===gym?'on':''}" onclick="${i===gym?`editGym()`:`setGym(${i})`}">${g}</button>`).join("")
    + `<button class="gym add" onclick="addGym()">＋</button>`;
  document.documentElement.style.setProperty("--day", DAYS[day].color);
  $("#dayTitle").textContent = DAYS[day].name;
  $("#daySub").textContent = `Зал: ${GYMS[gym]} · ${DAYS[day].ex.length} упражнений`;
}

function drawList(){
  $("#list").innerHTML = DAYS[day].ex.map((ex,e)=>{
    const [slot,scheme,nsets,vars] = ex;
    const st = cur(day,e);
    const w  = recWeight(day,e);
    const isPlank = slot==="Планка";
    const lk = last[key(day,e)];

    const opts = vars.map((v,i)=>{
      const vw = wGet(day,e,i,gym);
      return `<option value="${i}" ${i===st.v?'selected':''}>${v[0]}${vw?' · '+vw+' кг':''}</option>`;
    }).join("");

    const sets = st.sets.map((s,i)=>{
      const ghost = lk && lk.sets[i] ? `${lk.sets[i].w||"—"}/${lk.sets[i].r||"—"}` : "";
      return `<div class="set">
        <span class="set-n">${i+1}</span>
        <div class="f"><input class="inp" type="text" inputmode="decimal" placeholder="${isPlank?'мин':(w||'кг')}"
          value="${s.w}" oninput="upd(${e},${i},'w',this.value)"></div>
        <span class="sep">/</span>
        <div class="f"><input class="inp" type="text" inputmode="numeric" placeholder="${isPlank?'—':'повт'}"
          value="${s.r}" oninput="upd(${e},${i},'r',this.value)"></div>
        <button class="done ${s.done?'on':''}" onclick="tog(${e},${i})">✓</button>
      </div>`;
    }).join("");

    const board = isPlank ? "" : `<div class="board">
        <span class="board-num" onclick="editW(${e})">${w||"—"}</span><span class="board-unit">кг</span>
        <span class="board-tag">рекомендую<br>${GYMS[gym]}</span>
      </div>`;

    const hint = lk ? `<div class="hint">Прошлый раз: <b>${lk.sets.map(s=>s.w?`${s.w}/${s.r||"?"}`:"—").join("  ")}</b></div>` : "";

    return `<div class="card">
      <div class="card-top">
        <div class="slot"><span>${e+1}. ${slot}</span><span class="scheme">${scheme}</span></div>
        <select class="pick" ${vars.length<2?'disabled':''} onchange="setVar(${e},this.value)">${opts}</select>
        ${board}
        <div class="edit">
          <button class="ebtn mv" onclick="move(${e},-1)" ${e===0?'disabled':''}>↑</button>
          <button class="ebtn mv" onclick="move(${e},1)" ${e===DAYS[day].ex.length-1?'disabled':''}>↓</button>
          <button class="ebtn" onclick="addVar(${e})">＋ вариант</button>
          ${vars.length>1 && vars[st.v][2] ? `<button class="ebtn del" onclick="delVar(${e})">✕</button>` : ""}
        </div>
      </div>
      <div class="sets">${sets}</div>
      ${hint}
    </div>`;
  }).join("") + `<button class="addex" onclick="addEx()">＋ добавить упражнение</button>`;
  drawStat();
}

function drawStat(){
  let done=0, all=0, vol=0;
  DAYS[day].ex.forEach((ex,e)=>{
    cur(day,e).sets.forEach(s=>{
      all++; if(s.done) done++;
      const w=parseFloat(String(s.w).replace(",",".")), r=parseInt(s.r);
      if(w&&r) vol += w*r;
    });
  });
  $("#stat").innerHTML = `<b>${done}</b>/${all} подходов${vol?` · тоннаж <b>${Math.round(vol)}</b> кг`:""}`;
}

window.addGym = function(){
  const name = prompt("Название зала:");
  if(!name || !name.trim()) return;
  const g = GYMS.length;
  // веса нового зала — копия текущего, дальше правишь тапом по цифре
  DAYS.forEach((day_, d)=>{
    day_.ex.forEach((ex, e)=>{
      ex[3].forEach((v, vi)=>{ wSet(d, e, vi, g, wGet(d, e, vi, gym)); });
    });
  });
  GYMS.push(name.trim());
  custom.gyms = GYMS.slice();
  gym = g;
  saveCustom(); drawHeader(); drawList();
  toast("Зал добавлен — веса скопированы, поправь тапом по цифре");
};

window.editGym = function(){
  const cur_ = GYMS[gym];
  const r = prompt("Название зала (стереть и сохранить = удалить):", cur_);
  if(r === null) return;
  if(!r.trim()){
    if(GYMS.length < 2){ toast("Последний зал не удалить"); return; }
    if(!confirm("Удалить зал «"+cur_+"» вместе с его весами?")) return;
    const del = gym;
    GYMS.splice(del,1);
    // веса удалённого зала выбрасываем, остальные сдвигаем
    const nw = {};
    Object.keys(custom.w||{}).forEach(k=>{
      const [d,e,vi,g] = k.split(":").map(Number);
      if(g === del) return;
      nw[wKey(d,e,vi, g > del ? g-1 : g)] = custom.w[k];
    });
    custom.w = nw;
    custom.gyms = GYMS.slice();
    gym = 0;
    saveCustom(); drawHeader(); drawList(); toast("Зал удалён");
    return;
  }
  GYMS[gym] = r.trim();
  custom.gyms = GYMS.slice();
  saveCustom(); drawHeader(); drawList();
};

window.move = function(e, dir){
  const list = DAYS[day].ex;
  const t = e + dir;
  if(t < 0 || t >= list.length) return;

  // меняем местами сами упражнения
  [list[e], list[t]] = [list[t], list[e]];

  // и всё, что к ним привязано: заполненные подходы и прошлая тренировка
  [[state,'state'],[last,'last']].forEach(([obj])=>{
    const a = obj[key(day,e)], b = obj[key(day,t)];
    if(a===undefined && b===undefined) return;
    if(b===undefined) delete obj[key(day,e)]; else obj[key(day,e)] = b;
    if(a===undefined) delete obj[key(day,t)]; else obj[key(day,t)] = a;
  });

  // custom-варианты тоже переезжают вместе с упражнением
  const ca = custom.vars[key(day,e)], cb = custom.vars[key(day,t)];
  if(ca!==undefined || cb!==undefined){
    if(cb===undefined) delete custom.vars[key(day,e)]; else custom.vars[key(day,e)] = cb;
    if(ca===undefined) delete custom.vars[key(day,t)]; else custom.vars[key(day,t)] = ca;
  }

  custom.order = custom.order || {};
  custom.order[day] = list.map(x=>x[0]);
  saveCustom(); save(true); drawList();
};

window.addVar = function(e){
  const name = prompt("Название упражнения:");
  if(!name || !name.trim()) return;
  const w = askNum("Рабочий вес, кг (0 — если без веса):", 0);
  if(w===null) return;
  const k = key(day,e);
  custom.vars[k] = custom.vars[k] || [];
  custom.vars[k].push([name.trim(), [w,w,w], true]);
  DAYS[day].ex[e][3].push([name.trim(), [w,w,w], true]);
  cur(day,e).v = DAYS[day].ex[e][3].length - 1;
  saveCustom(); drawList(); toast("Вариант добавлен");
};

window.delVar = function(e){
  const st = cur(day,e);
  const v  = DAYS[day].ex[e][3][st.v];
  if(!v || !v[2]) return;
  if(!confirm("Удалить «"+v[0]+"»?")) return;
  DAYS[day].ex[e][3].splice(st.v,1);
  const k = key(day,e);
  custom.vars[k] = (custom.vars[k]||[]).filter(x=>x[0]!==v[0]);
  st.v = 0; saveCustom(); drawList(); toast("Удалено");
};

window.editW = function(e){
  const st = cur(day,e);
  const v  = DAYS[day].ex[e][3][st.v];
  const w  = askNum("Рабочий вес в зале «"+GYMS[gym]+"», кг:", wGet(day,e,st.v,gym));
  if(w===null) return;
  wSet(day,e,st.v,gym,w);
  saveCustom(); drawList(); toast("Вес обновлён");
};

window.addEx = function(){
  const name = prompt("Название упражнения:");
  if(!name || !name.trim()) return;
  const scheme = prompt("Схема (например 3×12):", "3×12") || "3×12";
  let n = parseInt(scheme); if(!n || n<1 || n>8) n = 3;
  const w = askNum("Рабочий вес, кг (0 — если без веса):", 0);
  if(w===null) return;
  const item = [name.trim(), scheme, n, [[name.trim(),[w,w,w],true]]];
  custom.ex[day] = custom.ex[day] || [];
  custom.ex[day].push(item);
  DAYS[day].ex.push([item[0],item[1],item[2],item[3].map(v=>[v[0],v[1].slice(),true]),true]);
  if(custom.order && custom.order[day]) custom.order[day].push(item[0]);
  saveCustom(); drawList(); toast("Упражнение добавлено");
};

window.setDay = i => { day=i; gym=DAYS[i].gym; drawHeader(); drawList(); };
window.setGym = i => { gym=i; drawHeader(); drawList(); };
window.setVar = (e,v) => { cur(day,e).v=+v; drawList(); };
window.upd = (e,i,f,val) => { cur(day,e).sets[i][f]=val; drawStat(); save(true); };
window.tog = (e,i) => {
  const s = cur(day,e).sets[i];
  s.done = !s.done;
  if(s.done && !s.w) s.w = String(recWeight(day,e)||"");
  drawList(); save(true);
};

let t=null;
function toast(msg){
  const el=$("#toast"); el.textContent=msg; el.classList.add("show");
  clearTimeout(t); t=setTimeout(()=>el.classList.remove("show"),1600);
}

let saveTimer=null;
async function save(silent){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      localStorage.setItem("gym:current", JSON.stringify({state,gym,day}));
      if(!silent) toast("Сохранено");
    }catch(err){ if(!silent) toast("Не сохранилось"); }
  }, silent?600:0);
}

$("#saveBtn").onclick = ()=>{
  try{
    const stamp = new Date().toISOString().slice(0,10);
    // в историю пишем НАЗВАНИЯ и цифры — так запись не поедет при перестановке упражнений
    const items = DAYS[day].ex.map((ex,e)=>({
      name: ex[0],
      sets: cur(day,e).sets.filter(s=>s.w||s.r).map(s=>({w:s.w, r:s.r}))
    })).filter(x=>x.sets.length);
    if(!items.length){ toast("Нечего записывать — заполни подходы"); return; }
    localStorage.setItem("gym:hist:"+stamp+":"+day, JSON.stringify({date:stamp, day, items}));
    localStorage.setItem("gym:last:"+day, JSON.stringify(state));
    last={}; Object.keys(state).forEach(k=>{ if(k.startsWith(day+":")) last[k]=JSON.parse(JSON.stringify(state[k])); });
    DAYS[day].ex.forEach((ex,e)=>cur(day,e).sets.forEach(s=>{s.w="";s.r="";s.done=false;}));
    save(true); drawList(); toast("Тренировка записана");
  }catch(e){ toast("Ошибка записи"); }
};

// ── История и прогресс ──
function histFor(d){
  const out=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k || !k.startsWith("gym:hist:")) continue;
    if(!k.endsWith(":"+d)) continue;
    try{ const o=JSON.parse(localStorage.getItem(k)); if(o && o.items) out.push(o); }catch(e){}
  }
  return out.sort((a,b)=> a.date < b.date ? 1 : -1);
}
function maxW(sets){
  let m=0; sets.forEach(s=>{ const w=parseFloat(String(s.w).replace(",",".")); if(w>m) m=w; });
  return m;
}
function spark(vals){
  if(vals.length<2) return "";
  const w=104,h=26,mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1;
  const pts=vals.map((v,i)=>[ (i/(vals.length-1))*w, h-2-((v-mn)/rg)*(h-6) ]);
  const dd=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const lastP=pts[pts.length-1];
  return `<svg width="${w}" height="${h}" style="display:block">
    <path d="${dd}" stroke="#C8102E" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${lastP[0].toFixed(1)}" cy="${lastP[1].toFixed(1)}" r="2.6" fill="#C8102E"/></svg>`;
}
window.showHist = function(){
  const H = histFor(day);
  const box = $("#hist");
  if(!H.length){
    box.innerHTML = `<div class="hwrap"><div class="hhead"><b>История — ${DAYS[day].name||DAYS[day].short.replace(/<br>/g," ")}</b>
      <button class="btn ghost" onclick="hideHist()">Закрыть</button></div>
      <div class="hempty">Пока пусто. Заполни подходы и нажми «Готово» — тренировка попадёт сюда.</div></div>`;
    box.style.display="block"; return;
  }
  // собираем по упражнениям
  const names=[]; H.forEach(h=>h.items.forEach(it=>{ if(!names.includes(it.name)) names.push(it.name); }));
  const cards = names.map(n=>{
    const rows = H.filter(h=>h.items.some(it=>it.name===n))
      .map(h=>({date:h.date, sets:h.items.find(it=>it.name===n).sets}));
    const series = rows.map(r=>maxW(r.sets)).reverse().filter(v=>v>0);
    const first=series[0], lastv=series[series.length-1];
    let trend="";
    if(series.length>1 && first){
      const dlt=+(lastv-first).toFixed(1);
      trend = dlt>0 ? `<span class="up">+${dlt} кг</span>`
            : dlt<0 ? `<span class="dn">${dlt} кг</span>`
            : `<span class="fl">без изменений</span>`;
    }
    const list = rows.slice(0,8).map(r=>{
      const d=r.date.slice(8,10)+"."+r.date.slice(5,7);
      return `<div class="hrow"><span class="hdate">${d}</span>
        <span class="hsets">${r.sets.map(s=>`${s.w||"—"}<i>/${s.r||"?"}</i>`).join("  ")}</span></div>`;
    }).join("");
    return `<div class="hcard">
      <div class="hname">${n}</div>
      <div class="htop2">${trend}<span class="hcnt">${rows.length} трен.</span>${spark(series)}</div>
      ${list}</div>`;
  }).join("");
  box.innerHTML = `<div class="hwrap"><div class="hhead"><b>История — ${DAYS[day].name||DAYS[day].short.replace(/<br>/g," ")}</b>
    <button class="btn ghost" onclick="hideHist()">Закрыть</button></div>${cards}</div>`;
  box.style.display="block";
};
window.hideHist = function(){ $("#hist").style.display="none"; };

$("#clearBtn").onclick = ()=>{
  DAYS[day].ex.forEach((ex,e)=>{ cur(day,e).sets.forEach(s=>{ s.w=""; s.r=""; s.done=false; }); });
  drawList(); save(true); toast("Очищено");
};

// 1) РИСУЕМ СРАЗУ — экран не должен ждать хранилище
try { drawHeader(); drawList(); }
catch(err){ document.getElementById("list").innerHTML =
  '<div style="padding:20px;color:#C8102E">Ошибка отрисовки: '+err.message+'</div>'; }

// 2) хранилище — localStorage телефона
(function load(){
  try{
    const rawC = localStorage.getItem("gym:custom");
    if(rawC){
      custom = JSON.parse(rawC);
      custom.w = custom.w || {};
      if(Array.isArray(custom.gyms) && custom.gyms.length) GYMS = custom.gyms.slice();
      applyCustom();
    }
    const raw = localStorage.getItem("gym:current");
    if(raw){
      const o = JSON.parse(raw);
      state = o.state || {};
      if(typeof o.gym === "number" && o.gym < GYMS.length) gym = o.gym;
      if(typeof o.day === "number") day = o.day;
    }
    for(let d=0; d<DAYS.length; d++){
      const r = localStorage.getItem("gym:last:"+d);
      if(r){ const o=JSON.parse(r); Object.keys(o).forEach(k=>{ if(k.startsWith(d+":")) last[k]=o[k]; }); }
    }
    drawHeader(); drawList();
  }catch(e){}
})();

// ── экспорт / импорт: файл уходит в «Файлы», iCloud, куда угодно ──
window.exportData = function(){
  const dump = {v:2, saved:new Date().toISOString(), state, last, custom,
                hist: Object.keys(localStorage).filter(k=>k.startsWith("gym:hist:"))
                        .reduce((a,k)=>(a[k]=localStorage.getItem(k),a),{})};
  const blob = new Blob([JSON.stringify(dump,null,1)], {type:"application/json"});
  const name = "trenirovki-"+new Date().toISOString().slice(0,10)+".json";
  if(navigator.share && navigator.canShare && navigator.canShare({files:[new File([blob],name)]})){
    navigator.share({files:[new File([blob],name,{type:"application/json"})], title:"Тренировки"});
  } else {
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=name; a.click();
  }
  toast("Файл готов");
};
window.importData = function(input){
  const f = input.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const o = JSON.parse(rd.result);
      state = o.state || {}; last = o.last || {};
      if(o.custom){ custom = o.custom; saveCustom(); applyCustom(); }
      if(o.hist) Object.keys(o.hist).forEach(k=>localStorage.setItem(k,o.hist[k]));
      localStorage.setItem("gym:current", JSON.stringify({state,gym,day}));
      drawHeader(); drawList(); toast("Данные загружены");
    }catch(e){ toast("Файл не читается"); }
  };
  rd.readAsText(f);
};

if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
