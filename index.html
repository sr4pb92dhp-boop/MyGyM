<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MyGyM — тренировки</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тренировки">
<meta name="theme-color" content="#171a20">
<link rel="apple-touch-icon" href="icon-v2.png">
<style>
:root{
  --flash:#E0102E; --flashbg:rgba(224,16,46,.12);
  --iron:#14171C; --surface:#1E232B; --surface2:#262C36; --line:#333B47;
  --chalk:#F2F0EB; --mute:#8B95A5;
  --red:#C8102E; --blue:#1266B0; --green:#2A8A4A; --yellow:#F2C300;
  --day:var(--blue);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--iron);color:var(--chalk);font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button{font-family:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}

/* шапка */
header{position:sticky;top:0;z-index:20;background:var(--iron);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.days{display:flex;gap:6px;padding:12px 14px 8px;max-width:640px;margin:0 auto}
.day{flex:1;border:none;border-radius:10px;padding:10px 4px 8px;cursor:pointer;background:var(--surface);color:var(--mute);
  font-family:"Helvetica Neue",Arial,sans-serif;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
  line-height:1.15;border-bottom:3px solid transparent;transition:.15s;min-width:0}
.day.on{background:var(--surface2);color:var(--chalk)}
.day.on[data-d="0"]{border-bottom-color:var(--blue)}
.day.on[data-d="1"]{border-bottom-color:var(--red)}
.day.on[data-d="2"]{border-bottom-color:var(--green)}
.day.wide{flex:0 0 40px;font-size:16px;padding:10px 2px;text-transform:none}
.ago{font-size:9.5px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--mute);margin-top:4px}
.ago.late{color:#FF6B6B;font-weight:700}
.tempmark{color:var(--yellow);font-size:9.5px;margin-top:3px;text-transform:none;letter-spacing:0}
.bar{display:flex;align-items:center;gap:9px;padding:0 14px 12px;max-width:640px;margin:0 auto}
.bar-label{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em;flex-shrink:0;font-weight:700}
.gym-picker{position:relative;flex:1;min-width:0}
.gym-picker:after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.gym-select{width:100%;height:42px;padding:0 38px 0 13px;border:1px solid var(--line);border-radius:11px;background:linear-gradient(145deg,var(--surface2),var(--surface));color:var(--chalk);font:600 14px -apple-system,BlinkMacSystemFont,sans-serif;appearance:none;-webkit-appearance:none;outline:none}
.gym-select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(18,102,176,.2)}
.gym-action{height:42px;min-width:42px;padding:0 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--chalk);font-size:20px;font-weight:500;cursor:pointer}
.gym-action:active{background:var(--surface2)}

.title{font-family:"Helvetica Neue",Arial,sans-serif;font-size:19px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin:16px 0 2px}
.sub{font-size:12px;color:var(--mute);margin-bottom:6px}
.warn,.nag{border-radius:10px;padding:10px 13px;font-size:12.5px;margin:8px 0;cursor:pointer;line-height:1.4}
.warn{background:rgba(200,16,46,.13);border:1px solid rgba(200,16,46,.4);color:#FF8A8A}
.nag{background:rgba(242,195,0,.1);border:1px solid rgba(242,195,0,.35);color:var(--yellow)}

/* карточка */
.card{background:var(--surface);border-radius:14px;margin:12px 0;overflow:hidden;border-left:3px solid var(--day)}
.card-top{padding:14px 16px 12px}
.slot{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;font-weight:500;color:var(--mute);text-transform:uppercase;
  letter-spacing:.1em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.scheme{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11px;color:var(--chalk);
  cursor:pointer;flex-shrink:0;font-family:-apple-system,sans-serif;font-weight:600;letter-spacing:0}
.stag{display:inline-block;margin-left:7px;font-size:9.5px;letter-spacing:.02em;text-transform:none;color:#FF8A8A;
  border:1px solid rgba(200,16,46,.45);border-radius:5px;padding:0 5px;vertical-align:1px}
.pick{width:100%;margin-top:8px;background:var(--surface2);color:var(--chalk);border:1px solid var(--line);border-radius:9px;
  padding:11px 34px 11px 12px;font-size:15px;font-weight:500;appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%238B95A5' stroke-width='2' fill='none'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center}
.pick:disabled{opacity:.6;background-image:none}
.board{display:flex;align-items:baseline;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.board-num{font-family:"Helvetica Neue",Arial,sans-serif;font-size:44px;font-weight:700;transform:scaleX(.92);transform-origin:left;
  line-height:.85;font-variant-numeric:tabular-nums;cursor:pointer}
.board-unit{font-family:"Helvetica Neue",Arial,sans-serif;font-size:14px;color:var(--mute);font-weight:500}
.board-tag{margin-left:auto;font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;text-align:right;line-height:1.4}
.note{margin-top:9px;font-size:12.5px;color:var(--yellow);cursor:pointer}
.edit{display:flex;gap:6px;margin-top:10px}
.eb{flex:1;background:transparent;border:1px dashed var(--line);color:var(--mute);border-radius:8px;padding:8px 4px;
  font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.eb:active{background:var(--surface2)}
.eb:disabled{opacity:.3}
.eb.mv{flex:0 0 40px;font-size:15px;line-height:1}
.eb.yt{flex:0 0 40px;color:#FF4B4B;border-color:rgba(255,75,75,.35);font-size:11px}
.sets{border-top:1px solid var(--line);background:rgba(0,0,0,.15)}
.set{display:flex;align-items:center;gap:8px;padding:9px 16px;border-bottom:1px solid rgba(51,59,71,.5)}
.set:last-child{border-bottom:none}
.set-n{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;color:var(--mute);width:18px;flex-shrink:0;font-weight:500}
.inp{background:var(--surface2);border:1px solid var(--line);border-radius:8px;color:var(--chalk);font-family:"Helvetica Neue",Arial,sans-serif;
  font-size:17px;font-weight:600;padding:8px 6px;text-align:center;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.inp:focus{outline:none;border-color:var(--day);background:#2C3441}
.inp::placeholder{color:#4E5765;font-weight:400}
.f{flex:1;min-width:0}
.sep{color:var(--mute);font-size:13px;flex-shrink:0}
.done{width:38px;height:38px;flex-shrink:0;border-radius:9px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--mute);font-size:16px}
.done.on{background:var(--day);border-color:var(--day);color:#fff}
.hint{padding:9px 16px;font-size:11.5px;color:var(--mute);border-top:1px solid rgba(51,59,71,.5);line-height:1.45}
.hint b{color:var(--chalk);font-weight:600}
.addex{width:100%;margin:6px 0 12px;background:transparent;border:1px dashed var(--line);color:var(--mute);border-radius:12px;
  padding:14px;font-size:14px;font-weight:600;cursor:pointer}
.hidebtn{width:100%;margin:2px 0 12px;background:transparent;border:1px dashed var(--line);color:var(--mute);border-radius:10px;padding:10px;font-size:12px;cursor:pointer}
.danger{color:#FF6B6B!important;border-color:rgba(200,16,46,.45)!important}

/* низ */
.foot{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--iron);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.foot-in{display:flex;gap:8px;align-items:center;max-width:640px;margin:0 auto}
.stat{flex:1;min-width:0;font-size:11px;color:var(--mute);line-height:1.35}
.stat b{color:var(--chalk);font-family:"Helvetica Neue",Arial,sans-serif;font-size:15px;font-weight:600}
.btn{border:none;border-radius:11px;padding:13px 16px;cursor:pointer;font-size:15px;font-weight:700;background:var(--day);color:#fff}
.btn.ghost{background:var(--surface2);color:var(--chalk);font-weight:600;padding:13px 14px}
.btn.go{flex:0 0 42%;padding:15px 10px;font-size:16px;letter-spacing:.02em}
.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--chalk);color:var(--iron);padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;
  transition:.25s;pointer-events:none;z-index:70;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* модалка */
#modal{position:fixed;inset:0;z-index:60;background:var(--iron);display:none;overflow-y:auto;
  padding:0 14px 40px;padding-top:calc(20px + env(safe-area-inset-top))}
.mwrap{max-width:600px;margin:0 auto}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.mhead b{font-size:16px}
.mgroup{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:16px 0 7px}
.program-grid{display:grid;gap:10px;margin:4px 0 12px}.program-card{width:100%;text-align:left;border:1px solid var(--line);border-radius:15px;padding:13px 14px;background:var(--card);color:var(--text);cursor:pointer}.program-card.selected{border-color:var(--red);background:color-mix(in srgb,var(--red) 9%,var(--card))}.program-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.program-top b{font-size:15px}.program-badge{font-size:9px;font-weight:800;letter-spacing:.6px;color:var(--red)}.program-meta{margin-top:8px;font-size:11px;color:var(--mute);font-weight:700}.program-desc{margin-top:4px;font-size:12px;line-height:1.4;color:var(--text)}.program-note{margin-top:7px;color:var(--red);font-size:11px;font-weight:700}.program-action{width:100%;height:48px;border:0;border-radius:14px;background:var(--red);color:#fff;font-weight:800;font-size:14px;cursor:pointer}.program-action:disabled{background:var(--card);color:var(--mute);border:1px solid var(--line)}
.mitem{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);color:var(--chalk);border-radius:11px;
  padding:13px 15px;font-size:14px;margin-bottom:7px;cursor:pointer;display:flex;align-items:center;gap:9px}
.mitem:active{background:var(--surface2)}
.mitem small{color:var(--mute);font-size:11.5px;margin-left:auto;text-align:right}
.mnote{color:var(--mute);font-size:12.5px;line-height:1.6;margin:4px 0 14px}
.minput{width:100%;padding:13px 14px;border-radius:11px;font-size:16px;border:1px solid var(--line);background:rgba(0,0,0,.25);
  color:inherit;font-family:inherit;margin-bottom:10px}
.mrow{display:flex;gap:8px}
.mbtn{justify-content:center;font-weight:600}
.mbtn.ok{background:var(--day);border-color:var(--day)}
.ytmini{flex-shrink:0;color:#FF4B4B;font-size:12px;padding:4px 9px;border:1px solid rgba(255,75,75,.3);border-radius:7px;cursor:pointer}

/* история */
#hist{position:fixed;inset:0;z-index:50;background:var(--iron);overflow-y:auto;
  padding:14px 14px calc(24px + env(safe-area-inset-bottom));padding-top:calc(14px + env(safe-area-inset-top))}
.hwrap{max-width:600px;margin:0 auto}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.hhead b{font-size:16px;font-weight:600}
.hchips{display:flex;gap:5px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.hchips .gym{flex:0 0 auto}
.hempty{color:var(--mute);font-size:13px;line-height:1.6;padding:20px 4px}
.hcard{background:var(--surface);border-radius:13px;padding:13px 15px;margin-bottom:11px;border:1px solid var(--line)}
.hname{font-size:14.5px;font-weight:600;margin-bottom:8px}
.hname small{display:block;font-weight:400;color:var(--mute);font-size:12px;margin-top:2px}
.htop2{display:flex;align-items:center;gap:9px;margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.htop2 .up{color:#5FD08A;font-size:12.5px;font-weight:600}
.htop2 .dn{color:#FF6B6B;font-size:12.5px;font-weight:600}
.htop2 .fl{color:var(--mute);font-size:12.5px}
.htop2 .stag{margin-left:0}
.hcnt{color:var(--mute);font-size:11.5px;margin-right:auto}
.hrow{display:flex;gap:11px;padding:4px 0;font-size:12.5px;align-items:baseline}
.hdate{color:var(--mute);width:42px;flex-shrink:0;font-variant-numeric:tabular-nums}
.hsets{font-variant-numeric:tabular-nums;flex:1}
.hsets i{color:var(--mute);font-style:normal}
.hg{color:var(--mute);font-size:10.5px;flex-shrink:0}
.weeks{display:flex;gap:5px;align-items:flex-end}
.wk{flex:1;text-align:center;min-width:0}
.wkv{font-size:9.5px;color:var(--chalk);height:13px}
.wkb{height:64px;background:rgba(0,0,0,.25);border-radius:5px;display:flex;align-items:flex-end;overflow:hidden}
.wkb i{display:block;width:100%;background:var(--day);border-radius:5px 5px 0 0}
.wkl{font-size:9.5px;color:var(--mute);margin-top:4px}
.wkn{font-size:9px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.flash{position:fixed;inset:0;z-index:25;pointer-events:none;border:0 solid var(--flash);opacity:0}
.flash.on{border-width:10px;animation:blink .8s steps(2,start) infinite;opacity:1;background:var(--flashbg)}
@keyframes blink{to{opacity:0}}

/* v4.5: таймер — большая плашка сверху, четверть экрана */
.rest{position:fixed;top:0;left:0;right:0;height:25vh;min-height:150px;z-index:45;
  padding:calc(env(safe-area-inset-top) + 8px) 16px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#5B2A86;color:#fff;border-radius:0 0 24px 24px;box-shadow:0 8px 30px rgba(0,0,0,.45);
  transform:translateY(-105%);transition:transform .25s;cursor:pointer;text-align:center;font-size:15px;font-weight:600;letter-spacing:.02em}
.rest.show{transform:translateY(0)}
.rest b{display:block;font-family:"Helvetica Neue",Arial,sans-serif;font-size:68px;font-weight:800;line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.rest .x{position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:18px;font-size:20px;opacity:.75}
.rest.end{animation:yr .6s steps(1) infinite;color:#14171C;font-size:24px;font-weight:900}
@keyframes yr{0%{background:#F2C300}50%{background:#E0102E;color:#fff}}
@media (prefers-reduced-motion:reduce){.flash.on,.rest.end{animation:none}}
/* v4.5: вес по залу, пробный подход, разгрузка */
.prog{margin-left:auto;align-self:center;text-align:right;font-size:10.5px;line-height:1.35;color:#5FD08A;text-transform:uppercase;letter-spacing:.06em}
.prog b{font-size:17px;letter-spacing:0}
.prog.dl{color:#B48CE0}
.set-n.pr,.set-n i,.sn i{color:#F2C300;font-style:normal;font-weight:800}
.set-n.pr{width:24px}
.inp.probe::placeholder{color:#C9A400;font-weight:700}
.drop{padding:7px 16px 9px;font-size:12px;color:#FFB4B4;background:rgba(224,16,46,.10);border-bottom:1px solid rgba(224,16,46,.25)}
.other{margin-top:9px;font-size:12px;line-height:1.45;color:#D9C27A}
.other b{color:inherit}
.dlb{border-radius:12px;padding:11px 13px;font-size:12.5px;margin:8px 0;line-height:1.45;background:rgba(91,42,134,.25);border:1px solid #7B4BB0;color:#E3D2F7}
.dlb button{margin-left:6px;background:#7B4BB0;color:#fff;border:none;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer}

/* MyGyM 4.13 — оформление из предпросмотра */
:root{--iron:#171a20;--surface:#20242b;--surface2:#252931;--line:#373c45;--chalk:#f5f5f6;--mute:#a1a7b1;--red:#ed3340;--accent:#ed3340;--card:var(--surface2);--text:var(--chalk)}
body{padding-bottom:calc(160px + env(safe-area-inset-bottom));line-height:1.45}
button,input,select{font-family:inherit}button{touch-action:manipulation}button:focus-visible,summary:focus-visible{outline:2px solid #ff7078;outline-offset:3px}
header{position:relative;border:0;padding:calc(20px + env(safe-area-inset-top)) 20px 0;max-width:640px;margin:auto}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:17px;color:var(--accent);font-weight:850;letter-spacing:2px}.release{font-size:10px;letter-spacing:.4px;color:var(--mute);margin-left:8px;font-weight:500}
.hero-actions{display:flex;gap:8px}.icon-btn{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:var(--surface2);color:var(--chalk);cursor:pointer}.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.title{font-size:28px;line-height:1.12;letter-spacing:-.7px;font-weight:750;text-transform:none;margin:15px 0 9px;font-family:inherit;max-width:480px}.hero-date{color:var(--mute);font-size:13px;margin-bottom:20px}
.program-switch{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;text-align:left;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--chalk);cursor:pointer}.program-symbol{font-size:23px;color:var(--accent)}.program-switch small{display:block;color:var(--mute);font-size:10px;text-transform:uppercase;letter-spacing:1px}.program-switch b{font-size:14px}.program-switch .switch-tail{margin-left:auto;text-align:right;font-size:11px;color:var(--mute)}

/* ── модель: приводим старые форматы (его и Анин) к одному виду ── */
function normVar(v, mine){
  if(!Array.isArray(v)) return {name:v.name, w:(v.w||[0]).slice(), mine:!!(v.mine||mine)};
  const w = Array.isArray(v[1]) ? v[1].slice() : [v[1]==null?0:v[1]];
  return {name:v[0], w:w, mine:!!(v[2]||mine)};
}
function normEx(x, mine){
  let o;
  if(!Array.isArray(x)){
    o={name:x.name, scheme:x.scheme||"3×12", n:x.n||parseInt(x.scheme)||3, motto:x.motto||"",
       mine:!!mine, vars:(x.vars||[]).map(v=>normVar(v,mine))};
  } else {
    const anya = typeof x[3]==="string";
    const vars = (anya ? x[4] : x[3]) || [];
    o={name:x[0], scheme:x[1], n:x[2], motto:anya?x[3]:"", mine:!!mine||!!(anya?x[5]:x[4]),
       vars:vars.map(v=>normVar(v,mine))};
  }
  if(!o.vars.length) o.vars=[{name:o.name, w:[0], mine:!!mine}];
  o.scheme=String(o.scheme||"").replace(/(\d)\s*[xх]\s*(\d)/i,"$1×$2");
  return o;
}
function exOut(ex){ return {name:ex.name, scheme:ex.scheme, n:ex.n, motto:ex.motto||"", vars:ex.vars.map(v=>[v.name, v.w.slice()])}; }

function buildDays(){
  DAYS = BASE.map(d=>({name:d.name, short:d.short||"", id:null, ex:d.ex.map(x=>normEx(x,false))}));
  (custom.temp||[]).forEach(t=>DAYS.push({name:t.name, short:t.name, id:t.id, temp:true,
    ex:(t.ex||[]).map(x=>normEx(x,true))}));
}
function dk(d){ return DAYS[d] && DAYS[d].id ? DAYS[d].id : String(d); }
function dIdx(key){ return DAYS.findIndex((x,i)=>dk(i)===String(key)); }
function exAt(d,e){ return DAYS[d] && DAYS[d].ex[e]; }
function key(d,e){ return dk(d)+"||"+exAt(d,e).name; }

function applyCustom(){
  buildDays();
  Object.keys(custom.ex||{}).forEach(k=>{
    const d=dIdx(k); if(d<0) return;
    (custom.ex[k]||[]).forEach(x=>{ const o=normEx(x,true);
      if(!DAYS[d].ex.some(q=>q.name===o.name)) DAYS[d].ex.unshift(o); });
  });
  Object.keys(custom.schemes||{}).forEach(k=>{
    const i=k.indexOf("|"); const d=dIdx(k.slice(0,i)); if(d<0) return;
    const ex=DAYS[d].ex.find(q=>q.name===k.slice(i+1));
    if(ex){ ex.scheme=custom.schemes[k].s; ex.n=custom.schemes[k].n||parseInt(ex.scheme)||3; }
  });
  Object.keys(custom.order||{}).forEach(k=>{
    const d=dIdx(k); if(d<0) return;
    const by={}; DAYS[d].ex.forEach(x=>by[x.name]=x);
    const out=[]; (custom.order[k]||[]).forEach(n=>{ if(by[n]){ out.push(by[n]); delete by[n]; } });
    DAYS[d].ex.forEach(x=>{ if(by[x.name]) out.push(x); });
    DAYS[d].ex=out;
  });
  Object.keys(custom.vars||{}).forEach(k=>{
    const p=k.split("||"); if(p.length<2) return;
    const d=dIdx(p[0]); if(d<0) return;
    const ex=DAYS[d].ex.find(x=>x.name===p[1]); if(!ex) return;
    (custom.vars[k]||[]).forEach(v=>{ const o=normVar(v,true);
      if(!ex.vars.some(q=>q.name===o.name)) ex.vars.push(o); });
  });
  applyTrainingProgram();
  applyProgramOverrides();
}

let programPool=[];
function exerciseGroup(name){
  const n=name.toLowerCase().replace(/ё/g,"е");
  if(/задняя дельта|лучник/.test(n))return "rear";
  if(/средняя|мах.*боком|боков/.test(n))return "side";
  if(/жим.*плеч/.test(n))return "shoulder";
  if(/вертикальн/.test(n))return "vertical";
  if(/горизонтальн.*тяг|тяга гантели|тяга.*наклонной/.test(n))return "row";
  if(/пуловер/.test(n))return "pullover";
  if(/бицепс/.test(n))return "biceps";
  if(/трицепс/.test(n))return "triceps";
  if(/жим ногами|присед|выпад/.test(n))return "legs";
  if(/разгибание ног|квадр/.test(n))return "extension";
  if(/зпб|сгибание ног|сгибание одной ноги/.test(n))return "ham";
  if(/гиперэкст|румын|становая|ягодичн.*мост/.test(n))return "hinge";
  if(/икр|носки/.test(n))return "calf";
  if(/отведение бедра|приведение бедра/.test(n))return "hips";
  if(/пресс|планк/.test(n))return "core";
  if(/кроссовер|сведения|бабочка/.test(n))return "fly";
  if(/жим|брусья/.test(n))return "chestPress";
  return "other";
}
const GROUP_LABELS={chestPress:"Грудь",fly:"Грудь",vertical:"Спина",row:"Спина",pullover:"Спина",legs:"Квадрицепс / ягодицы",extension:"Квадрицепс",ham:"Задняя поверхность бедра",hinge:"Разгибатели спины",hips:"Ягодичные",calf:"Икры",side:"Средняя дельта",rear:"Задняя дельта",shoulder:"Плечи",biceps:"Бицепс",triceps:"Трицепс",core:"Пресс"};
function programOptions(id){

}
function programVariantDraftFilled(st){return !!st&&[...(st.sets||[]),...(st.extraSets||[])].some(s=>s.w||s.r||s.t||s.done)}
function planScheme(ex,n){return n+"×"+(isTimeName(ex.name)?"0:30–1:00 мин":['chestPress','vertical','row','legs','shoulder'].includes(ex.group)?"8–12":"10–15")}
function compactDays(id,volume){
  const options=programOptions(id);
  return (PROGRAM_LAYOUTS[id]||[]).map(([name,legacy,slots])=>{
    const dayId=programDayId(id,legacy),used=new Set(),out=[],choices=(options.choices||{})[dayId]||{};
    slots.forEach((spec,slot)=>{
      const [selector,variant]=spec.split('|'),[group,preference]=selector.split(":"),candidates=programPool.filter(x=>x.group===group&&!used.has(x.name));
      let source=candidates.find(x=>x.name===choices[slot]);
      if(!source)source=candidates.find(x=>x.name===preference);
      if(!source)source=candidates.find(x=>x.name.toLowerCase().replace(/ё/g,"е").includes(preference.toLowerCase().replace(/ё/g,"е")));
      if(!source)source=candidates[0];
      if(!source)return;
      used.add(source.name);const ex=programCopy(source);
      ex.n=volume==="short"?2:(['chestPress','vertical','row','legs','shoulder','ham','extension','calf'].includes(group)?3:2);

}
function applyTrainingProgram(){
  const seen=new Map();programPool=[];
  DAYS.slice(0,3).forEach((d,i)=>d.ex.forEach(ex=>{
    if(((custom.hidden||{})[String(i)]||[]).includes(ex.name))return;
    if(seen.has(ex.name)){const existing=seen.get(ex.name);ex.vars.forEach(v=>{if(!existing.vars.some(x=>x.name===v.name))existing.vars.push(programCopy(v))});return}
    const copy=programCopy(ex);copy.sourceDay=String(i);copy.group=exerciseGroup(ex.name);
    // Архив остаётся в локальном хранилище; точные варианты упражнений доступны в новых днях.
    HIST.forEach(r=>(r.items||[]).filter(it=>it.name===ex.name&&it.v).forEach(it=>{if(!copy.vars.some(v=>v.name===it.v))copy.vars.push({name:it.v,w:[0],mine:true})}));
    programPool.push(copy);seen.set(ex.name,copy);
  }));
  // These are public exercise definitions, never personal weights or workout records.
  const fallback=[['Пуловер в кроссовере','0'],['Отведение бедра в тренажёре','1'],['Жим в тренажёре на плечи','1'],['Кроссовер верх-низ','2'],['Кроссовер снизу вверх','2'],['Махи боком на наклонной','2']];
  fallback.forEach(([name,sourceDay])=>{if(!seen.has(name)&&!((custom.hidden||{})[sourceDay]||[]).includes(name)){const ex={name,sourceDay,group:exerciseGroup(name),n:2,scheme:'2×10–15',vars:[{name,w:[0]}]};programPool.push(ex);seen.set(name,ex)}});
  [['ЗПБ — задняя поверхность бедра','Сгибание одной ногой'],['Тяга гантели в наклоне','Тяга на наклонной скамье сверху']].forEach(([name,vn])=>{const ex=seen.get(name);if(ex&&!ex.vars.some(v=>v.name===vn))ex.vars.push({name:vn,w:[0]})});

function applyProgramOverrides(){if(!custom.program||custom.program==="classic")return;

  Object.keys(custom.schemes||{}).forEach(k=>{const i=k.indexOf("|"),d=dIdx(k.slice(0,i));if(d<0||DAYS[d].temp)return;const ex=DAYS[d].ex.find(q=>q.name===k.slice(i+1));if(ex){ex.scheme=custom.schemes[k].s;ex.n=programOptions(custom.program).volume==="short"?2:(custom.schemes[k].n||parseInt(ex.scheme)||3);ex.scheme=ex.scheme.replace(/^\d+/,String(ex.n))}});
  Object.keys(custom.order||{}).forEach(k=>{const d=dIdx(k);if(d<0||DAYS[d].temp)return;const by=new Map(DAYS[d].ex.map(x=>[x.name,x])),out=[];(custom.order[k]||[]).forEach(n=>{if(by.has(n)){out.push(by.get(n));by.delete(n)}});out.push(...by.values());DAYS[d].ex=out});

}

function wKey(d,e,vi,g){ const ex=exAt(d,e), v=ex.vars[vi]; return dk(d)+"||"+ex.name+"||"+(v?v.name:"#"+vi)+"||"+g; }
function wGet(d,e,vi,g){

  if(custom.w && custom.w[k]!=null) return custom.w[k];
  const v=exAt(d,e).vars[vi]; if(!v) return 0;

function wSet(d,e,vi,g,val){ custom.w=custom.w||{}; custom.w[wKey(d,e,vi,g)]=val; }
function cur(d,e){

    let vn=ex.vars[0].name;

    st=state[k]={v:0,vn,sets:[],autoVariant:!!DAYS[d].program,gymContext:GYMS[gym]};
  }
  if(st.autoVariant&&st.gymContext!==GYMS[gym]&&!(st.sets||[]).some(s=>s.w||s.r||s.t||s.done)){
    st.vn=preferredProgramVariant(ex,gym);st.gymContext=GYMS[gym];
  }

    st.vn=preferredProgramVariant(ex,gym);st.autoVariant=true;st.planRevision=415;
  }

  if(!(st.v>=0 && st.v<ex.vars.length)) st.v=0;

  const hasR=ws.some(s=>s.r!=="" && s.r!=null);
  if(hasR && top){ const full=ws.filter(s=>num(s.r)>=top); if(full.length) return Math.max(...full.map(s=>num(s.w))); }
  const cnt={}; ws.forEach(s=>{ const w=num(s.w); cnt[w]=(cnt[w]||0)+1; });
  return +Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||b-a)[0];
}
function wSetMan(d,e,vi,g,val){ wSet(d,e,vi,g,val); custom.wAt=custom.wAt||{}; custom.wAt[wKey(d,e,vi,g)]=new Date().toISOString(); }
function workInfo(d,e,vi,g){
  const ex=exAt(d,e), v=ex.vars[vi]; if(!v) return {w:0};
  const k=wKey(d,e,vi,g), u=unitOf(d,e,vi), top=topReps(ex.scheme);
  const L=gymRecs(ex.name, v.name, g)[0];
  let manKey=k;
  if((!custom.w||custom.w[k]==null||custom.w[k]==="") && custom.program && custom.program!=="classic"){
    const match=Object.keys(custom.w||{}).find(q=>{const p=q.split("||");return p.length>3&&p[1]===ex.name&&p[2]===v.name&&+p[3]===g;});
    if(match) manKey=match;
  }
  const man=(custom.w && custom.w[manKey]!=null && custom.w[manKey]!=="") ? num(custom.w[manKey]) : null;
  const manAt=(custom.wAt||{})[manKey];
  if(L){
    if(man!=null && manAt && manAt.slice(0,10)>=L.rec.date) return {w:man, src:"manual", L:L};
    return {w:Math.round(convW(workFromSets(L.it.sets,top), L.it.unit||"", u)*100)/100, src:"hist", L:L};
  }
  if(man!=null && (manAt || GYMS.length===1)) return {w:man, src:"manual"};
  const O=histItems(ex.name, v.name, null).filter(x=>!x.it.time && !x.rec.deload && maxW(x.it.sets)>0)[0];
  if(O){
    const w=Math.round(convW(workFromSets(O.it.sets,top),O.it.unit||"",u)*100)/100;
    if(w>0) return {w:w,src:"other",L:O,other:O};
  }
  return {w:0,src:null,other:O||null};
}
function knownWeights(name, vn, g, u){
  const all=histItems(name,vn,null).filter(x=>!x.it.time && !x.rec.deload);
  const local=all.filter(x=>x.rec.gym===GYMS[g] || (GYMS.length===1 && !x.rec.gym));
  const source=local.length?local:all;
  const s=new Set();
  source.forEach(x=>x.it.sets.forEach(q=>{const w=num(q.w);if(w>0)s.add(Math.round(convW(w,x.it.unit||"",u||x.it.unit||"")*1000)/1000);}));
  return [...s].sort((a,b)=>a-b);
}
function defStep(w,u){ if(u==="hand") return w>=10?2:1; return w<20?1:(w<100?2.5:5); }
function nextWeight(name, vn, g, w, u){
  const ks=knownWeights(name, vn, g, u).filter(x=>x>w+0.001 && x<=w*1.25+0.01);
  if(ks.length) return ks[0];
  const n=w+defStep(w,u);
  return w>=20 ? Math.round(n*2)/2 : Math.round(n*10)/10;
}
function deloadW(d,e,w){
  const ex=exAt(d,e), st=cur(d,e), target=w*0.85;
  const ks=knownWeights(ex.name, st.vn, gym, unitOf(d,e,st.v)).filter(x=>x<=target+0.001);
  return ks.length ? ks[ks.length-1] : Math.round(target*2)/2;
}
function recWeight(d,e,g){
  const st=cur(d,e); let w=workInfo(d,e,st.v,g==null?gym:g).w;
  if(w && deloadOn()) w=deloadW(d,e,w);
  return w||0;
}
/* пробный последний подход: все подходы на рабочем весе прошлый раз закрыты полностью → последний +шаг */
function probeFor(d,e){
  if(deloadOn()) return null;
  const ex=exAt(d,e), st=cur(d,e); if(isTime(d,e,st.v)) return null;
  const I=workInfo(d,e,st.v,gym); if(!I.w || !I.L || I.src!=="hist" && I.src!=="other") return null;
  const top=topReps(ex.scheme); if(!top) return null;
  if(DAYS[d].program&&(I.src!=="hist"||!I.L.it.comfortable||I.L.it.sets.length<effN(ex)||!I.L.it.sets.every(s=>num(s.r)>=top)))return null;
  const u=unitOf(d,e,st.v), W=I.w;
  const at=I.L.it.sets.filter(s=>Math.abs(convW(num(s.w),I.L.it.unit||"",u)-W)<0.01);
  if(at.length < (DAYS[d].program?effN(ex):Math.max(1,ex.n-1))) return null;
  if(!at.every(s=>num(s.r)>=top)) return null;
  return nextWeight(ex.name, st.vn, gym, W, u);
}
function uKey(d,e,vi){ const ex=exAt(d,e); return dk(d)+"||"+ex.name+"||"+((ex.vars[vi]||{}).name||""); }
function defUnit(vn){ return (T.handRe||/гантел/i).test(vn||"") ? "hand" : ""; }
function unitOf(d,e,vi){
  const ex=exAt(d,e),vn=(ex.vars[vi]||{}).name||"",k=uKey(d,e,vi);
  if(custom.unit&&custom.unit[k]!=null)return custom.unit[k];
  if(DAYS[d].program){
    const source=ex.sourceDay+"||"+ex.name+"||"+vn;
    if(custom.unit&&custom.unit[source]!=null)return custom.unit[source];
    const found=histItems(ex.name,vn,null),last=found.find(x=>x.rec.gym===GYMS[gym])||found[0];
    if(last&&Object.prototype.hasOwnProperty.call(last.it,"unit"))return last.it.unit||"";
  }
  return defUnit(vn);
}
function unitLabel(u){ return u==="hand" ? "кг/рука" : u==="pair" ? "кг · пара" : "кг"; }
function mult(u){ return u==="hand" ? 2 : 1; }
function convW(w,from,to){ if(from===to) return w; if(from==="hand"&&to==="pair") return w*2; if(from==="pair"&&to==="hand") return w/2; return w; }
function isTimeName(n){ return /планк/i.test(n||""); }
function isTime(d,e,vi){ const ex=exAt(d,e); const v=ex.vars[vi];
  return isTimeName(v?v.name:ex.name) || (ex.vars.length===1 && isTimeName(ex.name)); }
function hiddenList(d){ return (custom.hidden||{})[dk(d)] || []; }
function isHidden(d,name){ return hiddenList(d).includes(name); }
function topReps(s){ const m=String(s||"").match(/[×xх*]\s*(\d+)(?:\s*[–—-]\s*(\d+))?/i); return m?+(m[2]||m[1]):0; }
function stepFor(w,u){ if(u==="hand") return w>=10?2:1; return w>=20?2.5:(w>0?1:0); }

/* ── история ── */
function maxW(sets){ let m=0; (sets||[]).forEach(s=>{ const w=num(s.w); if(w>m) m=w; }); return m; }
function maxT(sets){ let m=0; (sets||[]).forEach(s=>{ const t=num(s.t); if(t>m) m=t; }); return m; }
function itemTon(it){ if(it.time) return 0; let v=0; (it.sets||[]).forEach(s=>{ v+=num(s.w)*num(s.r); }); return v*mult(it.unit); }
function recTon(r){ return (r.items||[]).reduce((a,it)=>a+itemTon(it),0); }

function guessVar(d, ex, mx){
  if(ex.vars.length===1) return ex.vars[0].name;
  const tv=ex.vars.find(v=>isTimeName(v.name));
  if(tv && mx>0 && mx<=3) return tv.name;
  if(!mx) return "";
  const e=DAYS[d].ex.indexOf(ex);
  let best=null, bd=Infinity;
  ex.vars.forEach((v,vi)=>{
    for(let g=0; g<Math.max(GYMS.length,1); g++){
      const w=num(wGet(d,e,vi,g));
      if(w>0){ const dd=Math.abs(w-mx)/Math.max(w,mx); if(dd<bd){ bd=dd; best=v.name; } }
    }
  });
  return (best && bd<=0.12) ? best : "";
}
function migrateRec(o){
  const dkey=String(o.day), d=dIdx(dkey);
  o.day=dkey;
  o.items=(o.items||[]).map(it=>{
    const fx=(T.fix||{})[o.date+"|"+dkey+"|"+it.name]||{};
    const ex = d>=0 ? DAYS[d].ex.find(x=>x.name===it.name) : null;
    let sets=(it.sets||[]).map(s=>({w:s.w==null?"":String(s.w), r:s.r==null?"":String(s.r)}));
    if(fx.div) sets=sets.map(s=>({w:s.w?fmt(num(s.w)/fx.div):"", r:s.r}));
    let vn = it.v || fx.v || (ex ? guessVar(d, ex, maxW(sets)) : it.name);
    const time = isTimeName(vn) || ((!ex || ex.vars.length===1) && isTimeName(it.name));
    if(time) sets=sets.map(s=>{ const a=num(s.w), b=num(s.r); return {t:String(Math.round((a&&b?a*b:(a||b))*60))}; });
    let unit = it.unit!=null ? it.unit : (fx.unit!=null ? fx.unit : defUnit(vn));
    if(fx.div===2) unit="hand";
    const out={name:it.name, v:vn, unit:unit, sets:sets}; if(time) out.time=true;
    return out;
  });
  o.gym=o.gym||null; o.v=4;
  return o;
}
function loadHist(){
  HIST=[];
  const keys=[];
  for(let i=0;i<appStore.length;i++){ const k=appStore.key(i); if(k && k.indexOf(P+"hist:")===0) keys.push(k); }
  keys.forEach(k=>{
    try{
      let o=JSON.parse(appStore.getItem(k)); if(!o || !o.items) return;
      if(o.v!==4){ o=migrateRec(o); appStore.setItem(k, JSON.stringify(o)); }
      let fx=false; (o.items||[]).forEach(it=>{ if(it.time&&!it.timeUnit){it.sets.forEach(s=>{ const v=num(s.t); if(v>0 && v<=10){ s.t=String(Math.round(v*60)); } });it.timeUnit="seconds";fx=true;} });
      if(fx) appStore.setItem(k, JSON.stringify(o));
      o._k=k; HIST.push(o);
    }catch(e){}
  });
  HIST.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
}
function histItems(name, vn, dkey){
  const out=[];
  HIST.forEach(r=>{ if(dkey!=null && r.day!==dkey) return;
    (r.items||[]).forEach(it=>{ if(it.name===name && (vn==null || it.v===vn)) out.push({rec:r, it:it}); }); });
  return out;
}
function lastFor(d,e){
  const ex=exAt(d,e),st=cur(d,e),items=histItems(ex.name,st.vn,null);
  return items.find(x=>x.rec.gym===GYMS[gym])||items[0]||null;
}
function stagFor(name, vn, scheme){
  if(topReps(scheme)>=15) return 0;
  let L=gymRecs(name, vn, gym).filter(x=>maxW(x.it.sets)>0);
  if(custom.lastDeload) L=L.filter(x=>x.rec.date>custom.lastDeload);
  if(L.length<3) return 0;
  const curMax=maxW(L[0].it.sets);
  let first=L[0];
  L.forEach(x=>{ if(maxW(x.it.sets)>=curMax) first=x; });
  const days=daysBetween(first.rec.date, L[0].rec.date);
  return days>=28 ? Math.floor(days/7) : 0;
}
function daysSince(dkey){
  const r=HIST.find(x=>x.day===dkey);
  return r ? daysBetween(r.date, localDate()) : null;
}

function setsHTML(e, st, w, time, u, probe){

    const isLast=i===st.sets.length-1;
    const legacyPlus=T.lastPlus && !probe && isLast && W && !time && !deloadOn();
    const pw = isLast && !time ? (probe || (legacyPlus ? Math.round((W+defStep(W,u))*100)/100 : 0)) : 0;
    const ph = time ? "сек" : (pw ? fmt(pw) : (W?fmt(W):"кг"));
    const mark = pw ? (T.kind==="anya" ? ' <i>+</i>' : '<i>+</i>') : '';

      ? `<span class="sn">Подход ${i+1}${mark}</span>`
      : `<span class="set-n ${pw?'pr':''}">${i+1}${mark}</span>`;
    const inputs = time
      ? `<div class="duration-fields"><label><input class="inp duration-min" type="text" inputmode="numeric" aria-label="Минуты" placeholder="0" value="${timeParts(s.t)[0]}" oninput="updDuration(${e},${i},0,this.value)"><span>мин</span></label><label><input class="inp duration-sec" type="text" inputmode="numeric" aria-label="Секунды" placeholder="00" value="${timeParts(s.t)[1]}" oninput="updDuration(${e},${i},1,this.value)"><span>сек</span></label></div>`
      : `<div class="f"><input class="inp ${pw?'probe':''}" type="text" inputmode="decimal" placeholder="${h(ph)}" value="${h(s.w)}" oninput="upd(${e},${i},'w',this.value)"></div>
         <span class="sep">/</span>
         <div class="f"><input class="inp" type="text" inputmode="numeric" placeholder="${top||'повт'}" value="${h(s.r)}" onchange="drawList()" oninput="upd(${e},${i},'r',this.value)"></div>`;
    const btn = T.kind==="anya"
      ? `<button class="chk ${s.done?'on':''}" onclick="tog(${e},${i})">${s.done?'<svg width="12" height="9" viewBox="0 0 13 10"><path d="M1 5l4 3.5L12 1" stroke="#241A21" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>':''}</button>`
      : `<button class="done ${s.done?'on':''}" onclick="tog(${e},${i})">✓</button>`;

    return `<div class="set">${num1}${inputs}${btn}</div>${extra}`;
  }).join("");

  return `<div class="card"><div class="card-top">
      <div class="slot"><span>${pos+1}. ${h(title)}${stagH}</span><span class="scheme" onclick="editScheme(${e})">${h(ex.scheme)}</span></div>
      ${groupNote}${sel}${board}${noteH}${edit}</div>
    <div class="sets"><div class="sets-labels"><span>№</span><span>${time?"Время, мин:сек":"Вес, "+unitLabel(u)}</span><span>${time?"":"Повторы"}</span><span>✓</span></div>${setsHTML(e,st,w,time,u,probe)}${comfort}${extraNote}</div>${lastHTML(L,day,e)}</div>`;
}

/* ── список ── */
function stagList(){
  const out=[];
  DAYS.forEach((dd,d)=>{ if(dd.temp) return; dd.ex.forEach((ex,e)=>{ if(isHidden(d,ex.name)) return;
    const st=cur(d,e); if(isTime(d,e,st.v)) return;
    const n=stagFor(ex.name, st.vn, ex.scheme); if(n) out.push([ex.name,n]); }); });
  return out;
}
function startDeload(){
  const end=new Date(); end.setDate(end.getDate()+6); const until=localDate(end);
  confirmM("Разгрузочная неделя?", "До "+ddmm(until)+" на всех тренировках: веса −15%, подходов на один меньше, без пробных подходов. Мышцы и связки отдохнут, после разгрузки веса обычно идут вверх.", function(){
    custom.deloadUntil=until; custom.lastDeload=until; saveCustom(); draw(); toast("Разгрузка до "+ddmm(until)); });
}
function endDeload(){ custom.deloadUntil=null; custom.lastDeload=localDate(); saveCustom(); draw(); toast("Разгрузка закончена"); }
function bannersHTML(){
  let out="";
  if(deloadOn()) out+=`<div class="dlb">🧘 Разгрузочная неделя до ${ddmm(custom.deloadUntil)}: веса −15%, подходов на 1 меньше. <button onclick="endDeload()">Закончить</button></div>`;
  else {
    const sl=stagList(), recent=custom.lastDeload && daysBetween(custom.lastDeload, localDate())<42;
    if(sl.length>=3 && !recent) out+=`<div class="dlb">📉 Застой: ${sl.slice(0,4).map(x=>h(x[0])+' '+x[1]+' нед').join(', ')}${sl.length>4?' и ещё '+(sl.length-4):''}. Пора на разгрузочную неделю. <button onclick="startDeload()">Начать</button></div>`;
  }
  const late=[];
  DAYS.forEach((x,i)=>{ if(x.temp) return; const n=daysSince(dk(i)); if(n!=null && n>7) late.push([x.name,n,i]); });
  late.sort((a,b)=>b[1]-a[1]);
  late.slice(0,3).forEach(([n,dd,i])=>{
    out+=`<div class="warn" onclick="setDay(${i})">⚠ ${i===day?'Этот день не тренировал':'«'+h(n)+'» — не было'} ${dd} дн.</div>`; });
  if(HIST.length){
    const le=custom.lastExport ? daysBetween(custom.lastExport.slice(0,10), localDate()) : null;
    if(le==null || le>7)
      out+=`<div class="nag" onclick="exportData()">💾 ${le==null?'Копию данных ещё не сохранял':'Копию не сохранял '+le+' дн.'} — нажми, выгружу</div>`;
  }
  return out;
}
function drawList(){
  if(!DAYS[day]) day=0;
  const vis=DAYS[day].ex.map((ex,e)=>({ex,e})).filter(o=>!isHidden(day,o.ex.name));
  const cards=vis.map(({ex,e},pos)=>cardHTML(ex,e,pos,vis.length)).join("");
  const hid=hiddenList(day).length;
  $("#list").innerHTML = bannersHTML() + cards
    + `<button class="addex" onclick="addEx()">＋ добавить упражнение</button>`
    + (hid?`<button class="hidebtn" onclick="showHidden()">Скрытые упражнения: ${hid} — вернуть</button>`:"")
    + (DAYS[day].temp?`<button class="hidebtn danger" onclick="delTempDay()">Удалить разовую тренировку</button>`:"");
  drawStat();
}
function dayTon(){
  let v=0;
  DAYS[day].ex.forEach((ex,e)=>{ if(isHidden(day,ex.name)) return;
    const st=cur(day,e); if(isTime(day,e,st.v)) return;
    const m=mult(unitOf(day,e,st.v));
    st.sets.forEach(s=>{ v+=num(s.w)*num(s.r)*m; }); });
  return v;
}
function drawStat(){
  let done=0,all=0;
  DAYS[day].ex.forEach((ex,e)=>{if(isHidden(day,ex.name))return;cur(day,e).sets.forEach(s=>{all++;if(s.done)done++})});
  const volume=dayTon(),percent=all?Math.round(done/all*100):0;
  $("#stat").innerHTML='<div class="stat-line"><span>Выполнено <b>'+done+' из '+all+'</b> подходов</span><span class="stat-volume">'+(volume?Math.round(volume).toLocaleString("ru-RU")+' кг':percent+'%')+'</span></div><div class="progress-track" role="progressbar" aria-label="Выполненные подходы" aria-valuenow="'+done+'" aria-valuemin="0" aria-valuemax="'+all+'"><div class="progress-fill" style="width:'+percent+'%"></div></div>';
}

function draw(){ drawHeader(); drawList(); }

/* ── действия ── */
function setDay(i){ if(workoutSaving){toast("Дождись сохранения тренировки");return;} if(!DAYS[i])return;day=i;rememberProgramDay();saveCustom();closeModal(); hideHist(); draw(); save(true); window.scrollTo(0,0); }
function setGym(i){ if(workoutSaving){toast("Дождись сохранения тренировки");return;} gym=i; draw(); save(true); }
function setVar(e,v){
  if(workoutSaving)return;const ex=exAt(day,e),st=cur(day,e),variant=ex.vars[+v];if(!variant||variant.name===st.vn)return;
  st.variantDrafts=st.variantDrafts||{};st.variantDrafts[st.vn]={sets:programCopy(st.sets),extraSets:programCopy(st.extraSets||[]),comfortable:!!st.comfortable};
  const draft=st.variantDrafts[variant.name]||{sets:[],extraSets:[],comfortable:false};
  Object.assign(st,programCopy(draft));st.autoVariant=false;st.planRevision=415;st.gymContext=GYMS[gym];st.v=+v;st.vn=variant.name;
  drawList();save(true);
}
function timeParts(t){const n=Math.max(0,Math.round(num(t)));return t===''||t==null?['','']:[String(Math.floor(n/60)),String(n%60)]}
function updDuration(e,i,part,value){
  if(workoutSaving)return;const st=cur(day,e),s=st.sets[i],parts=timeParts(s.t);
  const n=Math.max(0,Math.floor(num(value)));parts[part]=value===''?'':String(part===1?Math.min(59,n):n);
  s.t=parts.every(x=>x==='')?'':String(num(parts[0])*60+num(parts[1]));s.timeUnit='seconds';drawStat();save(true);
}
function setComfort(e,value){if(workoutSaving)return;cur(day,e).comfortable=!!value;save(true)}
function workoutSets(st){return [...(st.sets||[]),...(st.extraSets||[])]}
function upd(e,i,f,val){ if(workoutSaving)return; cur(day,e).sets[i][f]=val; drawStat(); save(true); }
function tog(e,i){
  if(workoutSaving)return;
  unlockAudio();
  const st=cur(day,e), s=st.sets[i];
  s.done=!s.done;
  if(s.done){
    if(isTime(day,e,st.v)){
      if(!s.t){ const L=lastFor(day,e); if(L&&L.it.time) s.t=String(maxT(L.it.sets)); }
    } else if(!s.w){
      const w=num(recWeight(day,e)), u=unitOf(day,e,st.v);
      const isLast=i===st.sets.length-1, pb=probeFor(day,e);
      s.w = !w ? "" : (isLast && pb ? fmt(pb) : (isLast && T.lastPlus && !deloadOn() ? fmt(Math.round((w+defStep(w,u))*100)/100) : fmt(w)));
    }
    startRest(st.sets.every(x=>x.done));
  } else {
    stopRest();   // сняла/снял галочку — отдых отменяется
  }
  drawList(); save(true);
}
function fillLast(e, quiet){
  const L=lastFor(day,e); if(!L){ if(!quiet) toast("Записей ещё нет"); return false; }
  const ex=exAt(day,e), st=cur(day,e);
  const vi=ex.vars.findIndex(v=>v.name===L.it.v);
  if(vi>=0){ st.v=vi; st.vn=ex.vars[vi].name; }
  const src=L.it.sets;
  st.sets.forEach((s,i)=>{ const p=src[i]||src[src.length-1]||{};
    if(L.it.time){ s.t=p.t||""; } else { s.w=p.w||""; s.r=p.r||""; }
    s.done=false; });
  if(!quiet){ drawList(); save(true); toast("Заполнено как "+ddmm(L.rec.date)); }
  return true;
}
function fillAll(){
  let n=0;
  DAYS[day].ex.forEach((ex,e)=>{ if(!isHidden(day,ex.name) && fillLast(e,true)) n++; });
  closeModal(); drawList(); save(true); toast(n?`Заполнено упражнений: ${n}`:"Записей ещё нет");
}

/* ── меню карточки ── */
function cardMenu(e){
  const ex=exAt(day,e), st=cur(day,e), v=ex.vars[st.v];

function pickUnit(e){
  const st=cur(day,e), u=unitOf(day,e,st.v);
  const opt=(val,t,s)=>`<button class="mitem" onclick="setUnit(${e},'${val}')">${u===val?'● ':''}${t}<small>${s}</small></button>`;
  openModal("Как считать вес", `<div class="mnote">${h(st.vn)}<br>Для гантелей: «на руку» — пишешь вес одной гантели (22), «пара» — сумму двух (44). Тоннаж считается правильно в обоих случаях.</div>`
    + opt("hand","На одну гантель","кг/рука") + opt("pair","За пару","кг · пара") + opt("","Обычный вес","тренажёр, штанга"));
}
function setUnit(e,nu){
  const st=cur(day,e), old=unitOf(day,e,st.v);
  if(old===nu){ closeModal(); return; }
  for(let g=0; g<GYMS.length; g++){
    const k=wKey(day,e,st.v,g);
    if(custom.w[k]!=null) custom.w[k]=Math.round(convW(num(custom.w[k]),old,nu)*10)/10;
    else { const w=num(wGet(day,e,st.v,g)); if(w) custom.w[k]=Math.round(convW(w,old,nu)*10)/10; }
  }
  custom.unit=custom.unit||{}; custom.unit[uKey(day,e,st.v)]=nu;
  saveCustom(); closeModal(); drawList(); toast("Теперь: "+unitLabel(nu));
}
function editNote(e){
  const ex=exAt(day,e), k=dk(day)+"||"+ex.name+"||"+GYMS[gym];
  custom.notes=custom.notes||{};
  openModal("Заметка · "+GYMS[gym], `<div class="mnote">${h(ex.name)}. Например: «сиденье на 4», «блок справа».</div>
    <input id="mi" class="minput" type="text" value="${h(custom.notes[k]||"")}" placeholder="Заметка">
    <div class="mrow"><button class="mitem mbtn" onclick="__clearNote()">Удалить</button>
    <button class="mitem mbtn ok" onclick="__saveNote()">Сохранить</button></div>`);
  window.__saveNote=function(){ const v=(document.getElementById("mi").value||"").trim();
    if(v) custom.notes[k]=v; else delete custom.notes[k]; saveCustom(); closeModal(); drawList(); };
  window.__clearNote=function(){ delete custom.notes[k]; saveCustom(); closeModal(); drawList(); };

}

/* ── скрытие / удаление ── */
function doHide(n){
  custom.hidden=custom.hidden||{};
  custom.hidden[dk(day)]=(custom.hidden[dk(day)]||[]).filter(x=>x!==n).concat([n]);
  saveCustom(); closeModal(); draw(); toast("Убрано с экрана");
}
function doDelete(n){
  const i=DAYS[day].ex.findIndex(x=>x.name===n); if(i<0) return;
  delete state[key(day,i)];
  DAYS[day].ex.splice(i,1);
  custom.ex[dk(day)]=(custom.ex[dk(day)]||[]).filter(x=>normEx(x,true).name!==n);
  if(!custom.ex[dk(day)].length) delete custom.ex[dk(day)];
  custom.order=custom.order||{}; custom.order[dk(day)]=DAYS[day].ex.map(x=>x.name);
  saveCustom(); closeModal(); save(true); draw(); toast("Удалено");
}
function doDelVar(e){
  const ex=exAt(day,e), st=cur(day,e), v=ex.vars[st.v];
  if(!v || !v.mine) return;
  ex.vars.splice(st.v,1);
  const k=key(day,e);
  custom.vars[k]=(custom.vars[k]||[]).filter(x=>normVar(x,true).name!==v.name);
  if(!custom.vars[k].length) delete custom.vars[k];
  st.v=0; st.vn=ex.vars[0].name; saveCustom(); closeModal(); drawList(); toast("Вариант удалён");
}
function showHidden(){
  openModal("Скрытые упражнения", `<div class="mnote">Они остались в программе, просто не показываются в этот день.</div>`
    + hiddenList(day).map(n=>`<button class="mitem" onclick="unhide('${esc(n)}')">${h(n)}<small>вернуть</small></button>`).join(""));
}
function unhide(n){
  if(workoutSaving)return;
  custom.hidden[dk(day)]=hiddenList(day).filter(x=>x!==n);
  if(!custom.hidden[dk(day)].length) delete custom.hidden[dk(day)];
  saveCustom(); closeModal(); draw(); toast("Возвращено");
}

/* ── схема подходов ── */
const SCHEMES=["5×5","4×6","4×8","4×10","4×12","3×8","3×10","3×12","3×15","3×20"];
function editScheme(e){
  const ex=exAt(day,e);
  openModal("Схема подходов", `<div class="mnote">${h(ex.name)}<br>сейчас: <b>${h(ex.scheme)}</b></div>`
    + SCHEMES.map(s=>`<button class="mitem" onclick="setScheme(${e},'${s}')">${s}<small>${parseInt(s)} подх.</small></button>`).join("")
    + `<button class="mitem" onclick="setSchemeCustom(${e})">Своя схема…</button>`);
}
function setScheme(e,s){
  if(workoutSaving)return;
  s=String(s).replace(/(\d)\s*[xх]\s*(\d)/i,"$1×$2");
  const ex=exAt(day,e); let n=parseInt(s); if(!n||n<1||n>10) n=3;
  ex.scheme=s; ex.n=n;
  custom.schemes=custom.schemes||{}; custom.schemes[dk(day)+"|"+ex.name]={s:s,n:n};
  saveCustom(); closeModal(); drawList(); toast("Схема "+s);
}
function setSchemeCustom(e){ askText("Своя схема","Например 6×8","4×8",v=>setScheme(e,v)); }

/* ── база упражнений ── */
function allExercises(){
  const map={};
  DAYS.forEach(d=>d.ex.forEach(ex=>{ if(!map[ex.name]) map[ex.name]={name:ex.name, scheme:ex.scheme, n:ex.n, vars:ex.vars, motto:ex.motto}; }));
  return Object.values(map);
}
function showBase(){
  const mine=allExercises();
  let html=`<div class="mnote">Нажми упражнение — выберешь день. Оно встанет наверх списка, дальше двигаешь стрелками.</div>`;
  html+=`<div class="mgroup">В программе</div>` + mine.map(x=>`<div class="mitem" onclick="pickDayFor('${esc(x.name)}')">${h(x.name)}
      <small>${h(x.scheme)}</small><span class="ytmini" onclick="event.stopPropagation();watch('${esc(x.name)}')">▶</span></div>`).join("");
  Object.keys(CATALOG).forEach(g=>{
    html+=`<div class="mgroup">${h(g)}</div>` + CATALOG[g].map(x=>{
      const have=mine.some(m=>m.name===x[0]);
      return `<div class="mitem" onclick="pickDayFor('${esc(x[0])}')">${h(x[0])}<small>${h(x[1])} · ${h(x[2])}${have?" ✓":""}</small>
        <span class="ytmini" onclick="event.stopPropagation();watch('${esc(x[0])}')">▶</span></div>`; }).join("");
  });
  openModal("База упражнений", html);
}
function pickDayFor(name){
  openModal("В какой день добавить?", `<div class="mnote">${h(name)}</div>`
    + DAYS.map((d,i)=>`<button class="mitem" onclick="addFromBase('${esc(name)}',${i})">${h(d.name)}${d.temp?' <small>разовая</small>':''}</button>`).join(""));
}
function addFromBase(name, d){
  let src=allExercises().find(x=>x.name===name);
  if(!src) Object.keys(CATALOG).forEach(g=>CATALOG[g].forEach(x=>{
    if(x[0]===name) src={name:x[0], scheme:x[2], n:parseInt(x[2])||3, vars:[{name:x[0], w:[0]}], motto:""}; }));
  if(!src) return;
  if(DAYS[d].ex.some(q=>q.name===name)){
    if(isHidden(d,name)){ custom.hidden[dk(d)]=hiddenList(d).filter(x=>x!==name); saveCustom(); setDay(d); toast("Возвращено в день"); }
    else { setDay(d); toast("Это упражнение уже есть в дне"); }
    return;
  }
  const o={name:src.name, scheme:src.scheme, n:src.n, motto:src.motto||"", mine:true,
           vars:src.vars.map(v=>({name:v.name, w:v.w.slice(), mine:true}))};
  custom.ex=custom.ex||{}; custom.ex[dk(d)]=custom.ex[dk(d)]||[];
  custom.ex[dk(d)].unshift(exOut(o));
  DAYS[d].ex.unshift(o);
  custom.order=custom.order||{}; custom.order[dk(d)]=DAYS[d].ex.map(x=>x.name);
  saveCustom(); setDay(d); toast("Добавлено наверх списка");
}

/* ── разовая тренировка / залы ── */
function addTempDay(){
  askText("Разовая тренировка","Например: только плечи","",function(n){
    const id="t"+Date.now().toString(36);
    custom.temp=custom.temp||[]; custom.temp.push({id:id, name:n, ex:[]});
    saveCustom(); applyCustom(); day=DAYS.length-1; draw();
    toast("Пустой день создан — добавь упражнения");
  });
}
function delTempDay(){
  if(!DAYS[day].temp) return;
  confirmM("Удалить «"+DAYS[day].name+"»?","Записанные тренировки останутся в истории.",function(){
    const id=DAYS[day].id;
    custom.temp=(custom.temp||[]).filter(t=>t.id!==id);
    Object.keys(state).forEach(k=>{ if(k.indexOf(id+"||")===0) delete state[k]; });
    delete (custom.hidden||{})[id]; delete (custom.order||{})[id]; delete (custom.ex||{})[id];
    saveCustom(); applyCustom(); day=0; draw(); save(true); toast("Удалено");
  });
}
function addGym(){
  askText("Новый зал","Название","",function(n){

    const g=GYMS.length;
    GYMS.push(n); custom.gyms=GYMS.slice(); gym=g;
    saveCustom(); draw(); toast("Зал добавлен — при наличии истории покажу ориентир из другого зала");
  });
}
function editGym(){
  const c=GYMS[gym], historyCount=HIST.filter(r=>r.gym===c).length;
  openModal("Зал «"+h(c)+"»", `<div class="mnote">Переименование обновит название в ${historyCount} тренировках истории.</div><input id="mi" class="minput" type="text" value="${h(c)}">
     <div class="mrow"><button class="mitem mbtn" onclick="closeModal()">Отмена</button>
     <button class="mitem mbtn ok" onclick="__renameGym()">Переименовать и обновить историю</button></div>
     ${GYMS.length>1?`<button class="mitem danger" style="margin-top:10px" onclick="__delGym()">Удалить зал вместе с весами</button>`:""}`);
  window.__renameGym=function(){
    const v=(document.getElementById("mi").value||"").trim(); closeModal(); if(!v||v===c) return;
    Object.keys(custom.notes||{}).forEach(k=>{ const p=k.split("||"); if(p[2]===c){ custom.notes[p[0]+"||"+p[1]+"||"+v]=custom.notes[k]; delete custom.notes[k]; } });
    GYMS[gym]=v; for(let i=0;i<appStore.length;i++){const hk=appStore.key(i);if(!hk||hk.indexOf(P+"hist:")!==0)continue;try{const r=JSON.parse(appStore.getItem(hk));if(r.gym===c){r.gym=v;appStore.setItem(hk,JSON.stringify(r))}}catch(e){}} custom.gyms=GYMS.slice(); saveCustom(); loadHist(); draw(); toast("Зал переименован вместе с историей");
  };
  window.__delGym=function(){
    const historyCount=HIST.filter(r=>r.gym===c).length;const weightCount=Object.keys(custom.w||{}).filter(k=>+k.split("||")[3]===gym).length;confirmM("Удалить зал «"+c+"»?","Удалятся рабочие веса: "+weightCount+". Записей истории: "+historyCount+" — они останутся.",function(){
      const del=gym; GYMS.splice(del,1);
      const nw={};
      Object.keys(custom.w||{}).forEach(k=>{ const p=k.split("||"); const g=+p[3];
        if(g===del) return; nw[p[0]+"||"+p[1]+"||"+p[2]+"||"+(g>del?g-1:g)]=custom.w[k]; });
      custom.w=nw; custom.gyms=GYMS.slice(); gym=0;

/* ── таймер отдыха ──
   Между подходами — custom.rest, между упражнениями — custom.restEx.
   Сигнал на заблокированном экране: проигрываем аудиодорожку нужной длины
   (тишина + звонок в конце). Медиа-звук iOS не глушит ни блокировка, ни беззвучный режим. */
let restEnd=0, restTm=null, actx=null, restLong=false, restAudioOn=false;
const restAudio=(typeof Audio!=="undefined")?new Audio():null;
const wavCache={};
function unlockAudio(){
  try{ if(!actx){ const C=window.AudioContext||window.webkitAudioContext; if(C) actx=new C(); }
       if(actx && actx.state==="suspended") actx.resume(); }catch(e){}
}
function beep(){
  try{ if(!actx) return;
    [0,0.32,0.64].forEach((t,i)=>{ const o=actx.createOscillator(), g=actx.createGain();
      o.frequency.value=i===2?1320:880; o.connect(g); g.connect(actx.destination);
      const s=actx.currentTime+t; g.gain.setValueAtTime(0.0001,s);
      g.gain.exponentialRampToValueAtTime(0.5,s+0.02); g.gain.exponentialRampToValueAtTime(0.0001,s+0.26);
      o.start(s); o.stop(s+0.28); });
  }catch(e){}
}
function restWav(sec){
  if(wavCache[sec]) return wavCache[sec];
  const sr=8000, n=Math.round((sec+2.2)*sr), b=new Uint8Array(44+n), v=new DataView(b.buffer);
  const str=(o,s)=>{ for(let i=0;i<s.length;i++) b[o+i]=s.charCodeAt(i); };
  str(0,"RIFF"); v.setUint32(4,36+n,true); str(8,"WAVE"); str(12,"fmt "); v.setUint32(16,16,true);
  v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,sr,true); v.setUint32(28,sr,true);
  v.setUint16(32,1,true); v.setUint16(34,8,true); str(36,"data"); v.setUint32(40,n,true);
  b.fill(128,44);
  const tone=(at,dur,f)=>{ const s0=Math.round(at*sr), len=Math.round(dur*sr);
    for(let i=0;i<len && s0+i<n;i++){ const env=Math.min(1,i/80,(len-i)/80);
      b[44+s0+i]=128+Math.round(115*env*Math.sin(2*Math.PI*f*i/sr)); } };
  [0,0.35,0.7].forEach(d=>tone(sec+d,0.22,880)); tone(sec+1.05,0.9,1320);
  return wavCache[sec]=URL.createObjectURL(new Blob([b],{type:"audio/wav"}));
}
function restAudioPlay(sec, label){
  restAudioOn=false;
  if(!restAudio || custom.restSig!=="lock") return;
  try{
    restAudio.src=restWav(sec); restAudio.currentTime=0;
    const p=restAudio.play(); if(p&&p.then) p.then(()=>{ restAudioOn=true; }).catch(()=>{ restAudioOn=false; });
    if("mediaSession" in navigator && window.MediaMetadata)
      navigator.mediaSession.metadata=new MediaMetadata({title:label+" "+mmss(sec), artist:"Тренировки"});
  }catch(e){ restAudioOn=false; }
}
let wakeLock=null;
async function keepAwake(on){
  try{
    if(on && !wakeLock && navigator.wakeLock){ wakeLock=await navigator.wakeLock.request("screen"); wakeLock.addEventListener&&wakeLock.addEventListener("release",()=>{ wakeLock=null; }); }
    if(!on && wakeLock){ const w=wakeLock; wakeLock=null; await w.release(); }
  }catch(e){ wakeLock=null; }
}
function flash(on){ const f=$("#flash"); if(f) f.className=on?"flash on":"flash"; }
function startRest(exDone){
  flash(false);
  restLong=!!exDone;
  const sec=+(restLong?custom.restEx:custom.rest)||0; if(!sec){ stopRest(); return; }
  restEnd=Date.now()+sec*1000;
  restAudioPlay(sec, restLong?"Отдых до упражнения":"Отдых");
  if(custom.restAwake!==false) keepAwake(true);
  tickRest();
}
function stopRest(){ restEnd=0; clearTimeout(restTm); try{ restAudio && restAudio.pause(); }catch(e){} restAudioOn=false;
  flash(false); keepAwake(false);
  const el=$("#rest"); if(el) el.className="rest"; }
function tickRest(){
  clearTimeout(restTm); const el=$("#rest"); if(!el) return;
  if(!restEnd){ el.className="rest"; return; }
  const left=Math.ceil((restEnd-Date.now())/1000);
  if(left<=0){
    restEnd=0;
    if(custom.restSig==="beep" && !restAudioOn) beep();
    el.innerHTML=(restLong?"⏰ Время! Следующее упражнение":"⏰ Время! Следующий подход")+`<span class="x">✕</span>`;
    el.className="rest show end"; flash(true);
    return;   // мигает, пока не тапнешь по плашке или не отметишь следующий подход
  }
  el.innerHTML=`⏱ ${restLong?'до упражнения':'отдых'} <b>${mmss(left)}</b> <span class="x">✕</span>`; el.className="rest show";
  restTm=setTimeout(tickRest,250);
}
try{ document.addEventListener("visibilitychange",()=>{ if(!document.hidden && restEnd) tickRest(); }); }catch(e){}
function pickRest(){
  const a=[0,60,90,120,150,180], b=[0,120,150,180,240,300], sig=custom.restSig||"flash";
  const sigRow=(v,ttl,sub)=>`<button class="mitem" onclick="__setSig('${v}')">${sig===v?'● ':''}${ttl}<small>${sub}</small></button>`;
  const row=(v,curv,fn)=>`<button class="mitem" onclick="${fn}(${v})">${(+curv||0)===v?'● ':''}${v?mmss(v):'Выключен'}</button>`;
  openModal("Таймер отдыха", `<div class="mnote">Отметил подход ✓ — пошёл отсчёт. Закрыл последний подход упражнения — включается длинный отдых.</div>
    <div class="mgroup">Между подходами</div>${a.map(v=>row(v,custom.rest,"__setRest")).join("")}
    <div class="mgroup">Между упражнениями</div>${b.map(v=>row(v,custom.restEx,"__setRestEx")).join("")}
    <div class="mgroup">Сигнал в конце</div>
    ${sigRow("flash","Красная мигающая плашка","без звука, музыка не трогается")}
    ${sigRow("beep","Мигание + писк","пищит, только когда приложение открыто")}
    ${sigRow("lock","Мигание + звонок на блокировке","ставит музыку на паузу")}
    <div class="mgroup">Экран</div>
    <button class="mitem" onclick="__setAwake()">${custom.restAwake!==false?'● ':''}Не гасить экран во время отдыха<small>${custom.restAwake!==false?'вкл':'выкл'}</small></button>
    <div class="mnote">Чтобы мигание было видно, экран во время отдыха не гаснет. После тапа по плашке снова гаснет как обычно.</div>`);
  window.__setRest=function(s){ custom.rest=s; saveCustom(); pickRest(); };
  window.__setRestEx=function(s){ custom.restEx=s; saveCustom(); pickRest(); };
  window.__setSig=function(v){ custom.restSig=v; saveCustom(); pickRest(); };
  window.__setAwake=function(){ custom.restAwake=(custom.restAwake===false); saveCustom(); pickRest(); };
}

  const now=Date.now();

      else sets=workoutSets(st).filter(s=>s.w||s.r).map(s=>({w:String(s.w||(s.r&&recWeight(savedDay,e,savedGym)?fmt(recWeight(savedDay,e,savedGym)):"")), r:String(s.r||"")}));

    }catch(refreshErr){

let histGym="*";
function spark(v){

  const w=104,hh=26,mn=Math.min(...v),mx=Math.max(...v),rg=(mx-mn)||1;
  const p=v.map((x,i)=>[(i/(v.length-1))*w, hh-2-((x-mn)/rg)*(hh-6)]);
  const d=p.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  const L=p[p.length-1];
  return `<svg width="${w}" height="${hh}" style="display:block"><path d="${d}" stroke="${T.accent}" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${L[0].toFixed(1)}" cy="${L[1].toFixed(1)}" r="2.6" fill="${T.accent}"/></svg>`;
}
function weekStart(s){ const d=new Date(s+"T12:00:00"); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return localDate(d); }
function weeksHTML(){
  const now=weekStart(localDate()), weeks=[];
  for(let i=7;i>=0;i--){ const d=new Date(now+"T12:00:00"); d.setDate(d.getDate()-i*7); weeks.push(localDate(d)); }
  const ton={}, cnt={};
  HIST.forEach(r=>{ if(histGym!=="*" && r.gym!==histGym) return; const w=weekStart(r.date); ton[w]=(ton[w]||0)+recTon(r); cnt[w]=(cnt[w]||0)+1; });
  const mx=Math.max(1,...weeks.map(w=>ton[w]||0));
  return `<div class="hcard"><div class="hname">Тоннаж по неделям <small>все дни</small></div><div class="weeks">`
    + weeks.map(w=>{ const v=ton[w]||0;
        return `<div class="wk"><div class="wkv">${v?Math.round(v/1000*10)/10+'т':''}</div><div class="wkb"><i style="height:${Math.round(v/mx*100)}%"></i></div><div class="wkl">${ddmm(w)}</div><div class="wkn">${cnt[w]?cnt[w]+' тр':'—'}</div></div>`; }).join("")
    + `</div></div>`;
}
function showHist(){
  const dkey=dk(day), box=$("#hist");
  const names=new Set(DAYS[day].ex.map(x=>x.name));
  const H=HIST.filter(r=>(histGym==="*"||r.gym===histGym)&&(DAYS[day].program?(r.items||[]).some(it=>names.has(it.name)):r.day===dkey)).map(r=>DAYS[day].program?{...r,items:r.items.filter(it=>names.has(it.name))}:r);
  const gymsIn=[...new Set(HIST.map(r=>r.gym).filter(Boolean))];
  const chips=`<div class="hchips"><button class="gym ${histGym==="*"?'on':''}" onclick="__hg('*')">Все залы</button>`
    + gymsIn.map(g=>`<button class="gym ${histGym===g?'on':''}" onclick="__hg('${esc(g)}')">${h(g)}</button>`).join("")+`</div>`;
  window.__hg=function(g){ histGym=g; showHist(); };
  let body="";
  if(!H.length){
    body=`<div class="hempty">По этому дню${histGym!=="*"?" в этом зале":""} записей нет. Заполни подходы и нажми «Готово».</div>`;
  } else {
    body+=`<div class="hcard"><div class="hname">Тренировки</div>`
      + H.slice(0,10).map(r=>`<div class="hrow"><span class="hdate">${ddmm(r.date)}</span><span class="hsets">${r.gym?h(r.gym)+" · ":""}${r.items.length} упр. · <b>${Math.round(recTon(r))}</b> кг</span></div>`).join("")
      + `</div>`;
    const groups=[], seen={};
    H.forEach(r=>r.items.forEach(it=>{ const k=it.name+"||"+it.v; if(!seen[k]){ seen[k]=1; groups.push({name:it.name, v:it.v}); } }));
    body+=groups.map(gp=>{
      const rows=[]; H.forEach(r=>r.items.forEach(it=>{ if(it.name===gp.name && it.v===gp.v) rows.push({rec:r, it:it}); }));
      const time=rows[0].it.time, u=rows[0].it.unit||"";
      const ser=rows.map(x=>time?maxT(x.it.sets):convW(maxW(x.it.sets), x.it.unit||"", u)).reverse().filter(x=>x>0);
      let tr="";
      if(ser.length>1){ const d=Math.round((ser[ser.length-1]-ser[0])*10)/10;
        tr = d>0?`<span class="up">+${time?mmss(d):fmt(d)+' кг'}</span>`:d<0?`<span class="dn">−${time?mmss(-d):fmt(-d)+' кг'}</span>`:`<span class="fl">без изменений</span>`; }
      const exd=DAYS[day].ex.find(x=>x.name===gp.name);
      const st=time?0:stagFor(gp.name, gp.v, exd?exd.scheme:"");
      const list=rows.slice(0,8).map(x=>{
        const sets = time ? x.it.sets.map(s=>mmss(num(s.t))).join("  ")
          : x.it.sets.map(s=>{ const w=s.w?fmt(convW(num(s.w),x.it.unit||"",u)):"—"; return s.r?`${w}<i>×${s.r}</i>`:w; }).join("  ");
        return `<div class="hrow"><span class="hdate">${ddmm(x.rec.date)}</span><span class="hsets">${sets}</span>${x.rec.gym?`<span class="hg">${h(x.rec.gym)}</span>`:""}</div>`;
      }).join("");
      return `<div class="hcard"><div class="hname">${h(gp.name)}${gp.v&&gp.v!==gp.name?`<small>${h(gp.v)}</small>`:(!gp.v?`<small>вариант не записан</small>`:"")}</div>
        <div class="htop2">${tr}${st?`<span class="stag">застой ${st} нед</span>`:""}<span class="hcnt">${rows.length} трен.${time?'':' · '+unitLabel(u)}</span>${spark(ser)}</div>${list}</div>`;
    }).join("");
  }
  box.innerHTML=`<div class="hwrap"><div class="hhead"><b>История — ${h(DAYS[day].name)}</b>
    <button class="btn ghost" onclick="hideHist()">Закрыть</button></div>${chips}${weeksHTML()}${body}</div>`;
  box.style.display="block"; box.scrollTop=0;
}
function hideHist(){ const b=$("#hist"); if(b) b.style.display="none"; }

/* ── экспорт / импорт ── */
function markExported(){ custom.lastExport=new Date().toISOString(); saveCustom(); drawList(); }
function dumpObj(){
  const hist={};
  for(let i=0;i<appStore.length;i++){ const k=appStore.key(i); if(k && k.indexOf(P+"hist:")===0) hist[k]=appStore.getItem(k); }
  return {v:4, app:P, saved:new Date().toISOString(), state, custom, gyms:GYMS, hist, current:{gym,day,dayKey:dk(day),program:custom.program||"classic"}};
}
function exportData(){
  const text=JSON.stringify(dumpObj());
  const name=T.file+"-"+localDate()+".json";
  const blob=new Blob([text],{type:"application/json"});
  try{
    const file=new File([blob], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){
      navigator.share({files:[file]}).then(markExported).catch(err=>{ if(!err || err.name!=="AbortError") showDump(text,name); });
      return;
    }
  }catch(e){}
  try{
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ try{ document.body.removeChild(a); }catch(e){} },500);
    markExported(); toast("Файл сохранён"); return;
  }catch(e){}
  showDump(text,name);
}
function showDump(text){
  openModal("Выгрузка", `<div class="mnote">Скопируй весь текст и сохрани в заметки. Восстановить — Меню → «Вставить выгрузку текстом».</div>
    <textarea id="dumparea" class="minput" style="height:210px;font-size:11px;font-family:ui-monospace,monospace"></textarea>
    <div class="mrow"><button class="mitem mbtn" onclick="closeModal()">Закрыть</button>
    <button class="mitem mbtn ok" onclick="__copyDump()">Скопировать</button></div>`);
  document.getElementById("dumparea").value=text;
  window.__copyDump=function(){ const t=document.getElementById("dumparea");
    try{ t.select(); t.setSelectionRange(0,9999999);
      if(navigator.clipboard) navigator.clipboard.writeText(t.value); else document.execCommand("copy");
      markExported(); toast("Скопировано"); }catch(e){ toast("Выдели текст и скопируй вручную"); } };
}
function showTextImport(){
  openModal("Вставить выгрузку", `<div class="mnote">Вставь сюда сохранённый текст выгрузки.</div>
    <textarea id="imparea" class="minput" style="height:210px;font-size:11px;font-family:ui-monospace,monospace" placeholder="{...}"></textarea>
    <div class="mrow"><button class="mitem mbtn" onclick="closeModal()">Отмена</button>
    <button class="mitem mbtn ok" onclick="__applyText()">Загрузить</button></div>`);
  window.__applyText=function(){ const t=document.getElementById("imparea").value; closeModal(); applyDump(t); };
}
let pendingImport=null;
function historyPlan(o){const entries=[],existing=[];for(let i=0;i<appStore.length;i++){const k=appStore.key(i);if(k&&k.indexOf(P+"hist:")===0)try{const r=JSON.parse(appStore.getItem(k));if(r&&Array.isArray(r.items))existing.push({k,r})}catch(e){}}Object.keys(o.hist||{}).forEach(k=>{try{let r=o.hist[k];if(typeof r==="string")r=JSON.parse(r);if(r&&Array.isArray(r.items)&&r.date)entries.push({key:k.indexOf(P+"hist:")===0?k:P+"hist:"+k.split("hist:").pop(),r})}catch(e){}});let add=0,merge=0,conflict=0;const plan=[];entries.forEach(x=>{const same=existing.find(y=>y.r.date===x.r.date&&String(y.r.day)===String(x.r.day)&&y.r.gym===x.r.gym);if(same){const have=new Set(same.r.items.map(i=>i.name+"||"+i.v)),missing=x.r.items.filter(i=>!have.has(i.name+"||"+i.v));if(missing.length){const merged=JSON.parse(JSON.stringify(same.r));merged.items.push(...missing);plan.push({key:same.k,rec:merged});merge++}}else{let key=x.key;if(existing.some(y=>y.k===key)){conflict++;key=x.key+":"+encodeURIComponent(x.r.gym||"")+":import";let n=1;while(existing.some(y=>y.k===key)||plan.some(y=>y.key===key))key=x.key+":"+encodeURIComponent(x.r.gym||"")+":import"+(n++)}plan.push({key,rec:x.r});existing.push({k:key,r:x.r});add++}});return{plan,add,merge,conflict,total:entries.length}}
function applyDump(txt){try{const o=JSON.parse(txt);if(!o||typeof o!=="object"||(!o.hist&&!o.state&&!o.custom))throw Error("invalid");const review=historyPlan(o);pendingImport={o,review};const panel='<div class="mnote">Записей в файле: <b>'+review.total+'</b><br>Добавится: <b>'+review.add+'</b><br>Дополнится упражнениями: <b>'+review.merge+'</b><br>Конфликтов ключей: <b>'+review.conflict+'</b><br><br>Текущая история сохранится. Программа и настройки будут заменены данными копии.</div><div class="mrow"><button class="mitem mbtn" onclick="pendingImport=null;closeModal()">Отмена</button><button class="mitem mbtn ok" onclick="commitImport()">Продолжить</button></div>';openModal("Проверка резервной копии",panel)}catch(e){toast("Не удалось прочитать копию — проверь файл")}}
async function commitImport(){
  if(!pendingImport||workoutSaving)return;const p=pendingImport;pendingImport=null;closeModal();
  try{
    p.review.plan.forEach(x=>appStore.setItem(x.key,JSON.stringify(x.rec)));
    if(p.o.state){const merged={...state};Object.entries(p.o.state).forEach(([k,incoming])=>{const existing=state[k],filled=existing&&[...(existing.sets||[]),...(existing.extraSets||[])].some(s=>s.w||s.r||s.t||s.done);if(!filled)merged[k]=incoming});state=merged}
    if(p.o.custom){const previous=custom;custom=Object.assign(blankCustom(),p.o.custom);["program","programOptions","programCursors"].forEach(k=>{if(!Object.prototype.hasOwnProperty.call(p.o.custom,k)&&previous[k]!=null)custom[k]=previous[k]})}
    if(Array.isArray(p.o.gyms)&&p.o.gyms.length)GYMS=p.o.gyms.slice();else if(custom.gyms)GYMS=custom.gyms.slice();custom.gyms=GYMS.slice();
    loadHist();applyCustom();gym=0;day=0;
    if(p.o.current)restoreCurrent({...p.o.current,state});else{const next=(custom.programCursors||{})[custom.program||"classic"],i=next?dIdx(next):-1;if(i>=0)day=i}
    clearTimeout(sv);saveCustom();appStore.setItem(P+"current",JSON.stringify(currentEnvelope()));await appStore.flush();migrateV2(p.o.last||{});migrateV4();loadHist();applyCustom();draw();toast("Копия импортирована; история и веса подключены");
  }catch(e){console.warn(e);toast("Импорт не завершён — данные не удалены")}
}

function importData(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>applyDump(rd.result); rd.readAsText(f);
}
function restoreSeed(){
  confirmM("Вернуть архив?","Добавятся только те записи архива, которых у тебя нет. Текущие данные не пострадают.",function(){
    let n=0;
    try{ Object.keys(SEED.hist||{}).forEach(k=>{ if(!appStore.getItem(k)){ appStore.setItem(k, SEED.hist[k]); n++; } }); }catch(e){}
    if(SEED.custom && Object.keys(custom.w||{}).length < Object.keys(SEED.custom.w||{}).length){
      custom=Object.assign(blankCustom(), JSON.parse(JSON.stringify(SEED.custom))); GYMS=(custom.gyms||GYMS).slice();
      applyCustom(); migrateV2(); migrateV4(); saveCustom();
    }
    loadHist(); draw(); toast(n?"Возвращено записей: "+n:"Всё уже на месте");
  });
}

/* ── миграции ── */
function migrateV2(oldLast){
  if(custom.v2) return;
  try{
    for(let d=0; d<DAYS.length; d++){
      const base=dk(d);
      for(let e=0; e<DAYS[d].ex.length; e++){
        const oldK=base+":"+e, newK=key(d,e);
        if(state[oldK]!==undefined && state[newK]===undefined) state[newK]=state[oldK];
        delete state[oldK];
        if(custom.vars && custom.vars[oldK]!==undefined && custom.vars[newK]===undefined){ custom.vars[newK]=custom.vars[oldK]; delete custom.vars[oldK]; }
        DAYS[d].ex[e].vars.forEach((v,vi)=>{ for(let g=0; g<GYMS.length; g++){
          const ok=base+":"+e+":"+vi+":"+g;
          if(custom.w && custom.w[ok]!==undefined){ const nk=wKey(d,e,vi,g); if(custom.w[nk]===undefined) custom.w[nk]=custom.w[ok]; } } });
      }
    }
    Object.keys(custom.w||{}).forEach(k=>{ if(k.indexOf("||")<0) delete custom.w[k]; });
  }catch(e){}
  custom.v2=true;
}
function migrateV4(){
  if(custom.v4) return;
  try{
    Object.keys(custom.schemes||{}).forEach(k=>{ const s=custom.schemes[k]; s.s=String(s.s).replace(/(\d)\s*[xх]\s*(\d)/i,"$1×$2"); });
    (T.wdel||[]).forEach(k=>{ delete custom.w[k]; });
    Object.keys(T.wfix||{}).forEach(k=>{ for(let g=0; g<GYMS.length; g++){ if(custom.w[k+"||"+g]==null) custom.w[k+"||"+g]=T.wfix[k]; } });
    const kill=[]; for(let i=0;i<appStore.length;i++){ const k=appStore.key(i); if(k && k.indexOf(P+"last:")===0) kill.push(k); }
    kill.forEach(k=>appStore.removeItem(k));
    custom.unit=custom.unit||{}; custom.notes=custom.notes||{};
    if(custom.rest==null) custom.rest=120;
  }catch(e){}
  custom.v4=true; saveCustom(); applyCustom();
}

function seedHistory(){
  Object.keys(SEED.hist||{}).forEach(k=>{
    let incoming; try{incoming=JSON.parse(SEED.hist[k]);}catch(e){return;}
    if(!incoming||!Array.isArray(incoming.items)) return;
    let target=k,current=null;
    for(let n=0;n<20;n++){
      const raw=appStore.getItem(target);
      if(!raw) break;
      try{current=JSON.parse(raw);}catch(e){current=null;}
      if(current&&current.v===4&&current.date===incoming.date&&String(current.day)===String(incoming.day)&&current.gym===incoming.gym) break;
      current=null;
      target=k+":"+encodeURIComponent(incoming.gym||"")+":"+String(n);
    }
    if(!current){appStore.setItem(target,JSON.stringify(incoming));return;}
    if(!Array.isArray(current.items)) current.items=[];
    const have=new Set(current.items.filter(Boolean).map(it=>it.name));
    let changed=false;
    (incoming.items||[]).forEach(it=>{if(it&&it.name&&!have.has(it.name)){current.items.push(it);have.add(it.name);changed=true;}});
    if(changed) appStore.setItem(target,JSON.stringify(current));
  });
}
window.onerror=function(m){ try{ console.warn("Перехвачено:", m); }catch(e){} return true; };

/* ── запуск ── */
(async function boot(){
  await appStore.ready;
  try{
    let has=false;
    for(let i=0;i<appStore.length;i++){ const k=appStore.key(i); if(k && k.indexOf(P+"hist:")===0){ has=true; break; } }
    const flag=P+"seeded:"+(T.seedId||"0");
    if(SEED.hist && (!has || !appStore.getItem(flag))) seedHistory();
    appStore.setItem(flag,"1");
    if(!appStore.getItem(P+"custom") && SEED.custom) appStore.setItem(P+"custom", JSON.stringify(SEED.custom));
    if(!appStore.getItem(P+"current") && SEED.state) appStore.setItem(P+"current", JSON.stringify({state:SEED.state,gym:0,day:0}));
    await appStore.flush();
  }catch(e){}
  try{ const rc=appStore.getItem(P+"custom"); if(rc) custom=Object.assign(blankCustom(), JSON.parse(rc)); }catch(e){}
  if(Array.isArray(custom.gyms) && custom.gyms.length) GYMS=custom.gyms.slice();
  if(custom.rest==null) custom.rest=120;
  if(custom.restEx==null) custom.restEx=180;
  if(!custom.restSig) custom.restSig="flash";
  applyCustom();
  let pendingRecovery=null;
  try{const raw=appStore.getItem(P+"current");if(raw){const o=JSON.parse(raw);restoreCurrent(o);pendingRecovery=o.pendingCompletion||null}}catch(e){}
  migrateV2(); migrateV4();
  loadHist();applyCustom();
  if(pendingRecovery){
    const rec=HIST.find(r=>r.completionId===pendingRecovery.id);
    if(rec){
      (pendingRecovery.names||rec.items.map(it=>it.name)).forEach(name=>{const st=state[pendingRecovery.dayKey+"||"+name];if(st){workoutSets(st).forEach(s=>{s.w="";s.r="";s.t="";s.done=false});st.comfortable=false}});
      if(rec.program===(custom.program||"classic")&&rec.nextDayKey){const idx=dIdx(rec.nextDayKey);if(idx>=0){day=idx;rememberProgramDay();saveCustom()}}
      appStore.setItem(P+"current",JSON.stringify(currentEnvelope()));await appStore.flush();
    }
  }
  try{ draw(); }catch(err){ $("#list").innerHTML='<div style="padding:20px;color:#C8102E">Ошибка: '+h(err.message)+'</div>'; }
  $("#saveBtn").onclick=saveWorkout;
  $("#rest").onclick=stopRest;
})().catch(err=>{console.error(err);$("#list").innerHTML='<div class="mnote">Не удалось загрузить приложение: '+h(err.message)+'. Данные сайта сохранены. Перезагрузи страницу.</div>'});

try{ if("serviceWorker" in navigator && location.protocol.indexOf("http")===0) navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>reg.update()).catch(()=>{}); }catch(e){}
