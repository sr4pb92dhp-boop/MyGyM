<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тренировки</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тренировки">
<meta name="theme-color" content="#14171C">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --iron:#14171C; --surface:#1E232B; --surface2:#262C36; --line:#333B47;
  --chalk:#F2F0EB; --mute:#8B95A5;
  --red:#C8102E; --blue:#1266B0; --green:#2A8A4A; --yellow:#F2C300;
  --day:var(--blue);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--iron);color:var(--chalk);
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  padding-bottom:80px;
}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}

/* ── шапка ── */
header{
  position:sticky;top:0;z-index:20;background:var(--iron);
  padding-top:env(safe-area-inset-top);
  border-bottom:1px solid var(--line);
}
.days{display:flex;gap:6px;padding:12px 14px 8px}
.day{
  flex:1;border:none;border-radius:10px;padding:11px 6px;cursor:pointer;
  background:var(--surface);color:var(--mute);
  font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;font-weight:600;
  text-transform:uppercase;letter-spacing:.04em;line-height:1.15;
  border-bottom:3px solid transparent;transition:.15s;
}
.day.on{background:var(--surface2);color:var(--chalk)}
.day.on[data-d="0"]{border-bottom-color:var(--blue)}
.day.on[data-d="1"]{border-bottom-color:var(--red)}
.day.on[data-d="2"]{border-bottom-color:var(--green)}

.bar{display:flex;align-items:center;gap:8px;padding:0 14px 12px}
.bar-label{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;flex-shrink:0}
.gyms{display:flex;gap:5px;flex:1}
.gym{
  flex:1;border:1px solid var(--line);background:transparent;color:var(--mute);
  border-radius:8px;padding:7px 4px;font-size:12px;font-weight:600;cursor:pointer;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;transition:.15s;
}
.gym.on{background:var(--chalk);color:var(--iron);border-color:var(--chalk)}
.gym.add{flex:0 0 38px;border-style:dashed;font-size:15px}

/* ── карточка упражнения ── */
.card{
  background:var(--surface);border-radius:14px;margin:12px 0;overflow:hidden;
  border-left:3px solid var(--day);
}
.card-top{padding:14px 16px 12px}
.slot{
  font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;font-weight:500;
  color:var(--mute);text-transform:uppercase;letter-spacing:.1em;
  display:flex;justify-content:space-between;align-items:center;
}
.scheme{color:var(--day);font-weight:600}
.pick{
  width:100%;margin-top:8px;background:var(--surface2);color:var(--chalk);
  border:1px solid var(--line);border-radius:9px;padding:11px 12px;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px;font-weight:500;
  appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%238B95A5' stroke-width='2' fill='none'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;padding-right:34px;
}
.pick:disabled{opacity:.55;background-image:none}

/* сигнатура: табло веса */
.board{
  display:flex;align-items:baseline;gap:10px;margin-top:12px;
  padding-top:12px;border-top:1px solid var(--line);
}
.board-num{
  font-family:"Helvetica Neue",Arial,sans-serif;font-size:44px;font-weight:700;transform:scaleX(.92);transform-origin:left;
  line-height:.85;font-variant-numeric:tabular-nums;letter-spacing:-.01em;
}
.board-unit{font-family:"Helvetica Neue",Arial,sans-serif;font-size:15px;color:var(--mute);font-weight:500}
.board-tag{
  margin-left:auto;font-size:10px;color:var(--mute);text-transform:uppercase;
  letter-spacing:.08em;text-align:right;line-height:1.4;
}

/* ── подходы ── */
.sets{border-top:1px solid var(--line);background:rgba(0,0,0,.15)}
.set{
  display:flex;align-items:center;gap:8px;padding:9px 16px;
  border-bottom:1px solid rgba(51,59,71,.5);
}
.set:last-child{border-bottom:none}
.set-n{
  font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;color:var(--mute);
  width:20px;flex-shrink:0;font-weight:500;
}
.inp{
  background:var(--surface2);border:1px solid var(--line);border-radius:8px;
  color:var(--chalk);font-family:"Helvetica Neue",Arial,sans-serif;font-size:17px;font-weight:600;
  padding:8px 6px;text-align:center;width:100%;min-width:0;
  font-variant-numeric:tabular-nums;
}
.inp:focus{outline:none;border-color:var(--day);background:#2C3441}
.inp::placeholder{color:#4E5765;font-weight:400}
.f{flex:1;min-width:0}
.sep{color:var(--mute);font-size:14px;flex-shrink:0}
.mini{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.done{
  width:34px;height:34px;flex-shrink:0;border-radius:8px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--mute);
  font-size:15px;line-height:1;
}
.done.on{background:var(--day);border-color:var(--day);color:#fff}

.edit{display:flex;gap:6px;margin-top:8px}
.ebtn{
  flex:1;background:transparent;border:1px dashed var(--line);color:var(--mute);
  border-radius:8px;padding:7px;font-size:12px;font-weight:500;cursor:pointer;
  font-family:-apple-system,sans-serif;
}
.ebtn:active{background:var(--surface2)}
.ebtn.mv{flex:0 0 42px;font-size:15px;line-height:1}
.ebtn.mv:disabled{opacity:.25}
.ebtn.del{flex:0 0 42px;color:#C8102E;border-color:rgba(200,16,46,.35)}
.board-num{cursor:pointer}
.addex{
  width:100%;margin:6px 0 20px;background:transparent;border:1px dashed var(--line);
  color:var(--mute);border-radius:12px;padding:14px;font-size:14px;font-weight:600;
  cursor:pointer;font-family:-apple-system,sans-serif;
}
.addex:active{background:var(--surface)}
.hint{padding:9px 16px;font-size:11px;color:var(--mute);border-top:1px solid rgba(51,59,71,.5)}
.hint b{color:var(--chalk);font-weight:600}

/* ── низ ── */
.foot{
  position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--iron);
  border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:8px;align-items:center;max-width:640px;margin:0 auto;
}
.stat{flex:1;font-size:11px;color:var(--mute);line-height:1.35}
.stat b{color:var(--chalk);font-family:"Helvetica Neue",Arial,sans-serif;font-size:16px;font-weight:600}
.btn{
  border:none;border-radius:10px;padding:12px 18px;cursor:pointer;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;font-weight:600;
  background:var(--day);color:#fff;
}
.btn.ghost{background:var(--surface2);color:var(--mute)}
.toast{
  position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--chalk);color:var(--iron);padding:11px 18px;border-radius:10px;
  font-size:13px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:40;
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.title{
  font-family:"Helvetica Neue",Arial,sans-serif;font-size:19px;font-weight:600;
  text-transform:uppercase;letter-spacing:.03em;margin:16px 0 2px;
}
.sub{font-size:12px;color:var(--mute);margin-bottom:4px}

#hist{position:fixed;inset:0;z-index:50;background:var(--iron);overflow-y:auto;
  padding:14px 14px calc(24px + env(safe-area-inset-bottom));padding-top:calc(14px + env(safe-area-inset-top))}
.hwrap{max-width:600px;margin:0 auto}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.hhead b{font-size:16px;font-weight:600}
.hempty{opacity:.6;font-size:13px;line-height:1.6;padding:26px 4px}
.hcard{background:CARD;border-radius:13px;padding:13px 15px;margin-bottom:11px;border:1px solid LINE}
.hname{font-size:14.5px;font-weight:600;margin-bottom:7px}
.htop2{display:flex;align-items:center;gap:9px;margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid LINE}
.htop2 .up{color:#4CAF6D;font-size:12.5px;font-weight:600}
.htop2 .dn{color:#C8102E;font-size:12.5px;font-weight:600}
.htop2 .fl{opacity:.55;font-size:12.5px}
.hcnt{opacity:.5;font-size:11.5px;margin-right:auto}
.hrow{display:flex;gap:11px;padding:4px 0;font-size:12.5px}
.hdate{opacity:.55;width:44px;flex-shrink:0;font-variant-numeric:tabular-nums}
.hsets{font-variant-numeric:tabular-nums}
.hsets i{opacity:.5;font-style:normal}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ── доработки v2 ── */
.tab.wide{flex:0 0 40px;font-size:16px;padding:11px 2px}
.hidebtn{width:100%;margin:2px 0 16px;background:transparent;border:1px dashed var(--line);
  color:var(--mute);border-radius:10px;padding:10px;font-size:12px;cursor:pointer;
  font-family:-apple-system,sans-serif}
.scheme{display:inline-block;border:1px solid var(--line);border-radius:6px;
  padding:1px 7px;font-size:11px;color:var(--chalk);cursor:pointer;margin-left:7px;
  font-family:-apple-system,sans-serif;font-weight:600}
.eb.hide{flex:0 0 38px;color:var(--mute)}
.tempmark{color:var(--yellow);font-size:10px;margin-left:5px}
#modal{position:fixed;inset:0;z-index:60;background:rgba(15,17,22,.88);
  display:none;overflow-y:auto;padding:0 14px 40px;
  padding-top:calc(20px + env(safe-area-inset-top))}
.mwrap{max-width:600px;margin:0 auto}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.mhead b{font-size:16px}
.mgroup{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);
  margin:16px 0 7px}
.mitem{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  color:var(--chalk);border-radius:11px;padding:13px 15px;font-size:14px;margin-bottom:7px;
  cursor:pointer;font-family:-apple-system,sans-serif;display:flex;align-items:center;gap:9px}
.mitem:active{background:var(--surface2)}
.mitem small{color:var(--mute);font-size:11.5px;margin-left:auto;text-align:right}
.mnote{color:var(--mute);font-size:12px;line-height:1.6;margin:4px 0 14px}

<body>

<header>
  <div class="days" id="days"></div>
  <div class="bar">
    <span class="bar-label">Зал</span>
    <div class="gyms" id="gyms"></div>
  </div>
</header>

<div class="wrap">
  <div class="title" id="dayTitle"></div>
  <div class="sub" id="daySub"></div>
  <div id="list"></div>
</div>

<div class="foot">
  <div class="stat" id="stat"></div>
  <button class="btn ghost" onclick="showHist()">📈</button>
  <button class="btn ghost" onclick="exportData()">⤓</button>
  <label class="btn ghost" style="cursor:pointer">⤒<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label>
  <button class="btn ghost" id="clearBtn">Сброс</button>
  <button class="btn" id="saveBtn">Готово</button>
</div>

let GYMS = ["Грисмолл","Весна","Нежинская"];
let custom = {vars:{}, ex:{}, order:{}, gyms:null, w:{}, hidden:{}, schemes:{}, temp:[]};
let state = {}, last = {};
let day = 0, gym = 0, view = "day";
let DAYS = [];
const $ = s => document.querySelector(s);

/* ── дни: базовые + разовые ── */
function buildDays(){
  DAYS = BASE.map(d => ({name:d.name, id:null, ex:d.ex.map(x=>[x[0],x[1],x[2],x[3].map(v=>[v[0],v[1].slice(),v[2]]),x[4]])}));
  (custom.temp||[]).forEach(t=>{
    DAYS.push({name:t.name, id:t.id, temp:true,
      ex:(t.ex||[]).map(x=>[x[0],x[1],x[2],x[3].map(v=>[v[0],v[1].slice(),true]),true])});
  });
}
function dk(d){ return DAYS[d] && DAYS[d].id ? DAYS[d].id : String(d); }   // ключ дня
function key(d,e){ return dk(d)+":"+e }
function wKey(d,e,vi,g){ return dk(d)+":"+e+":"+vi+":"+g }
function wGet(d,e,vi,g){
  const k=wKey(d,e,vi,g);
  if(custom.w && custom.w[k]!==undefined) return custom.w[k];
  const a=DAYS[d].ex[e][3][vi][1];
  return (a&&a[g]!==undefined)?a[g]:(a&&a[0]!==undefined?a[0]:0);
}
function wSet(d,e,vi,g,v){ custom.w=custom.w||{}; custom.w[wKey(d,e,vi,g)]=v; }
function cur(d,e){
  const k=key(d,e);
  if(!state[k]) state[k]={v:0, sets:Array.from({length:DAYS[d].ex[e][2]},()=>({w:"",r:"",done:false}))};
  const need=DAYS[d].ex[e][2], have=state[k].sets.length;
  if(have<need) for(let i=have;i<need;i++) state[k].sets.push({w:"",r:"",done:false});
  if(have>need) state[k].sets.length=need;
  return state[k];
}
function recWeight(d,e){ return wGet(d,e,cur(d,e).v,gym)||0; }
function hiddenList(d){ return (custom.hidden||{})[dk(d)] || []; }
function isHidden(d,name){ return hiddenList(d).includes(name); }

function applyCustom(){
  buildDays();
  Object.keys(custom.ex||{}).forEach(k=>{
    const d=DAYS.findIndex(x=>dk(DAYS.indexOf(x))===k);
    if(d<0) return;
    (custom.ex[k]||[]).forEach(x=>{
      if(!DAYS[d].ex.some(q=>q[0]===x[0]))
        DAYS[d].ex.unshift([x[0],x[1],x[2],x[3].map(v=>[v[0],v[1].slice(),true]),true]);
    });
  });
  Object.keys(custom.schemes||{}).forEach(k=>{
    const [dkey,name]=k.split("|");
    const d=DAYS.findIndex((x,i)=>dk(i)===dkey);
    if(d<0) return;
    const ex=DAYS[d].ex.find(q=>q[0]===name);
    if(ex){ ex[1]=custom.schemes[k].s; ex[2]=custom.schemes[k].n; }
  });
  Object.keys(custom.order||{}).forEach(k=>{
    const d=DAYS.findIndex((x,i)=>dk(i)===k);
    if(d<0) return;
    const want=custom.order[k], by={};
    DAYS[d].ex.forEach(x=>by[x[0]]=x);
    const out=[]; want.forEach(n=>{ if(by[n]){ out.push(by[n]); delete by[n]; } });
    DAYS[d].ex.forEach(x=>{ if(by[x[0]]) out.push(x); });
    if(out.length===DAYS[d].ex.length) DAYS[d].ex=out;
  });
  Object.keys(custom.vars||{}).forEach(k=>{
    const p=k.split(":"), dkey=p[0], e=+p[1];
    const d=DAYS.findIndex((x,i)=>dk(i)===dkey);
    if(d<0||!DAYS[d].ex[e]) return;
    (custom.vars[k]||[]).forEach(v=>{
      if(!DAYS[d].ex[e][3].some(q=>q[0]===v[0])) DAYS[d].ex[e][3].push([v[0],v[1].slice(),true]);
    });
  });
}
function saveCustom(){ try{ localStorage.setItem("gym:custom", JSON.stringify(custom)); }catch(e){} }
function askNum(m,d){ const r=prompt(m,d===undefined?"":String(d)); if(r===null) return null;
  const n=parseFloat(String(r).replace(",",".")); return isNaN(n)?0:n; }

function drawHeader(){
  $("#days").innerHTML = DAYS.map((x,i)=>
    `<button class="day ${view==="day"&&i===day?'on':''}" data-d="${i%3}" onclick="setDay(${i})">${x.name.replace(" + ","<br>+ ")}${x.temp?'<div class="tempmark">разовая</div>':''}</button>`).join("")
    + `<button class="day wide ${view==="base"?'on':''}" data-d="0" onclick="showBase()" title="База упражнений">📚</button>`
    + `<button class="day wide" data-d="1" onclick="addTempDay()" title="Разовая тренировка">＋</button>`;
  $("#gyms").innerHTML = GYMS.map((g,i)=>
    `<button class="gym ${i===gym?'on':''}" onclick="${i===gym?'editGym()':'setGym('+i+')'}">${g}</button>`).join("")
    + `<button class="gym add" onclick="addGym()">＋</button>`;
  $("#dayTitle").textContent = DAYS[day] ? DAYS[day].name : "";
  const hid = hiddenList(day).length;
  $("#daySub").textContent = DAYS[day]
    ? `Зал: ${GYMS[gym]} · ${DAYS[day].ex.filter(x=>!isHidden(day,x[0])).length} упражнений${hid?` · скрыто ${hid}`:""}`
    : "";
}

function drawList(){
  if(!DAYS[day]){ day=0; }
  const vis = DAYS[day].ex.map((ex,e)=>({ex,e})).filter(o=>!isHidden(day,o.ex[0]));
  const cards = vis.map(({ex,e},pos)=>{
    const [slot,scheme,nsets,vars] = ex;
    const st=cur(day,e), w=recWeight(day,e), lk=last[key(day,e)];
    const opts = vars.map((v,i)=>{
      const vw=wGet(day,e,i,gym);
      return `<option value="${i}" ${i===st.v?'selected':''}>${v[0]}${vw?' · '+vw+' кг':''}</option>`;
    }).join("");
    const sets = st.sets.map((s,i)=>`<div class="set">
        <span class="set-n">${i+1}</span>
        <div class="f"><input class="inp" type="text" inputmode="decimal" placeholder="${w||'кг'}"
          value="${s.w}" oninput="upd(${e},${i},'w',this.value)"></div>
        <span class="sep">/</span>
        <div class="f"><input class="inp" type="text" inputmode="numeric" placeholder="повт"
          value="${s.r}" oninput="upd(${e},${i},'r',this.value)"></div>
        <button class="done ${s.done?'on':''}" onclick="tog(${e},${i})">✓</button>
      </div>`).join("");
    const hint = lk ? `<div class="hint">Прошлый раз: <b>${lk.sets.map(s=>s.w?`${s.w}/${s.r||"?"}`:"—").join("  ")}</b></div>` : "";
    return `<div class="card">
      <div class="card-top">
        <div class="slot"><span>${pos+1}. ${slot}</span><span class="scheme" onclick="editScheme(${e})">${scheme}</span></div>
        <select class="pick" ${vars.length<2?'disabled':''} onchange="setVar(${e},this.value)">${opts}</select>
        <div class="board">
          <span class="board-num" onclick="editW(${e})">${w||"—"}</span><span class="board-unit">кг</span>
          <span class="board-tag">рекомендую<br>${GYMS[gym]}</span>
        </div>
        <div class="edit">
          <button class="eb mv" onclick="move(${e},-1)" ${pos===0?'disabled':''}>↑</button>
          <button class="eb mv" onclick="move(${e},1)" ${pos===vis.length-1?'disabled':''}>↓</button>
          <button class="eb yt" onclick="watch(vars[cur(day,${e}).v][0])" title="Как делать">▶</button>
          <button class="eb" onclick="addVar(${e})">＋ вариант</button>
          <button class="eb hide" onclick="hideEx(${e})" title="Убрать с экрана">✕</button>
        </div>
      </div>
      <div class="sets">${sets}</div>
      ${hint}
    </div>`;
  }).join("");

  const hid = hiddenList(day).length;
  const hidBtn = hid ? `<button class="hidebtn" onclick="showHidden()">Скрытые упражнения: ${hid} — вернуть</button>` : "";
  const delDay = DAYS[day].temp ? `<button class="hidebtn" style="color:#C8102E;border-color:rgba(200,16,46,.4)" onclick="delTempDay()">Удалить разовую тренировку</button>` : "";
  $("#list").innerHTML = cards
    + `<button class="addex" onclick="addEx()">＋ добавить упражнение</button>`
    + hidBtn + delDay;
  drawStat();
}

function drawStat(){
  let done=0,all=0,vol=0;
  DAYS[day].ex.forEach((ex,e)=>{
    if(isHidden(day,ex[0])) return;
    cur(day,e).sets.forEach(s=>{ all++; if(s.done) done++;
      const w=parseFloat(String(s.w).replace(",",".")), r=parseInt(s.r);
      if(w&&r) vol+=w*r; });
  });
  $("#stat").innerHTML = `<b>${done}</b>/${all} подходов${vol?` · тоннаж <b>${Math.round(vol)}</b> кг`:""}`;
}

/* ── базовые действия ── */
const setDay = i => { view="day"; day=i; drawHeader(); drawList(); save(true); };
const setGym = i => { gym=i; drawHeader(); drawList(); save(true); };
const setVar = (e,v) => { cur(day,e).v=+v; drawList(); save(true); };
const upd = (e,i,f,val) => { cur(day,e).sets[i][f]=val; drawStat(); save(true); };
const tog = (e,i) => { const s=cur(day,e).sets[i]; s.done=!s.done;
  if(s.done&&!s.w) s.w=String(recWeight(day,e)||""); drawList(); save(true); };

/* ── скрытие / возврат ── */
function hideEx(e){
  const n=DAYS[day].ex[e][0];
  custom.hidden=custom.hidden||{};
  custom.hidden[dk(day)]=(custom.hidden[dk(day)]||[]).concat([n]);
  saveCustom(); drawHeader(); drawList(); toast("Убрано с экрана — вернуть можно внизу");
};
function showHidden(){
  const list = hiddenList(day);
  openModal("Скрытые упражнения",
    `<div class="mnote">Они остались в программе, просто не показываются в этот день. Нажми, чтобы вернуть.</div>`
    + list.map(n=>`<button class="mitem" onclick="unhide('${esc(n)}')">${n}<small>вернуть</small></button>`).join(""));
};
function unhide(n){
  custom.hidden[dk(day)]=hiddenList(day).filter(x=>x!==n);
  if(!custom.hidden[dk(day)].length) delete custom.hidden[dk(day)];
  saveCustom(); closeModal(); drawHeader(); drawList(); toast("Возвращено");
};

/* ── схема подходов ── */
const SCHEMES = ["5×5","4×6","4×8","4×10","4×12","3×10","3×12","3×15","3×20"];
function editScheme(e){
  const ex=DAYS[day].ex[e];
  openModal("Схема подходов",
    `<div class="mnote">${ex[0]}<br>сейчас: <b>${ex[1]}</b></div>`
    + SCHEMES.map(s=>`<button class="mitem" onclick="setScheme(${e},'${s}')">${s}<small>${parseInt(s)} подх.</small></button>`).join("")
    + `<button class="mitem" onclick="setSchemeCustom(${e})">Своя схема…</button>`);
};
function setScheme(e,s){
  const ex=DAYS[day].ex[e];
  let n=parseInt(s); if(!n||n<1||n>10) n=3;
  ex[1]=s; ex[2]=n;
  custom.schemes=custom.schemes||{};

function setSchemeCustom(e){

};

/* ── база упражнений ── */
function allExercises(){
  const map={};
  BASE.forEach((d,di)=>d.ex.forEach(ex=>{
    map[ex[0]] = map[ex[0]] || {name:ex[0], scheme:ex[1], sets:ex[2], vars:ex[3], from:d.name};
  }));
  Object.keys(custom.ex||{}).forEach(k=>(custom.ex[k]||[]).forEach(x=>{
    map[x[0]] = map[x[0]] || {name:x[0], scheme:x[1], sets:x[2], vars:x[3], from:"мои"};
  }));
  return Object.values(map);
}
function showBase(){
  const mine = allExercises();
  let html = `<div class="mnote">Нажми упражнение — выберешь, в какой день его добавить. Оно встанет наверх списка, дальше двигаешь стрелками.</div>`;
  html += `<div class="mgroup">В моей программе</div>`;
  html += mine.map(x=>`<div class="mitem" onclick="pickDayFor('${esc(x.name)}')">${x.name}
      <small>${x.scheme}</small>
      <span class="ytmini" onclick="event.stopPropagation();watch('${esc(x.name)}')">▶</span></div>`).join("");
  Object.keys(CATALOG).forEach(g=>{
    html += `<div class="mgroup">${g}</div>`;
    html += CATALOG[g].map(x=>{
      const have = mine.some(m=>m.name===x[0]);
      return `<div class="mitem" onclick="pickDayFor('${esc(x[0])}')">${x[0]}
        <small>${x[1]} · ${x[2]}${have?" ✓":""}</small>
        <span class="ytmini" onclick="event.stopPropagation();watch('${esc(x[0])}')">▶</span></div>`;
    }).join("");
  });
  openModal("База упражнений", html);
}

function pickDayFor(name){
  const opts = DAYS.map((d,i)=>`<button class="mitem" onclick="addFromBase('${esc(name)}',${i})">${d.name}${d.temp?' <small>разовая</small>':''}</button>`).join("");
  openModal("В какой день добавить?", `<div class="mnote">${name}</div>`+opts);
};
function addFromBase(name, d){
  let src = allExercises().find(x=>x.name===name);
  if(!src){
    let found=null;
    Object.keys(CATALOG).forEach(g=>CATALOG[g].forEach(x=>{
      if(x[0]===name) found={name:x[0], scheme:x[2], sets:(parseInt(x[2])||3), vars:[[x[0],[0],true]], from:g};
    }));
    src=found;
  }
  if(!src) return;
  if(DAYS[d].ex.some(q=>q[0]===name)){
    // уже есть — просто вернём, если было скрыто
    if(isHidden(d,name)){
      custom.hidden[dk(d)]=hiddenList(d).filter(x=>x!==name);
      saveCustom(); closeModal(); setDay(d); toast("Возвращено в день");
    } else { closeModal(); setDay(d); toast("Это упражнение уже есть в дне"); }
    return;
  }
  const item=[src.name, src.scheme, src.sets, src.vars.map(v=>[v[0],v[1].slice(),true])];
  custom.ex=custom.ex||{}; custom.ex[dk(d)]=custom.ex[dk(d)]||[];
  custom.ex[dk(d)].unshift(item);
  DAYS[d].ex.unshift([item[0],item[1],item[2],item[3],true]);
  custom.order=custom.order||{}; custom.order[dk(d)]=DAYS[d].ex.map(x=>x[0]);
  saveCustom(); closeModal(); setDay(d); toast("Добавлено наверх списка");
};

/* ── разовая тренировка ── */
function addTempDay(){
  const n=prompt("Название разовой тренировки:","Только плечи");
  if(!n||!n.trim()) return;
  const id="t"+Date.now().toString(36);
  custom.temp=custom.temp||[];
  custom.temp.push({id:id, name:n.trim(), ex:[]});
  saveCustom(); applyCustom();
  day=DAYS.length-1; view="day";
  drawHeader(); drawList();
  toast("Пустой день создан — добавь упражнения из базы 📚");
};
function delTempDay(){
  if(!DAYS[day].temp) return;
  if(!confirm("Удалить «"+DAYS[day].name+"»? Записанные тренировки останутся в истории.")) return;
  const id=DAYS[day].id;
  custom.temp=(custom.temp||[]).filter(t=>t.id!==id);
  Object.keys(state).forEach(k=>{ if(k.startsWith(id+":")) delete state[k]; });
  Object.keys(last).forEach(k=>{ if(k.startsWith(id+":")) delete last[k]; });
  delete (custom.hidden||{})[id]; delete (custom.order||{})[id]; delete (custom.ex||{})[id];
  saveCustom(); applyCustom(); day=0; drawHeader(); drawList(); save(true); toast("Удалено");
};

/* ── залы ── */
function addGym(){
  const n=prompt("Название зала:"); if(!n||!n.trim()) return;
  const g=GYMS.length;
  DAYS.forEach((dd,d)=>dd.ex.forEach((ex,e)=>ex[3].forEach((v,vi)=>wSet(d,e,vi,g,wGet(d,e,vi,gym)))));
  GYMS.push(n.trim()); custom.gyms=GYMS.slice(); gym=g;
  saveCustom(); drawHeader(); drawList();
  toast("Зал добавлен — веса скопированы, поправь тапом по цифре");
};
function editGym(){
  const c=GYMS[gym];
  const r=prompt("Название зала (стереть и сохранить = удалить):",c);
  if(r===null) return;
  if(!r.trim()){
    if(GYMS.length<2){ toast("Последний зал не удалить"); return; }
    if(!confirm("Удалить зал «"+c+"» вместе с весами?")) return;
    const del=gym; GYMS.splice(del,1);
    const nw={};
    Object.keys(custom.w||{}).forEach(k=>{
      const p=k.split(":"), g=+p[3];
      if(g===del) return;
      nw[p[0]+":"+p[1]+":"+p[2]+":"+(g>del?g-1:g)]=custom.w[k];
    });
    custom.w=nw; custom.gyms=GYMS.slice(); gym=0;
    saveCustom(); drawHeader(); drawList(); toast("Зал удалён"); return;
  }
  GYMS[gym]=r.trim(); custom.gyms=GYMS.slice(); saveCustom(); drawHeader(); drawList();
};

/* ── перемещение / варианты / упражнения ── */
function move(e,dir){
  const L=DAYS[day].ex;
  const vis=L.map((x,i)=>i).filter(i=>!isHidden(day,L[i][0]));
  const at=vis.indexOf(e), t=vis[at+dir];
  if(t===undefined) return;
  [L[e],L[t]]=[L[t],L[e]];
  [state,last].forEach(obj=>{
    const a=obj[key(day,e)], b=obj[key(day,t)];
    if(a===undefined&&b===undefined) return;
    if(b===undefined) delete obj[key(day,e)]; else obj[key(day,e)]=b;
    if(a===undefined) delete obj[key(day,t)]; else obj[key(day,t)]=a;
  });
  const ca=custom.vars[key(day,e)], cb=custom.vars[key(day,t)];
  if(ca!==undefined||cb!==undefined){
    if(cb===undefined) delete custom.vars[key(day,e)]; else custom.vars[key(day,e)]=cb;
    if(ca===undefined) delete custom.vars[key(day,t)]; else custom.vars[key(day,t)]=ca;
  }
  custom.order=custom.order||{}; custom.order[dk(day)]=L.map(x=>x[0]);
  saveCustom(); save(true); drawList();
};
function addVar(e){
  const n=prompt("Название упражнения:"); if(!n||!n.trim()) return;
  const w=askNum("Рабочий вес, кг (0 — без веса):",0); if(w===null) return;
  const k=key(day,e); custom.vars[k]=custom.vars[k]||[];
  const arr=[]; arr[gym]=w;
  custom.vars[k].push([n.trim(),arr,true]);
  DAYS[day].ex[e][3].push([n.trim(),arr,true]);
  const vi=DAYS[day].ex[e][3].length-1;
  wSet(day,e,vi,gym,w); cur(day,e).v=vi;
  saveCustom(); drawList(); toast("Вариант добавлен");
};
function editW(e){
  const st=cur(day,e);
  const w=askNum("Рабочий вес в зале «"+GYMS[gym]+"», кг:", wGet(day,e,st.v,gym));
  if(w===null) return;
  wSet(day,e,st.v,gym,w); saveCustom(); drawList(); toast("Вес обновлён");
};
function addEx(){
  const n=prompt("Название упражнения:"); if(!n||!n.trim()) return;
  const sc=prompt("Схема (например 3×12):","3×12")||"3×12";
  let k=parseInt(sc); if(!k||k<1||k>10) k=3;
  const w=askNum("Рабочий вес, кг (0 — без веса):",0); if(w===null) return;
  const arr=[]; arr[gym]=w;
  const item=[n.trim(), sc.replace("x","×"), k, [[n.trim(),arr,true]]];
  custom.ex=custom.ex||{}; custom.ex[dk(day)]=custom.ex[dk(day)]||[];
  custom.ex[dk(day)].unshift(item);
  DAYS[day].ex.unshift([item[0],item[1],item[2],item[3],true]);   // НАВЕРХ списка
  wSet(day,0,0,gym,w);
  custom.order=custom.order||{}; custom.order[dk(day)]=DAYS[day].ex.map(x=>x[0]);
  saveCustom(); drawList(); toast("Добавлено наверх — двигай стрелками");
};

};

/* ── история ── */
function histFor(dkey){
  const out=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(!k||!k.startsWith("gym:hist:")) continue;
    if(!k.endsWith(":"+dkey)) continue;
    try{ const o=JSON.parse(localStorage.getItem(k)); if(o&&o.items) out.push(o); }catch(e){}
  }
  return out.sort((a,b)=>a.date<b.date?1:-1);
}
function maxW(sets){ let m=0; sets.forEach(s=>{const w=parseFloat(String(s.w).replace(",",".")); if(w>m)m=w;}); return m; }
function spark(v){
  if(v.length<2) return "";
  const w=104,h=26,mn=Math.min(...v),mx=Math.max(...v),rg=(mx-mn)||1;
  const p=v.map((x,i)=>[(i/(v.length-1))*w, h-2-((x-mn)/rg)*(h-6)]);
  const d=p.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  const L=p[p.length-1];
  return `<svg width="${w}" height="${h}" style="display:block"><path d="${d}" stroke="#C8102E" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${L[0].toFixed(1)}" cy="${L[1].toFixed(1)}" r="2.6" fill="#C8102E"/></svg>`;
}
function showHist(){
  const H=histFor(dk(day)), box=$("#hist");
  if(!H.length){
    box.innerHTML=`<div class="hwrap"><div class="hhead"><b>История — ${DAYS[day].name}</b>
      <button class="btn ghost" onclick="hideHist()">Закрыть</button></div>
      <div class="hempty">Пока пусто. Заполни подходы и нажми «Готово».</div></div>`;
    box.style.display="block"; return;
  }
  const names=[]; H.forEach(h=>h.items.forEach(it=>{ if(!names.includes(it.name)) names.push(it.name); }));
  const cards=names.map(n=>{
    const rows=H.filter(h=>h.items.some(it=>it.name===n))
      .map(h=>({date:h.date, sets:h.items.find(it=>it.name===n).sets}));
    const ser=rows.map(r=>maxW(r.sets)).reverse().filter(x=>x>0);
    let tr="";
    if(ser.length>1&&ser[0]){
      const d=+(ser[ser.length-1]-ser[0]).toFixed(1);
      tr = d>0?`<span class="up">+${d} кг</span>`:d<0?`<span class="dn">${d} кг</span>`:`<span class="fl">без изменений</span>`;
    }
    const list=rows.slice(0,8).map(r=>{
      const dd=r.date.slice(8,10)+"."+r.date.slice(5,7);
      return `<div class="hrow"><span class="hdate">${dd}</span><span class="hsets">${r.sets.map(s=>`${s.w||"—"}<i>/${s.r||"?"}</i>`).join("  ")}</span></div>`;
    }).join("");
    return `<div class="hcard"><div class="hname">${n}</div>
      <div class="htop2">${tr}<span class="hcnt">${rows.length} трен.</span>${spark(ser)}</div>${list}</div>`;
  }).join("");
  box.innerHTML=`<div class="hwrap"><div class="hhead"><b>История — ${DAYS[day].name}</b>
    <button class="btn ghost" onclick="hideHist()">Закрыть</button></div>${cards}</div>`;
  box.style.display="block";
};
function hideHist(){ $("#hist").style.display="none"; };

/* ── экспорт / импорт ── */
function exportData(){
  const dump={v:3, saved:new Date().toISOString(), state, last, custom, gyms:GYMS,
    hist:Object.keys(localStorage).filter(k=>k.startsWith("gym:hist:"))
      .reduce((a,k)=>(a[k]=localStorage.getItem(k),a),{})};
  const blob=new Blob([JSON.stringify(dump,null,1)],{type:"application/json"});
  const name="trenirovki-"+new Date().toISOString().slice(0,10)+".json";
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[new File([blob],name)]}))
    navigator.share({files:[new File([blob],name,{type:"application/json"})],title:"Тренировки"});
  else { const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); }
  toast("Файл готов");
};
function importData(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
    const o=JSON.parse(rd.result);
    state=o.state||{}; last=o.last||{};
    if(o.custom){ custom=Object.assign({vars:{},ex:{},order:{},w:{},hidden:{},schemes:{},temp:[]}, o.custom); }
    if(Array.isArray(o.gyms)&&o.gyms.length) GYMS=o.gyms.slice();
    else if(custom.gyms) GYMS=custom.gyms.slice();
    if(o.hist) Object.keys(o.hist).forEach(k=>localStorage.setItem(k,o.hist[k]));
    saveCustom(); applyCustom(); save(true); drawHeader(); drawList(); toast("Данные загружены");
  }catch(e){ toast("Файл не читается"); } };
  rd.readAsText(f);
};

try{
  if("serviceWorker" in navigator && location.protocol.startsWith("http"))
    navigator.serviceWorker.register("sw.js").catch(()=>{});
}catch(e){}
</script>
